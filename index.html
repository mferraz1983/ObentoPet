    function addDays(iso, days) { const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+days); return dateToISO(d); }

    function getOccurrencesInRange(client, startISO, endISO, clientReschedules = []) {
      if (client.frequency === "avulsa") return [];
      const rescheduledOriginals = new Set(clientReschedules.map(r => r.original_date));
      const rawOut = [];
      if (client.nextDate) {
        if (client.frequency === "mensal") {
          let cur = new Date(client.nextDate+"T00:00:00");
          const start = new Date(startISO+"T00:00:00");
          const end   = new Date(endISO+"T00:00:00");
          while (cur > start) { const p = new Date(cur); p.setMonth(p.getMonth()-1); cur = p; }
          while (cur <= end) {
            if (cur >= start) { const d = dateToISO(cur); if (!rescheduledOriginals.has(d)) rawOut.push(d); }
            const n = new Date(cur); n.setMonth(n.getMonth()+1); cur = n;
          }
        } else {
          const step = client.frequency === "semanal" ? 7 : 14;
          let cur = client.nextDate;
          while (cur > startISO) cur = addDays(cur, -step);
          while (cur <= endISO) {
            if (cur >= startISO && !rescheduledOriginals.has(cur)) rawOut.push(cur);
            cur = addDays(cur, step);
          }
        }
      }
      const result = new Set(rawOut);
      clientReschedules.forEach(r => { if (r.new_date >= startISO && r.new_date <= endISO) result.add(r.new_date); });
      return Array.from(result).sort();
    }

    function normLabel(s) {
      return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s-]/g,"").trim();
    }
    function suggestLabelFile(dog, tutor, allClients=[], editingId=null) {
      const base = normLabel(dog);
      if (!base) return "";
      const hasDup = allClients.some(c => c.id !== editingId && normLabel(c.dog) === base);
      if (hasDup) {
        const initials = (tutor||"").trim().split(/\s+/).map(w=>normLabel(w)[0]).filter(Boolean).join("");
        return initials ? `${base} - ${initials}` : base;
      }
      return base;
    }

              setAvulsaOrders(prev=>({...prev,[o.client_id]:(prev[o.client_id]||[]).filter(x=>x.id!==o.id)}));
            } else if (eventType==="UPDATE") {
              setAvulsaOrders(prev=>{
                const list=(prev[n.client_id]||[]).map(x=>x.id===n.id?{...x,date:n.date}:x);
                list.sort((a,b)=>a.date.localeCompare(b.date));
                return {...prev,[n.client_id]:list};
              });
            }
          })
          .on("postgres_changes",{event:"*",schema:"public",table:"clients"},({eventType,new:n,old:o})=>{
            if (eventType==="INSERT") setClients(prev=>{if(prev.some(c=>c.id===n.id))return prev;return [...prev,dbToClient(n)];});
            else if (eventType==="UPDATE") setClients(prev=>prev.map(c=>c.id===n.id?dbToClient(n):c));
            else if (eventType==="DELETE") setClients(prev=>prev.filter(c=>c.id!==o.id));
          })
          .on("postgres_changes",{event:"*",schema:"public",table:"delivery_reschedules"},({eventType,new:n,old:o})=>{
            if (eventType==="INSERT"||eventType==="UPDATE") {
              setReschedules(prev=>{
                const cid=n.client_id;
                const existing=(prev[cid]||[]).filter(r=>r.original_date!==n.original_date);
                return {...prev,[cid]:[...existing,{original_date:n.original_date,new_date:n.new_date}]};
              });
            } else if (eventType==="DELETE"&&o?.client_id) {
              setReschedules(prev=>({
                ...prev,[o.client_id]:(prev[o.client_id]||[]).filter(r=>r.original_date!==o.original_date)
              }));
            }
          })
          .subscribe((status)=>{
            setRealtimeOnline(status==="SUBSCRIBED");
          });
        return ()=>{ db.removeChannel(channel); };
      }, []);

        setSubscriberStockLog(prev=>({
          ...prev,[clientId]:[{date,amount:delta,reason,ts},...(prev[clientId]||[])].slice(0,100),
        }));
        try {
          const {data:rpcData, error:rpcErr} = await db.rpc("increment_subscriber_balance",{p_client_id:clientId,p_delta:delta});
          if (rpcErr || rpcData===null) {
            const curBal = (subscriberStock[clientId]||0)+delta;
            await db.from("subscriber_stock").upsert({client_id:clientId,balance:curBal});
          } else {
            setSubscriberStock(prev=>({...prev,[clientId]:rpcData}));

          await db.from("subscriber_stock_log").insert({client_id:clientId,date,amount:delta,reason,ts});

      const rescheduleDelivery = async (clientId, originalDate, newDate, scope, orderId) => {

        if (!client||!newDate||newDate===originalDate) return;
        try {

            await db.from("delivery_reschedules")
              .delete().eq("client_id",clientId).eq("original_date",originalDate);
            const {error} = await db.from("delivery_reschedules")
              .insert({client_id:clientId,original_date:originalDate,new_date:newDate});
            if (error) throw error;
            setReschedules(prev=>{

              return {...prev,[clientId]:[...existing,{original_date:originalDate,new_date:newDate}]};

          } else {

            if (error) throw error;
            setClients(prev=>prev.map(c=>c.id===clientId?{...c,nextDate:newDate}:c));
            await db.from("delivery_reschedules")
              .delete().eq("client_id",clientId).eq("original_date",originalDate);
            await db.from("delivery_reschedules")
              .insert({client_id:clientId,original_date:originalDate,new_date:"1900-01-01"});
            setReschedules(prev=>{
              const existing=(prev[clientId]||[]).filter(r=>r.original_date!==originalDate);
              return {...prev,[clientId]:[...existing,{original_date:originalDate,new_date:"1900-01-01"}]};
            });
          }
          setRescheduleModal(null);
          showToast(`Entrega de ${client.dog} reagendada!`);

            db.from("shelf_stock_log").select("*"),
            db.from("delivery_deduction").select("*"),
            db.from("snack_products").select("*"),
            db.from("snack_stock_log").select("*"),
            db.from("delivery_reschedules").select("*"),
            db.from("avulsa_orders").select("*"),
          ]);
          const backup = {
            exported_at: new Date().toISOString(),
            clients: c.data, status_log: sl.data,
            subscriber_stock: ss.data, subscriber_stock_log: ssl.data,
            shelf_products: sp.data, shelf_stock_log: spl.data,
            delivery_deduction: dd.data,
            snack_products: pp.data, snack_stock_log: ppl.data,
            delivery_reschedules: rs.data, avulsa_orders: ao.data,
          };
          const blob = new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
          const url  = URL.createObjectURL(blob);
          const a    = document.createElement("a");
          const date = todayISO();
          a.href=url; a.download=`obentopet_backup_${date}.json`;
          document.body.appendChild(a); a.click();
          document.body.removeChild(a); URL.revokeObjectURL(url);
          showToast("Backup exportado com sucesso!");
        } catch(err) {
          showToast(`Erro no backup: ${err.message}`,"error");
        }
      };

      // ── BAT generation ────────────────────────────────────────────────────
      const generateBat = (date, items) => {
        const comEtiqueta = items.filter(({client})=>client.labelFile);
        const semEtiqueta = items.filter(({client})=>!client.labelFile);
        const lines = [
          "@echo off","chcp 65001 > nul",
          `SET "BARTENDER=C:\\Program Files (x86)\\Seagull\\BarTender UltraLite\\BarTend.exe"`,
          `SET "PASTA=${PASTA_ETIQUETAS}"`,
          "",`echo ============================================`,
          `echo  ObentoPet - Etiquetas ${date}`,
          `echo  Total: ${comEtiqueta.length} etiqueta(s)`,
          `echo ============================================`,"",
        ];
        if (comEtiqueta.length===0) {
          lines.push("echo Nenhuma etiqueta configurada para este dia.");
        } else {
          comEtiqueta.forEach(({client})=>{
            lines.push(`echo Imprimindo: ${client.dog} — ${client.tutor}...`);
            lines.push(`"%BARTENDER%" /f="%PASTA%\\${client.labelFile}.btw" /p /x`);
            lines.push("");
          });
          lines.push(`echo ============================================`);
          lines.push(`echo  Todas as etiquetas enviadas!`);
          if (semEtiqueta.length>0) {
            lines.push("",`echo ATENCAO: ${semEtiqueta.length} entrega(s) sem etiqueta configurada:`);
            semEtiqueta.forEach(({client})=>lines.push(`echo   - ${client.dog} (${client.tutor})`));
          }
        }
        lines.push(`echo ============================================`,"pause");
        const content = lines.join("\r\n");
        const blob = new Blob(["\uFEFF"+content],{type:"text/plain;charset=utf-8"});
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href=url; a.download=`etiquetas_${date}.bat`;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
        showToast("Arquivo .bat gerado!");
      };

      // ── Computed deliveries ────────────────────────────────────────────────
      const weekStart = useMemo(()=>{
        const d=new Date(); d.setDate(d.getDate()+weekOffset*7-d.getDay()); return dateToISO(d);
      },[weekOffset]);
      const weekDays = useMemo(()=>Array.from({length:7},(_,i)=>addDays(weekStart,i)),[weekStart]);

      const getDeliveriesForRange = useCallback((startISO, endISO) => {
        const recurring = clients
          .filter(c=>c.frequency!=="avulsa")
          .flatMap(c=>getOccurrencesInRange(c,startISO,endISO,reschedules[c.id]||[]).map(date=>({client:c,date,orderId:null})));
        const avulsa = clients
          .filter(c=>c.frequency==="avulsa")
          .flatMap(c=>{
            const orders = avulsaOrders[c.id];
            if (orders&&orders.length>0)
              return orders.filter(o=>o.date>=startISO&&o.date<=endISO).map(o=>({client:c,date:o.date,orderId:o.id}));
            if (c.nextDate>=startISO&&c.nextDate<=endISO) return [{client:c,date:c.nextDate,orderId:null}];
            return [];
          });
        return [...recurring,...avulsa].sort((a,b)=>a.date.localeCompare(b.date)||a.client.tutor.localeCompare(b.client.tutor));
      },[clients,reschedules,avulsaOrders]);

      const todayDeliveries = useMemo(()=>{
        const t=todayISO();
        return getDeliveriesForRange(t,t);
      },[getDeliveriesForRange]);

      const weekDeliveries = useMemo(()=>{
        const map = Object.fromEntries(weekDays.map(d=>[d,[]]));
        clients.filter(c=>c.frequency!=="avulsa").forEach(c=>{
          getOccurrencesInRange(c,weekDays[0],weekDays[6],reschedules[c.id]||[]).forEach(d=>{
            if (map[d]) map[d].push({client:c,orderId:null});
          });
        });
        clients.filter(c=>c.frequency==="avulsa").forEach(c=>{
          const orders=avulsaOrders[c.id];
          if (orders&&orders.length>0) {
            orders.filter(o=>o.date>=weekDays[0]&&o.date<=weekDays[6]).forEach(o=>{if(map[o.date])map[o.date].push({client:c,orderId:o.id});});
          } else if (c.nextDate>=weekDays[0]&&c.nextDate<=weekDays[6]) {
            if(map[c.nextDate]) map[c.nextDate].push({client:c,orderId:null});
          }
        });
        Object.keys(map).forEach(d=>map[d].sort((a,b)=>a.client.tutor.localeCompare(b.client.tutor)));
        return map;
      },[clients,weekDays,reschedules,avulsaOrders]);

      const filteredClients = useMemo(()=>{
        const q=search.trim().toLowerCase();
        return q?clients.filter(c=>c.tutor.toLowerCase().includes(q)||c.dog.toLowerCase().includes(q)||c.address.toLowerCase().includes(q)):clients;
      },[clients,search]);

      if (!loaded) return <div style={styles.loadingScreen}><PawPrint size={32} color="#B8825A"/></div>;


      return (
        <div style={styles.app}>
          <style>{globalCss}</style>
          {toastQueue.map(t=>(
            <Toast key={t.id} message={t.msg} type={t.type} onDismiss={()=>dismissToast(t.id)}/>
          ))}
          <header style={styles.header}>
            <div style={styles.headerInner}>
              <div style={styles.brandRow}>
                <div style={styles.brandMark}><PawPrint size={20} color="#FBF1E8" strokeWidth={2.5}/></div>
                <div>
                  <h1 style={styles.brandTitle}>ObentōPet</h1>
                  <p style={styles.brandSub}>Controle de Entregas</p>
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <ConnBadge online={realtimeOnline}/>
                <button style={styles.backupBtn} onClick={exportBackup} title="Exportar backup JSON">
                  <Download size={14} strokeWidth={2.5}/>
                </button>
                <button style={styles.newBtn} onClick={()=>{setEditingClient(null);setShowForm(true);}}>
                  <Plus size={18} strokeWidth={2.5}/><span>Novo cliente</span>
                </button>
              </div>
            </div>
            <nav style={styles.tabRow}>
              {[["hoje","Hoje"],["entregas","Entregas"],["clientes","Clientes"],["estoque","Estoque"],["producao","Produção"],["roteiro","Roteiro"]].map(([key,label])=>(
                <button key={key} onClick={()=>setView(key)}
                  style={{...styles.tab,...(view===key?styles.tabActive:{})}}>{label}</button>
              ))}
            </nav>
          </header>
          <main style={styles.main}>
            {view==="hoje"&&(
              <TodayView items={todayDeliveries} getStatus={getStatus} setStatus={setStatus}
                shelfProducts={shelfProducts} onReschedule={openReschedule} onCancelDelivery={cancelDelivery}/>
            )}
            {view==="entregas"&&(
              <EntregasView weekDays={weekDays} weekDeliveries={weekDeliveries} weekOffset={weekOffset}
                setWeekOffset={setWeekOffset} getStatus={getStatus} setStatus={setStatus}
                shelfProducts={shelfProducts} onReschedule={openReschedule} onCancelDelivery={cancelDelivery} onGenerateBat={generateBat}
                filter={entregasFilter} setFilter={setEntregasFilter}
                getDeliveriesForRange={getDeliveriesForRange}/>
            )}
            {view==="clientes"&&(
              <ClientsView clients={filteredClients} search={search} setSearch={setSearch}
                onEdit={c=>{setEditingClient(c);setShowForm(true);}} onDelete={deleteClient}
                avulsaOrders={avulsaOrders} onAddAvulsaOrder={addAvulsaOrder} onDeleteAvulsaOrder={deleteAvulsaOrder}
                statusLog={statusLog}
                onImportClients={importClients} onDownloadClientsTemplate={downloadClientsTemplate}/>
            )}
            {view==="estoque"&&(
              <StockView
                clients={clients}
                subscriberStock={subscriberStock} subscriberStockLog={subscriberStockLog}
                shelfProducts={shelfProducts} shelfStockLog={shelfStockLog}
                petiscoProducts={petiscoProducts} petiscoStockLog={petiscoStockLog}
                onAddSubscriberProduction={addSubscriberProduction}
                onUpdateClientUnits={updateClientUnits}
                onSetSubscriberBalance={setSubscriberBalance}
                onAddShelfProduct={addShelfProduct} onAddShelfStockEntry={addShelfStockEntry} onDeleteShelfProduct={deleteShelfProduct} onUpdateShelfMinStock={updateShelfMinStock}
                onAddPetiscoProduct={addPetiscoProduct} onAddPetiscoStockEntry={addPetiscoStockEntry} onDeletePetiscoProduct={deletePetiscoProduct} onUpdatePetiscoMinStock={updatePetiscoMinStock}
                onEditClient={c=>{setEditingClient(c);setShowForm(true);}}
                onImportShelf={importShelfProducts} onDownloadShelfTemplate={downloadShelfTemplate}
                onImportPetisco={importPetiscoProducts} onDownloadPetiscoTemplate={downloadPetiscoTemplate}/>
            )}
            {view==="producao"&&(
              <ProducaoView clients={clients} subscriberStock={subscriberStock}
                shelfProducts={shelfProducts} petiscoProducts={petiscoProducts}/>
            )}
            {view==="roteiro"&&(
              <RoteiroView todayDeliveries={todayDeliveries} getStatus={getStatus}
                getDeliveriesForRange={getDeliveriesForRange}/>
            )}
          </main>
          {showForm&&(
            <ClientFormModal initial={editingClient} clients={clients}
              onClose={()=>{setShowForm(false);setEditingClient(null);}} onSave={saveClient}/>
          )}
          {rescheduleModal&&(
            <RescheduleModal info={rescheduleModal}
              onClose={()=>setRescheduleModal(null)} onConfirm={rescheduleDelivery}/>
          )}
        </div>
      );
    }

    // ─── ENTREGAS VIEW ────────────────────────────────────────────────────────
    function EntregasView({ weekDays, weekDeliveries, weekOffset, setWeekOffset, getStatus, setStatus, shelfProducts, onReschedule, onCancelDelivery, onGenerateBat, filter, setFilter, getDeliveriesForRange }) {
      const [activeDay, setActiveDay] = useState(null);
      const t = todayISO();
      const tmrw = tomorrowISO();

      const filterRanges = useMemo(()=>{
        const wStart = weekDays[0], wEnd = weekDays[6];
        const nextWStart = addDays(wEnd,1), nextWEnd = addDays(wEnd,7);
        return { hoje:[t,t], amanha:[tmrw,tmrw], semana:[wStart,wEnd], proxima:[nextWStart,nextWEnd] };
      },[weekDays,t,tmrw]);

      const filterItems = useMemo(()=>{
        if (filter==="semana"||filter==="proxima") return null;
        const [s,e] = filterRanges[filter]||[t,t];
        return getDeliveriesForRange(s,e);
      },[filter,filterRanges,getDeliveriesForRange,t]);

      const activeDate = activeDay||(weekDays.includes(t)?t:weekDays[0]);
      const activeDayItems = weekDeliveries[activeDate]||[];
      const comEtiqueta = activeDayItems.filter(({client})=>client.labelFile).length;

      const weekNum = getWeekNumber(weekDays[0]);

      if (filter!=="semana"&&filter!=="proxima") {
        const [rangeStart] = filterRanges[filter]||[t,t];
        const label = filter==="hoje"?formatDateFull(t):filter==="amanha"?formatDateFull(tmrw):"";
        return (
          <div style={styles.section}>
            <div style={styles.filterRow}>
              {[["hoje","Hoje"],["amanha","Amanhã"],["semana","Semana"],["proxima","Prox. semana"]].map(([key,lbl])=>(
                <button key={key} onClick={()=>setFilter(key)}
                  style={{...styles.filterBtn,...(filter===key?styles.filterBtnActive:{})}}>{lbl}</button>
              ))}
            </div>
            <h2 style={{...styles.sectionTitle,marginBottom:16}}>{label}</h2>
            {filterItems.length===0?<EmptyState text="Nenhuma entrega neste período."/>:(
              <div style={styles.cardList}>
                {filterItems.map(({client,date,orderId})=>(
                  <DeliveryCard key={client.id+date+(orderId||"")} client={client} date={date} orderId={orderId}
                    status={getStatus(client.id,date)} onStatusChange={(s,ded)=>setStatus(client.id,date,s,ded)}
                    shelfProducts={shelfProducts} onReschedule={onReschedule} onCancelDelivery={onCancelDelivery} showDate={filter!=="hoje"&&filter!=="amanha"}/>
                ))}
              </div>
            )}
          </div>
        );
      }

      return (
        <div style={styles.section}>
          <div style={styles.filterRow}>
            {[["hoje","Hoje"],["amanha","Amanhã"],["semana","Semana"],["proxima","Prox. semana"]].map(([key,lbl])=>(
              <button key={key} onClick={()=>setFilter(key)}
                style={{...styles.filterBtn,...(filter===key?styles.filterBtnActive:{})}}>{lbl}</button>
            ))}
          </div>
          <div style={styles.weekNav}>
            <button style={styles.navArrow} onClick={()=>setWeekOffset(w=>w-1)}><ChevronLeft size={18}/></button>
            <div style={{textAlign:"center"}}>
              <div style={styles.weekLabel}>{formatDateBR(weekDays[0])} – {formatDateBR(weekDays[6])}</div>
              <div style={{fontSize:10.5,color:"#A89A8C",fontWeight:600}}>Semana {weekNum}</div>
            </div>
            <button style={styles.navArrow} onClick={()=>setWeekOffset(w=>w+1)}><ChevronRight size={18}/></button>
          </div>
          <div style={styles.weekStrip}>
            {weekDays.map((d,i)=>{
              const count=weekDeliveries[d]?.length||0;
              const isToday=d===t, isActive=d===activeDate;
              return (
                <button key={d} onClick={()=>setActiveDay(d)}
                  style={{...styles.dayChip,...(isActive?styles.dayChipActive:{}),...(isToday&&!isActive?styles.dayChipToday:{})}}>
                  <span style={{...styles.dayChipDow,...(isActive?{color:"#C9BBA8"}:{})}}>{weekdayShort[i]}</span>
                  <span style={{...styles.dayChipNum,...(isActive?{color:"#FBF1E8"}:{})}}>{d.split("-")[2]}</span>
                  {count>0&&<span style={{...styles.dayChipDot,...(isActive?{background:"#FBF1E8"}:{})}}/>}
                </button>
              );
            })}
          </div>
          <div style={{marginTop:20}}>
            {activeDayItems.length>0&&(
              <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
                <button style={styles.batBtn} onClick={()=>onGenerateBat(activeDate,activeDayItems)}
                  title={`${comEtiqueta} de ${activeDayItems.length} com etiqueta configurada`}>
                  <Printer size={13} strokeWidth={2.5}/>
                  Etiquetas{comEtiqueta<activeDayItems.length?` (${comEtiqueta}/${activeDayItems.length})`:""}
                </button>
              </div>
            )}
            {activeDayItems.length===0?<EmptyState text="Nenhuma entrega marcada para este dia."/>:(
              <div style={styles.cardList}>
                {activeDayItems.map(({client,orderId})=>(
                  <DeliveryCard key={client.id+activeDate+(orderId||"")} client={client} date={activeDate} orderId={orderId}
                    status={getStatus(client.id,activeDate)} onStatusChange={(s,ded)=>setStatus(client.id,activeDate,s,ded)}
                    shelfProducts={shelfProducts} onReschedule={onReschedule} onCancelDelivery={onCancelDelivery}/>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

      const handleStatusClick = (key) => {
        if (key==="entregue"&&isAvulsa&&status!=="entregue") { setPickerOpen(true); return; }
        onStatusChange(key);
      };
      const confirmAvulsaDelivery = () => {
        const amount = parseInt(selectedAmount,10);
        if (!selectedProduct||!amount||amount<1) return;
        onStatusChange("entregue",{productId:selectedProduct,amount});
        setPickerOpen(false);
      };

      return (
        <div style={styles.card}>
          <div style={styles.cardTop}>
            <div style={styles.cardIdentity}>
              <div style={styles.dogBadge}><PawPrint size={14} color="#B8825A"/></div>
              <div>
                <div style={styles.cardDog}>{client.dog}</div>
                <div style={styles.cardTutor}>{client.tutor}</div>
              </div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5}}>
              {showDate&&<span style={{fontSize:11.5,fontWeight:700,color:"#B8825A"}}>{formatDateBR(date)}</span>}

              {client.volumes?<span style={{...styles.unitsTag,background:"#F0EBE3",color:"#8A6A48"}}>{client.volumes} {client.volumes===1?"volume":"volumes"}</span>:null}

          {client.phone&&(
            <div style={{display:"flex",gap:6,fontSize:12,color:"#A89A8C",marginTop:4,alignItems:"center"}}>

              <div style={{display:"flex",gap:8,marginTop:8}}>
                <input type="number" min="1" style={{...styles.input,flex:1}} value={selectedAmount}
                  onChange={e=>setSelectedAmount(e.target.value)} placeholder="Qtd"/>
                <button style={styles.avulsaConfirmBtn} onClick={confirmAvulsaDelivery} disabled={!selectedProduct}>Confirmar</button>
                <button style={styles.avulsaCancelBtn} onClick={()=>setPickerOpen(false)}>Cancelar</button>
              </div>
            </div>
          ):(
            <>
              <div style={styles.statusRow}>
                {Object.entries(statusConfig).map(([key,conf])=>{
                  const Icon=conf.icon; const active=status===key;
                  return (
                    <button key={key} onClick={()=>handleStatusClick(key)}
                      style={{...styles.statusBtn,...(active?{background:conf.color,color:"#FFF7EF",borderColor:conf.color}:{background:"#FFF7EF",color:"#8A7A6C",borderColor:"#E8DDD0"})}}>
                      <Icon size={13} strokeWidth={2.5}/>{conf.label}

                  );

              </div>
              <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:8}}>
                {confirmCancel?(
                  <>
                    <span style={{fontSize:12,color:"#8A7A6C",alignSelf:"center",marginRight:4}}>Confirmar cancelamento?</span>
                    <button style={{...styles.rescheduleBtn,background:"#C0594B",color:"#fff",borderColor:"#C0594B"}}

    function ClientsView({ clients, search, setSearch, onEdit, onDelete, avulsaOrders, onAddAvulsaOrder, onDeleteAvulsaOrder, statusLog, onImportClients, onDownloadClientsTemplate }) {
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [newOrderFor,   setNewOrderFor]   = useState(null);
      const today = todayISO();

      const getLastDelivery = (clientId) => {
        const prefix = clientId + "|";
        const dates = Object.entries(statusLog||{})
          .filter(([k,v]) => k.startsWith(prefix) && v==="entregue")
          .map(([k]) => k.slice(prefix.length));
        if (!dates.length) return null;
        return dates.sort().pop();
      };

      const getAvulsaMeta = (c) => {
        const orders = avulsaOrders[c.id]||[];
        if (orders.length===0) return `Avulsa · próxima: ${formatDateBR(c.nextDate)}`;

    // ─── PRODUÇÃO VIEW ────────────────────────────────────────────────────────
    function ProducaoView({ clients, subscriberStock, shelfProducts, petiscoProducts }) {
      const subscribers = clients.filter(c=>c.frequency!=="avulsa");
      const lowSubscribers = subscribers.filter(c=>(subscriberStock[c.id]??0)<=(c.units||0));
      const lowShelf       = shelfProducts.filter(p=>p.balance<=(p.min_stock||0));
      const lowPetiscos    = petiscoProducts.filter(p=>p.balance<=(p.min_stock||0));
      const total = lowSubscribers.length+lowShelf.length+lowPetiscos.length;

      const handlePrint = () => {
        const win = window.open("","_blank","width=700,height=600");
        const t = todayISO();
        const rows = [
          ...lowSubscribers.map(c=>({cat:"Assinante",name:c.dog+" ("+c.tutor+")",atual:subscriberStock[c.id]??0,min:c.units||0,deficit:(c.units||0)-(subscriberStock[c.id]??0)})),
          ...lowShelf.map(p=>({cat:"Avulso",name:p.name,atual:p.balance,min:p.min_stock||0,deficit:(p.min_stock||0)-p.balance})),
          ...lowPetiscos.map(p=>({cat:"Petisco",name:p.name,atual:p.balance,min:p.min_stock||0,deficit:(p.min_stock||0)-p.balance})),
        ];
        win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Produção ${t}</title>
          <style>body{font-family:sans-serif;padding:24px;color:#3E332A}h1{font-size:18px}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{border:1px solid #ddd;padding:8px 12px;text-align:left;font-size:13px}th{background:#F6EEE3;font-weight:700}tr:nth-child(even){background:#FDFAF6}.deficit{color:#C0594B;font-weight:700}</style>
          </head><body><h1>Produção necessária — ${t}</h1>
          <table><tr><th>Categoria</th><th>Produto/Pet</th><th>Saldo atual</th><th>Mín</th><th>Produzir</th></tr>
          ${rows.map(r=>`<tr><td>${r.cat}</td><td>${r.name}</td><td>${r.atual}</td><td>${r.min}</td><td class="deficit">+${Math.max(0,r.deficit)}</td></tr>`).join("")}
          </table></body></html>`);
        win.document.close();
        win.print();
      };

      return (
        <div style={styles.section}>
          <div style={styles.sectionHeadRow}>
            <h2 style={styles.sectionTitle}>Produção</h2>
            <div style={{display:"flex",gap:8}}>

    // ─── ROTEIRO VIEW ─────────────────────────────────────────────────────────
    function RoteiroView({ todayDeliveries, getStatus, getDeliveriesForRange }) {
      const [rFilter, setRFilter] = useState("hoje");
      const [rCustomDate, setRCustomDate] = useState(()=>todayISO());
      const t = todayISO();
      const tmrw = tomorrowISO();
      const activeDate = rFilter==="hoje" ? t : rFilter==="amanha" ? tmrw : rCustomDate;

      const items = useMemo(()=>{
        return getDeliveriesForRange(activeDate, activeDate);
      },[activeDate,getDeliveriesForRange]);

      const copyWhatsApp = () => {
        const dateLabel = formatDateFull(activeDate);
        const lines = [`*Roteiro ObentōPet — ${dateLabel}*`,`Total: ${items.length} entrega${items.length!==1?"s":""}`,``];
        items.forEach(({client,date},i)=>{
          lines.push(`${i+1}. 🐾 *${client.dog}* (${client.tutor})`);
          lines.push(`   📍 ${client.address}`);
          if (client.volumes) lines.push(`   📦 ${client.volumes} volume${client.volumes!==1?"s":""}${client.units?` · ${client.units} un.`:""}`);
          else if (client.units) lines.push(`   📦 ${client.units} unidade${client.units!==1?"s":""}`);
          if (client.phone) lines.push(`   📱 ${client.phone}`);
          lines.push("");
        });
        navigator.clipboard.writeText(lines.join("\n")).then(()=>{
          alert("Roteiro copiado! Cole no WhatsApp.");
        }).catch(()=>{
          alert("Não foi possível copiar automaticamente. Selecione e copie manualmente.");
        });
      };

      const handlePrint = () => {
        const dateLabel = formatDateFull(activeDate);
        const win = window.open("","_blank","width=700,height=600");
        win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Roteiro ${dateLabel}</title>
          <style>body{font-family:sans-serif;padding:24px;color:#3E332A}h1{font-size:18px;margin-bottom:4px}.sub{font-size:13px;color:#8A7A6C;margin-bottom:20px}.card{border:1px solid #E8DDD0;border-radius:10px;padding:14px 16px;margin-bottom:12px}.num{font-size:11px;font-weight:700;color:#B8825A;text-transform:uppercase;margin-bottom:4px}.dog{font-size:16px;font-weight:700}.tutor{font-size:13px;color:#8A7A6C}.addr{font-size:13px;margin-top:6px;color:#3E332A}.info{font-size:12px;color:#A89A8C;margin-top:3px}@media print{body{padding:12px}}</style>
          </head><body><h1>Roteiro ObentōPet</h1><p class="sub">${dateLabel} · ${items.length} entrega${items.length!==1?"s":""}</p>
          ${items.map(({client},i)=>`<div class="card"><div class="num">Entrega ${i+1}</div><div class="dog">🐾 ${client.dog}</div><div class="tutor">${client.tutor}</div><div class="addr">📍 ${client.address}</div>${client.volumes?`<div class="info">📦 ${client.volumes} volume${client.volumes!==1?"s":""}${client.units?` · ${client.units} un.`:""}</div>`:client.units?`<div class="info">📦 ${client.units} unidade${client.units!==1?"s":""}</div>`:""}${client.phone?`<div class="info">📱 ${client.phone}</div>`:""}</div>`).join("")}
          </body></html>`);
        win.document.close();
        win.print();
      };

      return (
        <div style={styles.section}>
          <div style={styles.sectionHeadRow}>
            <h2 style={styles.sectionTitle}>Roteiro</h2>
            <span style={styles.countPill}>{items.length} entrega{items.length!==1?"s":""}</span>
          </div>
          <div style={styles.filterRow}>
            {[["hoje","Hoje"],["amanha","Amanhã"],["data","Outra data"]].map(([key,lbl])=>(
              <button key={key} onClick={()=>setRFilter(key)}
                style={{...styles.filterBtn,...(rFilter===key?styles.filterBtnActive:{})}}>{lbl}</button>
            ))}
          </div>
          {rFilter==="data"&&(<div style={{marginBottom:16}}><input type="date" style={{...styles.input,maxWidth:200}} value={rCustomDate} onChange={e=>setRCustomDate(e.target.value)}/></div>)}
          <div style={{display:"flex",gap:8,marginBottom:16}}>
            <button style={styles.batBtn} onClick={handlePrint}>
              <Printer size={13} strokeWidth={2.5}/>Imprimir PDF
            </button>
            <button style={{...styles.batBtn,background:"#25A244"}} onClick={copyWhatsApp}>
              <MessageCircle size={13} strokeWidth={2.5}/>Copiar WhatsApp
            </button>
          </div>
          {items.length===0?<EmptyState text="Nenhuma entrega neste período."/>:(
            <div style={styles.cardList}>
              {items.map(({client,date,orderId},i)=>(
                <div key={client.id+date+(orderId||"")} style={styles.roteiroCard}>
                  <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                    <div style={{width:28,height:28,borderRadius:"50%",background:"#F6EEE3",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:12,fontWeight:700,color:"#B8825A"}}>{i+1}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                        <span style={styles.cardDog}>{client.dog}</span>
                        <span style={{fontSize:12.5,color:"#8A7A6C"}}>· {client.tutor}</span>
                        {getStatus(client.id,date)==="entregue"&&<span style={{fontSize:10.5,fontWeight:700,color:"#5C8A5C",background:"#E8F5E8",padding:"2px 7px",borderRadius:6}}>✓ Entregue</span>}
                      </div>
                      <div style={{fontSize:12.5,color:"#7A6C5E",marginTop:4,display:"flex",gap:4,alignItems:"center"}}>
                        <MapPin size={11} color="#A89A8C" style={{flexShrink:0}}/>
                        {client.address}
                      </div>
                      {client.phone&&<div style={{fontSize:12,color:"#A89A8C",marginTop:3,display:"flex",gap:4,alignItems:"center"}}><Phone size={11} color="#C9BBA8"/>{client.phone}</div>}
                      {(client.volumes||client.units)&&<div style={{fontSize:11.5,color:"#B8825A",fontWeight:600,marginTop:3,display:"flex",gap:10}}>
                        {client.volumes&&<span>📦 {client.volumes} vol.</span>}
                        {client.units&&<span>{client.units} un.</span>}
                      </div>}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }


    // ─── RESCHEDULE MODAL ─────────────────────────────────────────────────────

      return (
        <div style={styles.modalOverlay} onClick={onClose}>
          <div style={styles.modal} onClick={e=>e.stopPropagation()}>
            <div style={styles.modalHead}>
              <h3 style={styles.modalTitle}>Reagendar entrega</h3>
              <button style={styles.modalClose} onClick={onClose}><X size={18} color="#8A7A6C"/></button>
            </div>
            <div style={styles.formBody}>
              <div style={styles.rescheduleInfo}>
                <div style={styles.dogBadge}><PawPrint size={14} color="#B8825A"/></div>
                <div>
                  <div style={{fontSize:15.5,fontWeight:700,color:"#3E332A"}}>{info.dog}</div>
                  <div style={{fontSize:12.5,color:"#A89A8C",marginTop:1}}>entrega original: {formatDateBR(info.date)}</div>
                </div>
              </div>

                <input type="date" style={styles.input} value={newDate} onChange={e=>setNewDate(e.target.value)}/>

                <Field label="O que alterar?">
                  <div style={styles.freqGrid}>
                    <button type="button" onClick={()=>setScope("only")}
                      style={{...styles.freqOption,...(scope==="only"?styles.freqOptionActive:{}),textAlign:"center",lineHeight:1.35}}>
                      Só esta entrega
                    </button>
                    <button type="button" onClick={()=>setScope("following")}
                      style={{...styles.freqOption,...(scope==="following"?styles.freqOptionActive:{}),textAlign:"center",lineHeight:1.35}}>
                      Esta e as seguintes
                    </button>
                  </div>
                  <p style={{margin:"6px 0 0",fontSize:11.5,color:"#A89A8C",lineHeight:1.4}}>
                    {scope==="only"?"A data original volta a aparecer normalmente nas próximas ocorrências.":"O dia fixo de entrega será alterado permanentemente a partir desta data."}
                  </p>
                </Field>
              )}
              <button style={{...styles.saveBtn,opacity:canConfirm?1:0.45}} disabled={!canConfirm}
                onClick={()=>{if(canConfirm)onConfirm(info.clientId,info.date,newDate,scope,info.orderId);}}>

            </div>
          </div>
        </div>
      );
    }

    // ─── CLIENT FORM MODAL ────────────────────────────────────────────────────
    function ClientFormModal({ initial, clients, onClose, onSave }) {
      const initIsSubscriber = initial?initial.frequency!=="avulsa":true;
      const [tutor,           setTutor]           = useState(initial?.tutor    ||"");
      const [dog,             setDog]             = useState(initial?.dog      ||"");
      const [address,         setAddress]         = useState(initial?.address  ||"");
      const [phone,           setPhone]           = useState(initial?.phone    ||"");
      const [isSubscriber,    setIsSubscriber]    = useState(initIsSubscriber);
      const [frequency,       setFrequency]       = useState(initial?.frequency&&initial.frequency!=="avulsa"?initial.frequency:"semanal");
      const [nextDate,        setNextDate]        = useState(initial?.nextDate ||todayISO());
      const [firstDate,       setFirstDate]       = useState(todayISO());
      const [units,           setUnits]           = useState(initial?.units?String(initial.units):"");
      const [volumes,         setVolumes]         = useState(initial?.volumes?String(initial.volumes):"");
      const [notes,           setNotes]           = useState(initial?.notes    ||"");
      const [labelFile,       setLabelFile]       = useState(initial?.labelFile||"");
      const [labelFileEdited, setLabelFileEdited] = useState(!!initial?.labelFile);
      const [error,           setError]           = useState("");
      const [saving,          setSaving]          = useState(false);

      useEffect(()=>{
        if (!labelFileEdited) setLabelFile(suggestLabelFile(dog,tutor,clients,initial?.id));
      },[dog,tutor,labelFileEdited]);

      const handleSubmit = async () => {
        if (!tutor.trim()||!dog.trim()||!address.trim()) { setError("Preencha tutor, cão e endereço."); return; }
        if (isSubscriber&&!nextDate) { setError("Informe a data da próxima entrega."); return; }
        const unitsNum   = units?parseInt(units,10):null;
        const volumesNum = volumes?parseInt(volumes,10):null;
        if (isSubscriber&&(!unitsNum||unitsNum<1)) { setError("Informe a quantidade de unidades por entrega."); return; }
        setSaving(true);
        await onSave({
          tutor:tutor.trim(), dog:dog.trim(), address:address.trim(), phone:phone.trim(),
          frequency:isSubscriber?frequency:"avulsa",
          nextDate: isSubscriber?nextDate:(initial?.nextDate||null),
          units:unitsNum, volumes:volumesNum, notes,
          labelFile:labelFile.trim(),
          firstDate: (!initial&&!isSubscriber&&firstDate)?firstDate:undefined,
        });
        setSaving(false);
      };

      return (
        <div style={styles.modalOverlay} onClick={onClose}>
          <div style={styles.modal} onClick={e=>e.stopPropagation()}>
            <div style={styles.modalHead}>
              <h3 style={styles.modalTitle}>{initial?"Editar cliente":"Novo cliente"}</h3>
              <button style={styles.modalClose} onClick={onClose}><X size={18} color="#8A7A6C"/></button>
            </div>
            <div style={styles.formBody}>
              <Field label="Nome do tutor">
                <input style={styles.input} value={tutor} onChange={e=>setTutor(e.target.value)} placeholder="Ex: Marina Costa"/>
              </Field>
              <Field label="Nome do cão">
                <input style={styles.input} value={dog} onChange={e=>setDog(e.target.value)} placeholder="Ex: Mia"/>
              </Field>
              <Field label="Endereço de entrega">
                <input style={styles.input} value={address} onChange={e=>setAddress(e.target.value)} placeholder="Rua, número, bairro"/>
              </Field>
              <Field label="Telefone de contato (opcional)">
                <input style={styles.input} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="(11) 99999-9999" type="tel"/>
              </Field>
              <Field label="Tipo de cliente">
                <div style={styles.subscriberToggle}>
                  <button type="button" onClick={()=>setIsSubscriber(true)}
                    style={{...styles.subscriberOpt,...(isSubscriber?styles.subscriberOptActive:{})}}>
                    <span style={{...styles.subscriberOptTitle,color:isSubscriber?"#8A6A48":"#3E332A"}}>Assinante</span>
                    <span style={styles.subscriberOptSub}>entrega recorrente</span>
                  </button>
                  <button type="button" onClick={()=>setIsSubscriber(false)}
                    style={{...styles.subscriberOpt,...(!isSubscriber?styles.subscriberOptActive:{})}}>
                    <span style={{...styles.subscriberOptTitle,color:!isSubscriber?"#8A6A48":"#3E332A"}}>Avulso</span>
                    <span style={styles.subscriberOptSub}>pedido por pedido</span>
                  </button>
                </div>
              </Field>
              {isSubscriber&&(
                <Field label="Frequência">
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                    {[["semanal","Semanal"],["quinzenal","Quinzenal"],["mensal","Mensal"]].map(([key,label])=>(
                      <button key={key} type="button" onClick={()=>setFrequency(key)}
                        style={{...styles.freqOption,...(frequency===key?styles.freqOptionActive:{})}}>{label}</button>
                    ))}
                  </div>
                </Field>
              )}
              {isSubscriber&&(
                <Field label="Próxima entrega">
                  <input type="date" style={styles.input} value={nextDate} onChange={e=>setNextDate(e.target.value)}/>
                </Field>
              )}
              {!isSubscriber&&!initial&&(
                <Field label="Primeira data de entrega">
                  <input type="date" style={styles.input} value={firstDate} onChange={e=>setFirstDate(e.target.value)}/>
                  <p style={{margin:"4px 0 0",fontSize:11.5,color:"#A89A8C",lineHeight:1.4}}>
                    Você pode adicionar mais datas a qualquer momento no card do cliente.
                  </p>
                </Field>
              )}
              <Field label={isSubscriber?"Unidades por entrega":"Unidades por entrega (opcional)"}>
                <input type="number" min="1" style={styles.input} value={units} onChange={e=>setUnits(e.target.value)} placeholder="Ex: 4"/>
                <p style={{margin:"4px 0 0",fontSize:11.5,color:"#A89A8C",lineHeight:1.4}}>Quantidade de produtos dentro dos volumes (marmitas, biscoitos etc.).</p>
              </Field>
              <Field label="Número de volumes (caixas/sacolas) (opcional)">
                <input type="number" min="1" style={styles.input} value={volumes} onChange={e=>setVolumes(e.target.value)} placeholder="Ex: 2"/>
                <p style={{margin:"4px 0 0",fontSize:11.5,color:"#A89A8C",lineHeight:1.4}}>Caixas ou sacolas entregues à transportadora por entrega.</p>
              </Field>
              <Field label="Arquivo de etiqueta (.btw)">
                <div style={{position:"relative"}}>
                  <input style={{...styles.input,paddingRight:labelFileEdited?80:12}}
                    value={labelFile}
                    onChange={e=>{setLabelFile(e.target.value);setLabelFileEdited(true);}}
                    placeholder="ex: mia  ou  mia - mc"/>
                  {labelFileEdited&&(
                    <button type="button" style={styles.labelSuggestBtn}
                      onClick={()=>{setLabelFileEdited(false);setLabelFile(suggestLabelFile(dog,tutor,clients,initial?.id));}}>
                      ↺ sugerir
                    </button>
                  )}
                </div>
                <p style={{margin:"4px 0 0",fontSize:11.5,color:"#A89A8C",lineHeight:1.4}}>
                  Nome idêntico ao arquivo <strong>.btw</strong> salvo no OneDrive, sem a extensão.
                  {!labelFile&&dog&&<span style={{color:"#C0594B"}}> Configure para gerar o .bat do dia.</span>}
                </p>
              </Field>
              <Field label="Observações (opcional)">
                <textarea style={{...styles.input,minHeight:60,resize:"vertical",fontFamily:"inherit"}}
                  value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Ex: portaria pede documento"/>
              </Field>
              {error&&<p style={styles.errorText}>{error}</p>}
              <button style={{...styles.saveBtn,opacity:saving?0.7:1}} onClick={handleSubmit} disabled={saving}>
                {saving?"Salvando…":initial?"Salvar alterações":"Adicionar cliente"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function Field({ label, children }) {
      return <div style={styles.field}><label style={styles.fieldLabel}>{label}</label>{children}</div>;
    }
    function EmptyState({ text }) {
      return (
        <div style={styles.empty}>
          <PawPrint size={26} color="#D9CBBC"/>
          <p style={styles.emptyText}>{text}</p>
        </div>
      );
    }

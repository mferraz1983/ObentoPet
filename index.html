    // ─── STOCK VIEW ───────────────────────────────────────────────────────────
    // BEGIN EAN HELPERS
    const normCode = (c) => { const t = String(c==null?"":c).trim().toLowerCase(); return /^\d+$/.test(t) ? (t.replace(/^0+/,"") || "0") : t; };
    const normText = (x) => String(x==null?"":x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/(\d)\s+(g|kg|ml)\b/g,"$1$2").replace(/[^a-z0-9]+/g," ").trim();
    const EAN_STOP = new Set(["com","de","da","do","e","a","o"]);
    const tokensOf = (x) => normText(x).split(" ").filter(t=>t && !EAN_STOP.has(t));
    const parseEanSheet = (XL, buf) => {
      const wb = XL.read(buf, {type:"array"});
      const order = [...wb.SheetNames].sort((a,b)=>(/ean/i.test(b)?1:0)-(/ean/i.test(a)?1:0));
      let found = null;
      for (const name of order) {
        const data = XL.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:""});
        for (let i=0; i<Math.min(data.length,15) && !found; i++) {
          const r = data[i].map(v=>normText(v));
          const ci = r.findIndex(v=>/\b(ean|gtin)\b|barras/.test(v));
          const pi = r.findIndex(v=>/produto|nome|descricao/.test(v));
          if (ci>=0 && pi>=0) {
            const ki = r.findIndex(v=>/codigo|sku/.test(v) && !/barras/.test(v));
            found = {data, hi:i, ci, pi, ki};
          }
        }
        if (found) break;
      }
      if (!found) return null;
      const out = []; const seen = new Set();
      for (let i=found.hi+1; i<found.data.length; i++) {
        const r = found.data[i];
        let ean = String(r[found.ci]==null?"":r[found.ci]).trim().replace(/\.0$/,"");
        const prod = String(r[found.pi]==null?"":r[found.pi]).trim();
        if (!ean || !prod) continue;
        const k = normCode(ean); if (seen.has(k)) continue; seen.add(k);
        const sku = found.ki>=0 ? String(r[found.ki]==null?"":r[found.ki]).trim() : "";
        const dash = sku.lastIndexOf("-");
        const suffix = dash>0 ? sku.slice(dash+1) : "";
        out.push({ean, prod, suffix, label: prod + (suffix?" "+suffix:"")});
      }
      return out;
    };
    const matchEanRow = (row, products) => {
      const need = [...tokensOf(row.prod), ...tokensOf(row.suffix)];
      if (!need.length) return "";
      const cands = products.filter(p=>{ const t = new Set(tokensOf(p.name)); return need.every(n=>t.has(n)); });
      if (!cands.length) return "";
      const min = Math.min(...cands.map(p=>tokensOf(p.name).length));
      const best = cands.filter(p=>tokensOf(p.name).length===min);
      return best.length===1 ? best[0].id : "";
    };
    const prettyName = (x) => {
      const t = String(x||"").trim();
      const letters = t.replace(/\d+\s*(g|kg|ml)\b/gi,"").replace(/[^A-Za-zÀ-ÿ]/g,"");
      if (!letters || letters !== letters.toUpperCase()) return t;
      const small = new Set(["com","de","da","do","e"]);
      return t.toLowerCase().replace(/(^|[\s\-\|\/])([a-zà-ÿ])/g,(m,p,c,off)=>{
        const word = t.toLowerCase().slice(off+p.length).split(/[\s\-\|\/]/)[0];
        return off>0 && small.has(word) ? m : p+c.toUpperCase();
      });
    };
    // END EAN HELPERS

    function BarcodeImportModal({ kind, products, onClose, onSetBarcode, onCreate }) {
      const [rows, setRows]   = useState(null);
      const [sel, setSel]     = useState({});
      const [err, setErr]     = useState("");
      const [busy, setBusy]   = useState(false);
      const [done, setDone]   = useState(null);
      const fileRef = React.useRef();
      const sorted = useMemo(()=>[...products].sort((a,b)=>a.name.localeCompare(b.name,"pt-BR")),[products]);

      const onFile = async (e) => {
        const f = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!f) return;
        setErr(""); setDone(null);
        try {
          const list = parseEanSheet(window.XLSX, await f.arrayBuffer());
          if (!list) { setErr("Não encontrei colunas de produto e EAN nessa planilha."); return; }
          const rs = list.map(r=>{
            const ex = products.find(p=>p.barcode && normCode(p.barcode)===normCode(r.ean));
            return {...r, already: ex ? ex.name : ""};
          });
          const s0 = {};
          rs.forEach((r,i)=>{ if (!r.already) s0[i] = matchEanRow(r, products); });
          setRows(rs); setSel(s0);
        } catch(ex) { setErr("Não consegui ler o arquivo: "+ex.message); }
      };

      const pending = rows ? rows.map((r,i)=>({r,i,id:sel[i]||""})).filter(x=>!x.r.already) : [];
      const chosen  = pending.filter(x=>x.id);
      const autoN   = rows ? rows.filter((r,i)=>!r.already && sel[i] && sel[i]!=="__new__").length : 0;
      const newN    = chosen.filter(x=>x.id==="__new__").length;
      const linkN   = chosen.length - newN;
      const alreadyN = rows ? rows.filter(r=>r.already).length : 0;
      const view = rows ? [...rows.map((r,i)=>({r,i}))].sort((a,b)=>{
        const ka = a.r.already?2:(sel[a.i]?1:0), kb = b.r.already?2:(sel[b.i]?1:0);
        return ka-kb || a.i-b.i;
      }) : [];

      const apply = async () => {
        const ids = chosen.filter(x=>x.id!=="__new__").map(x=>x.id);
        if (new Set(ids).size !== ids.length) { setErr("Há produtos escolhidos para mais de um EAN. Ajuste antes de gravar."); return; }
        if (newN>0 && !window.confirm(`Cadastrar ${newN} produto${newN===1?"":"s"} novo${newN===1?"":"s"} com saldo zero e vincular ${linkN} código${linkN===1?"":"s"}?`)) return;
        setErr(""); setBusy(true);
        let ok = 0;
        for (const x of chosen) {
          if (x.id==="__new__") { const nid = await onCreate(prettyName(x.r.label), x.r.ean); if (nid) ok++; }
          else if (await onSetBarcode(x.id, x.r.ean)) ok++;
        }
        setBusy(false);
        setDone({ok, total: chosen.length});
      };

      return (
        <div style={styles.modalOverlay} onClick={onClose}>
          <div style={{...styles.modal,padding:16}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontWeight:700,fontSize:16,color:"#3E332A"}}>Importar códigos de barras</div>
              <button style={{background:"none",border:"none",padding:4}} onClick={onClose}><X size={18} color="#8A7A6C"/></button>
            </div>
            <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={onFile}/>
            <button style={{...styles.avulsaConfirmBtn,width:"100%"}} onClick={()=>fileRef.current&&fileRef.current.click()}>
              {rows?"Escolher outra planilha":"Escolher planilha (XLS/XLSX)"}
            </button>
            <div style={{fontSize:12,color:"#A89A8C",marginTop:6}}>A planilha precisa ter colunas de produto e de EAN/GTIN (como a aba EAN BLING). A coluna de código do Bling é opcional e ajuda a separar 150g, 300g e 500g.</div>
            {err&&<div style={{color:"#C0594B",fontSize:13,marginTop:8}}>{err}</div>}

            {rows&&!done&&(
              <>
                <div style={{fontSize:13,color:"#3E332A",margin:"12px 0 8px",fontWeight:600}}>
                  {rows.length} códigos na planilha: {autoN} com produto sugerido, {rows.length-autoN-alreadyN-newN} sem correspondência{newN?`, ${newN} para cadastrar`:""}{alreadyN?`, ${alreadyN} já vinculados`:""}.
                </div>
                {rows.some((r,i)=>!r.already&&!sel[i])&&(
                  <button style={{...styles.avulsaCancelBtn,width:"100%",marginBottom:8}} onClick={()=>setSel(s0=>{const n={...s0};rows.forEach((r,i)=>{if(!r.already&&!n[i])n[i]="__new__";});return n;})}>
                    Marcar os {rows.filter((r,i)=>!r.already&&!sel[i]).length} sem correspondência para cadastrar como produtos novos
                  </button>
                )}
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {view.map(({r,i})=>(
                    <div key={i} style={{background:"#FFF",border:"1px solid "+(r.already?"#E3EDDD":(sel[i]?"#EFE4D6":"#F1D5CF")),borderRadius:10,padding:10}}>
                      <div style={{fontSize:13,fontWeight:700,color:"#3E332A"}}>{r.label}</div>
                      <div style={{fontSize:12,color:"#8A7A6C",marginBottom:r.already?0:6}}>EAN {r.ean}</div>
                      {r.already?(
                        <div style={{fontSize:12,color:"#4F7A42"}}>Já vinculado a {r.already}</div>
                      ):(
                        <select style={{...styles.input,width:"100%",boxSizing:"border-box",padding:"7px 8px",fontSize:13}} value={sel[i]||""} onChange={e=>setSel(s=>({...s,[i]:e.target.value}))}>
                          <option value="">Não vincular</option>
                          <option value="__new__">Cadastrar como produto novo</option>
                          {sorted.map(p=><option key={p.id} value={p.id}>{p.name}{p.barcode?` (substitui ${p.barcode})`:""}</option>)}
                        </select>
                      )}
                    </div>
                  ))}
                </div>
                <button style={{...styles.avulsaConfirmBtn,width:"100%",marginTop:12,opacity:(chosen.length&&!busy)?1:0.5}} disabled={!chosen.length||busy} onClick={apply}>
                  {busy?"Gravando...":(newN?`Gravar (${linkN} vincular, ${newN} cadastrar)`:`Vincular ${chosen.length} código${chosen.length===1?"":"s"}`)}
                </button>
              </>
            )}
            {done&&(
              <div style={{marginTop:12,padding:12,borderRadius:10,background:"#EAF3E6",color:"#4F7A42",fontSize:14,fontWeight:600}}>
                {done.ok} de {done.total} concluídos.{done.ok<done.total?" Os demais deram erro (veja os avisos na tela).":""}
                <div><button style={{...styles.avulsaCancelBtn,marginTop:10}} onClick={onClose}>Fechar</button></div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function ScanModal({ kind, products, onClose, onMove, onSetBarcode, onCreate }) {
      const [foundId, setFoundId] = useState(null);
      const [unknown, setUnknown] = useState(null);
      const [mode, setMode]       = useState("in");
      const [qty, setQty]         = useState("1");
      const [cam, setCam]         = useState(false);
      const [camErr, setCamErr]   = useState("");
      const [linkId, setLinkId]   = useState("");
      const [newName, setNewName] = useState("");
      const [msg, setMsg]         = useState("");
      const inputRef   = React.useRef();
      const scannerRef = React.useRef(null);
      const lastRef    = React.useRef({code:"",t:0});
      const handleRef  = React.useRef();
      const isTouch = typeof window!=="undefined" && ("ontouchstart" in window);
      const fp = foundId ? products.find(p=>p.id===foundId) : null;

      const handleCode = (raw) => {
        const c = String(raw||"").trim();
        if (!c) return;
        const now = Date.now();
        if (lastRef.current.code===c && now-lastRef.current.t<1500) return;
        lastRef.current = {code:c,t:now};
        if (navigator.vibrate) navigator.vibrate(60);
        setMsg("");
        const p = products.find(x=>x.barcode && normCode(x.barcode)===normCode(c));
        if (p) {
          if (foundId===p.id) { setQty(q=>String((parseInt(q,10)||0)+1)); }
          else { setFoundId(p.id); setQty("1"); }
          setUnknown(null);
        } else {
          try { if (scannerRef.current) scannerRef.current.pause(true); } catch(e) {}
          setFoundId(null); setUnknown(c); setLinkId(""); setNewName("");
        }
      };
      handleRef.current = handleCode;

      const afterAction = () => {
        setFoundId(null); setUnknown(null);
        lastRef.current = {code:lastRef.current.code,t:Date.now()};
        try { if (scannerRef.current) scannerRef.current.resume(); } catch(e) {}
        if (inputRef.current && !cam) inputRef.current.focus();
      };

      const confirm = () => {
        const q = parseInt(qty,10);
        if (!fp || !(q>0)) return;
        onMove(fp.id, mode==="in"?q:-q, mode==="in"?"Entrada (leitor)":"Saída (leitor)");
        setMsg((mode==="in"?"+":"-")+q+" · "+fp.name);
        afterAction();
      };
      const doLink = async () => {
        if (!linkId || !unknown) return;
        const ok = await onSetBarcode(linkId, unknown);
        if (ok) { setFoundId(linkId); setUnknown(null); setQty("1"); }
      };
      const doCreate = async () => {
        const n = newName.trim();
        if (!n || !unknown) return;
        const id = await onCreate(n, unknown);
        if (id) { setFoundId(id); setUnknown(null); setQty("1"); }
      };

      // câmera
      useEffect(()=>{
        if (!cam) return;
        if (!window.Html5Qrcode) { setCamErr("Leitor de câmera não carregou. Verifique a conexão e recarregue a página."); setCam(false); return; }
        const F = window.Html5QrcodeSupportedFormats;
        const s = new window.Html5Qrcode("barcode-reader", {
          formatsToSupport: [F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.ITF,F.QR_CODE],
          experimentalFeatures: { useBarCodeDetectorIfSupported: true },
          verbose: false,
        });
        scannerRef.current = s;
        setCamErr("");
        const startP = s.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: (w,h)=>({ width: Math.floor(w*0.85), height: Math.floor(Math.min(h*0.6,170)) }) },
          (text)=>{ if (handleRef.current) handleRef.current(text); },
          ()=>{}
        );
        startP.catch(()=>{ setCamErr("Não foi possível abrir a câmera. Permita o acesso à câmera no navegador."); setCam(false); });
        return ()=>{
          scannerRef.current = null;
          startP.then(()=>s.stop()).then(()=>s.clear()).catch(()=>{});
        };
      },[cam]);

      useEffect(()=>{ if (!isTouch && inputRef.current) inputRef.current.focus(); },[]);

      const onKey = (e) => {
        if (e.key!=="Enter") return;
        e.preventDefault();
        const v = e.target.value;
        e.target.value = "";
        if (v.trim()) handleCode(v);
        else if (fp) confirm();
      };

      const label = kind==="shelf" ? "produto de prateleira" : "petisco";
      const free = products.filter(p=>!p.barcode).sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
      const qn = parseInt(qty,10)||0;
      const seg = (active) => ({ flex:1, border:"none", borderRadius:9, padding:"9px 8px", fontSize:13, fontWeight:700, background: active?"#3E332A":"#EFE4D6", color: active?"#FBF1E8":"#8A7A6C" });

      return (
        <div style={styles.modalOverlay} onClick={onClose}>
          <div style={{...styles.modal,padding:16}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div style={{display:"flex",alignItems:"center",gap:8,fontWeight:700,fontSize:16,color:"#3E332A"}}><ScanBarcode size={18} strokeWidth={2.5}/>Escanear {label}</div>
              <button style={{background:"none",border:"none",padding:4}} onClick={onClose}><X size={18} color="#8A7A6C"/></button>
            </div>

            <input ref={inputRef} style={{...styles.input,width:"100%",boxSizing:"border-box"}} placeholder="Bipe com o leitor ou digite o código e Enter" onKeyDown={onKey}/>

            <button style={{...styles.avulsaCancelBtn,width:"100%",marginTop:8,display:"flex",alignItems:"center",justifyContent:"center",gap:6}} onClick={()=>{setCamErr("");setCam(c=>!c);}}>
              <ScanBarcode size={14} strokeWidth={2.5}/>{cam?"Fechar câmera":"Usar câmera do celular"}
            </button>
            {camErr&&<div style={{color:"#C0594B",fontSize:12.5,marginTop:6}}>{camErr}</div>}
            {cam&&<div id="barcode-reader" style={{width:"100%",marginTop:8,borderRadius:12,overflow:"hidden",background:"#000"}}/>}

            {msg&&<div style={{marginTop:10,padding:"8px 10px",borderRadius:9,background:"#EAF3E6",color:"#4F7A42",fontSize:13,fontWeight:600}}>Registrado: {msg}</div>}

            {fp&&(
              <div style={{marginTop:12,padding:12,borderRadius:12,background:"#FFF",border:"1px solid #EFE4D6"}}>
                <div style={{fontWeight:700,color:"#3E332A"}}>{fp.name}</div>
                <div style={{fontSize:12.5,color:"#8A7A6C",marginBottom:10}}>Em estoque: {fp.balance} · código {fp.barcode}</div>
                <div style={{display:"flex",gap:8,marginBottom:10}}>
                  <button style={seg(mode==="in")} onClick={()=>setMode("in")}>Entrada</button>
                  <button style={seg(mode==="out")} onClick={()=>setMode("out")}>Saída</button>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                  <button style={{...styles.avulsaCancelBtn,padding:"9px 16px",fontSize:16}} onClick={()=>setQty(String(Math.max(1,qn-1)))}>-</button>
                  <input type="number" inputMode="numeric" min="1" style={{...styles.input,flex:1,textAlign:"center"}} value={qty} onChange={e=>setQty(e.target.value)}/>
                  <button style={{...styles.avulsaCancelBtn,padding:"9px 16px",fontSize:16}} onClick={()=>setQty(String(qn+1))}>+</button>
                </div>
                {mode==="out"&&qn>fp.balance&&<div style={{color:"#C0594B",fontSize:12.5,marginBottom:8}}>Atenção: a saída é maior que o saldo atual ({fp.balance}).</div>}
                <div style={{display:"flex",gap:8}}>
                  <button style={styles.avulsaConfirmBtn} onClick={confirm}>Confirmar {mode==="in"?"entrada":"saída"}</button>
                  <button style={styles.avulsaCancelBtn} onClick={afterAction}>Cancelar</button>
                </div>
                <div style={{fontSize:11.5,color:"#A89A8C",marginTop:8}}>Dica: bipar o mesmo produto de novo soma +1. Enter com o campo vazio confirma.</div>
              </div>
            )}

            {unknown&&(
              <div style={{marginTop:12,padding:12,borderRadius:12,background:"#FFF",border:"1px solid #EFE4D6"}}>
                <div style={{fontWeight:700,color:"#3E332A"}}>Código não cadastrado</div>
                <div style={{fontSize:13,color:"#8A7A6C",marginBottom:10,wordBreak:"break-all"}}>{unknown}</div>
                {free.length>0&&(
                  <>
                    <div style={{fontSize:12.5,fontWeight:600,color:"#8A7A6C",marginBottom:4}}>Vincular a um produto existente (sem código)</div>
                    <select style={{...styles.input,width:"100%",boxSizing:"border-box"}} value={linkId} onChange={e=>setLinkId(e.target.value)}>
                      <option value="">Escolha o produto…</option>
                      {free.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                    </select>
                    <button style={{...styles.avulsaConfirmBtn,width:"100%",marginTop:8,opacity:linkId?1:0.5}} disabled={!linkId} onClick={doLink}>Vincular código</button>
                  </>
                )}
                <div style={{fontSize:12.5,fontWeight:600,color:"#8A7A6C",margin:"12px 0 4px"}}>Ou cadastrar um novo</div>
                <input style={{...styles.input,width:"100%",boxSizing:"border-box"}} placeholder="Nome do novo produto" value={newName} onChange={e=>setNewName(e.target.value)}/>
                <div style={{display:"flex",gap:8,marginTop:8}}>
                  <button style={{...styles.avulsaConfirmBtn,opacity:newName.trim()?1:0.5}} disabled={!newName.trim()} onClick={doCreate}>Cadastrar e vincular</button>
                  <button style={styles.avulsaCancelBtn} onClick={afterAction}>Ignorar</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function StockView({ clients, subscriberStock, subscriberStockLog, shelfProducts, shelfStockLog, petiscoProducts, petiscoStockLog, onAddSubscriberProduction, onUpdateClientUnits, onSetSubscriberBalance, onAddShelfProduct, onAddShelfStockEntry, onDeleteShelfProduct, onUpdateShelfMinStock, onAddPetiscoProduct, onAddPetiscoStockEntry, onDeletePetiscoProduct, onUpdatePetiscoMinStock, onEditClient, onImportShelf, onDownloadShelfTemplate, onImportPetisco, onDownloadPetiscoTemplate, onShelfMove, onSetShelfBarcode, onPetiscoMove, onSetPetiscoBarcode }) {
      const [scanKind, setScanKind] = useState(null);
      const [importKind, setImportKind] = useState(null);
      const [q, setQ] = useState("");
      const [tab, setTab]                       = useState("assinantes");
      const [expandedClient,  setExpandedClient]= useState(null);
      const [productionInputs,setProductionInputs]=useState({});
      const [unitsInputs,     setUnitsInputs]     =useState({});
      const [balanceInputs,   setBalanceInputs]   =useState({});
      const [expandedProduct, setExpandedProduct]=useState(null);
      const [showNewProduct,  setShowNewProduct] =useState(false);
      const [newProductName,  setNewProductName] =useState("");
      const [stockInputs,     setStockInputs]    =useState({});
      const [minStockInputs,  setMinStockInputs] =useState({});
      const [expandedPetisco, setExpandedPetisco]=useState(null);
      const [showNewPetisco,  setShowNewPetisco] =useState(false);
      const [newPetiscoName,  setNewPetiscoName] =useState("");
      const [petiscoInputs,   setPetiscoInputs]  =useState({});
      const [petiscoMinInputs,setPetiscoMinInputs]=useState({});

      const subscribers = clients.filter(c=>c.frequency!=="avulsa");
      const qTokens = normText(q).split(" ").filter(Boolean);
      const hit = (...parts) => { if (!qTokens.length) return true; const h = normText(parts.filter(Boolean).join(" ")); return qTokens.every(t=>h.includes(t)); };
      const subsView    = subscribers.filter(c=>hit(c.dog,c.tutor));
      const shelfView   = shelfProducts.filter(p=>hit(p.name,p.barcode));
      const petiscoView = petiscoProducts.filter(p=>hit(p.name,p.barcode));
      const viewCount   = tab==="assinantes" ? subsView.length : (tab==="avulsos" ? shelfView.length : petiscoView.length);
      const searchHint  = tab==="assinantes" ? "Buscar assinante por cão ou tutor…" : "Buscar produto por nome ou código de barras…";

      return (
        <div style={styles.section}>
          <div style={styles.sectionHeadRow}><h2 style={styles.sectionTitle}>Estoque</h2></div>
          <div style={styles.stockTabRow}>
            {[["assinantes","Assinantes"],["avulsos","Avulsos"],["petiscos","Petiscos"]].map(([key,label])=>(
              <button key={key} style={{...styles.stockTabBtn,...(tab===key?styles.stockTabBtnActive:{})}}
                onClick={()=>{setTab(key);setQ("");}}>{label}</button>
            ))}
          </div>

          <div style={{...styles.searchBar,marginBottom:q?6:16}}>
            <Search size={16} color="#A89A8C"/>
            <input style={styles.searchInput} placeholder={searchHint} value={q} onChange={e=>setQ(e.target.value)}/>
            {q&&<button style={{background:"none",border:"none",padding:2,display:"flex"}} onClick={()=>setQ("")}><X size={15} color="#A89A8C"/></button>}
          </div>
          {q&&<div style={{fontSize:12,color:"#8A7A6C",margin:"0 2px 12px"}}>{viewCount} resultado{viewCount===1?"":"s"}</div>}

          {tab==="assinantes"&&(
            subscribers.length===0?<EmptyState text="Nenhum cliente assinante cadastrado ainda."/>:(
              <div style={styles.cardList}>
                {q&&subsView.length===0&&<EmptyState text="Nenhum assinante encontrado."/>}
                {subsView.map(c=>{
                  const balance=subscriberStock[c.id]??0;
                  const isLow=balance<=(c.units||0);
                  const log=subscriberStockLog[c.id]||[];
                  const exp=expandedClient===c.id;
                  return (
                    <div key={c.id} style={styles.stockCard}>
                      <div style={styles.stockCardTop}>
                        <div style={styles.cardIdentity}>
                          <div style={styles.dogBadge}><PawPrint size={14} color="#B8825A"/></div>
                          <div><div style={styles.cardDog}>{c.dog}</div><div style={styles.cardTutor}>{c.tutor}</div></div>
                        </div>
                        <div style={{textAlign:"right"}}>
                          <div style={{...styles.balanceNum,color:isLow?"#C0594B":"#3E332A"}}>{balance}</div>
                          <div style={styles.balanceLabel}>em estoque</div>
                        </div>
                      </div>
                      <div style={{fontSize:11.5,color:isLow?"#C0594B":"#8A7A6C",display:"flex",alignItems:"center",gap:5,marginTop:4,marginBottom:2}}>
                          {isLow&&<AlertTriangle size={12} color="#C0594B"/>}
                          <span>Estoque mínimo: <strong>{c.units||0} un./entrega</strong></span>
                      </div>
                      <div style={{display:"flex",gap:6,marginTop:6,alignItems:"center"}}>
                        <input type="number" min="1" style={{...styles.input,width:80,padding:"6px 8px",fontSize:12.5}} placeholder="Mín un."
                          value={unitsInputs[c.id]??c.units??""} onChange={e=>setUnitsInputs(p=>({...p,[c.id]:e.target.value}))}/>
                        <button style={{...styles.addStockBtn,background:"#9C8E7E",fontSize:11.5,padding:"0 10px"}} onClick={()=>{
                          const v=parseInt(unitsInputs[c.id]??c.units,10);
                          if(!isNaN(v)&&v>=0)onUpdateClientUnits(c.id,v);
                        }}>Salvar mín.</button>
                      </div>
                      <div style={{display:"flex",gap:6,marginTop:6,alignItems:"center"}}>
                        <input type="number" min="0" style={{...styles.input,width:80,padding:"6px 8px",fontSize:12.5}} placeholder="Inventário"
                          value={balanceInputs[c.id]??""} onChange={e=>setBalanceInputs(p=>({...p,[c.id]:e.target.value}))}/>
                        <button style={{...styles.addStockBtn,background:"#3E7CB1",fontSize:11.5,padding:"0 10px"}} onClick={()=>{
                          const v=parseInt(balanceInputs[c.id],10);
                          if(!isNaN(v)&&v>=0){onSetSubscriberBalance(c.id,v);setBalanceInputs(p=>({...p,[c.id]:""}));}
                        }}>Ajustar inventário</button>
                      </div>
                      {isLow&&<div style={{...styles.lowStockWarning,marginTop:2}}><span>Saldo insuficiente para a próxima entrega — produza mais unidades.</span></div>}
                      <div style={styles.stockEntryRow}>
                        <input type="number" min="1" style={{...styles.input,flex:1}} placeholder="Unidades produzidas"
                          value={productionInputs[c.id]||""} onChange={e=>setProductionInputs(p=>({...p,[c.id]:e.target.value}))}/>
                        <button style={styles.addStockBtn} onClick={()=>{
                          const a=parseInt(productionInputs[c.id],10);
                          if(a>0){onAddSubscriberProduction(c.id,a);setProductionInputs(p=>({...p,[c.id]:""}));}
                        }}><Plus size={14} strokeWidth={2.5}/>Adicionar</button>
                      </div>
                      <button style={styles.historyToggle} onClick={()=>setExpandedClient(exp?null:c.id)}>
                        {exp?"Ocultar histórico":`Ver histórico (${log.length})`}
                      </button>
                      {exp&&<div style={styles.historyList}>{log.length===0?<p style={styles.historyEmpty}>Sem movimentações ainda.</p>:log.map((e,i)=><HistoryRow key={i} entry={e}/>)}</div>}
                    </div>
                  );
                })}
              </div>
            )
          )}

          {tab==="avulsos"&&(
            <>
              <button style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:8,background:"#3E332A",color:"#FBF1E8",border:"none",borderRadius:12,padding:"12px 14px",fontSize:14,fontWeight:700,marginBottom:10}} onClick={()=>setScanKind("shelf")}><ScanBarcode size={16} strokeWidth={2.5}/>Escanear código de barras</button>
              {scanKind==="shelf"&&<ScanModal kind="shelf" products={shelfProducts} onClose={()=>setScanKind(null)} onMove={onShelfMove} onSetBarcode={onSetShelfBarcode} onCreate={onAddShelfProduct}/>}
              <button style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"#F6EEE3",color:"#8A6A48",border:"1px solid #DDD0BE",borderRadius:10,padding:"9px 12px",fontSize:12.5,fontWeight:600,marginBottom:10}} onClick={()=>setImportKind("shelf")}><FileSpreadsheet size={13} strokeWidth={2.5}/>Importar códigos de barras (planilha)</button>
              {importKind==="shelf"&&<BarcodeImportModal kind="shelf" products={shelfProducts} onClose={()=>setImportKind(null)} onSetBarcode={onSetShelfBarcode} onCreate={onAddShelfProduct}/>}
                            <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
                <ImportXlsBtn label="Importar XLS" onFile={onImportShelf}/>
                <button style={{display:"flex",alignItems:"center",gap:5,background:"#F6EEE3",color:"#8A6A48",border:"1px solid #DDD0BE",borderRadius:9,padding:"6px 12px",fontSize:12.5,fontWeight:600,whiteSpace:"nowrap"}}
                  onClick={onDownloadShelfTemplate}>
                  <FileSpreadsheet size={13} strokeWidth={2.5}/>Baixar template
                </button>
              </div>
              <div style={{marginBottom:14}}>
                {showNewProduct?(
                  <div style={styles.newProductBox}>
                    <input style={styles.input} placeholder="Nome do produto (ex: Biscoito Natural 200g)"
                      value={newProductName} onChange={e=>setNewProductName(e.target.value)} autoFocus/>
                    <div style={{display:"flex",gap:8,marginTop:8}}>
                      <button style={styles.avulsaConfirmBtn} onClick={()=>{if(!newProductName.trim())return;onAddShelfProduct(newProductName.trim());setNewProductName("");setShowNewProduct(false);}}>Salvar</button>
                      <button style={styles.avulsaCancelBtn} onClick={()=>setShowNewProduct(false)}>Cancelar</button>
                    </div>
                  </div>
                ):(
                  <button style={styles.newProductTrigger} onClick={()=>setShowNewProduct(true)}>
                    <Plus size={16} strokeWidth={2.5}/>Cadastrar produto de prateleira
                  </button>
                )}
              </div>
              {shelfProducts.length===0?<EmptyState text="Nenhum produto de prateleira cadastrado ainda."/>:(
                <div style={styles.cardList}>
                  {q&&shelfView.length===0&&<EmptyState text="Nenhum produto encontrado."/>}
                  {shelfView.map(p=>{
                    const log=shelfStockLog[p.id]||[];
                    const exp=expandedProduct===p.id;
                    const isLow=p.balance<=(p.min_stock||0);
                    return (
                      <div key={p.id} style={styles.stockCard}>
                        <div style={styles.stockCardTop}>
                          <div style={styles.cardIdentity}><div style={styles.dogBadge}><Package size={14} color="#B8825A"/></div><div><div style={styles.cardDog}>{p.name}</div><button style={{background:"none",border:"none",padding:0,fontSize:11.5,color:"#A89A8C",display:"flex",alignItems:"center",gap:4}} onClick={()=>{const v=window.prompt("Código de barras (deixe vazio para remover):",p.barcode||"");if(v!==null)onSetShelfBarcode(p.id,v.trim()||null);}}><ScanBarcode size={11}/>{p.barcode||"Vincular código"}</button></div></div>
                          <div style={{textAlign:"right"}}><div style={{...styles.balanceNum,color:isLow?"#C0594B":"#3E332A"}}>{p.balance}</div><div style={styles.balanceLabel}>em estoque</div></div>
                        </div>
                        {isLow&&<div style={styles.lowStockWarning}><AlertTriangle size={13} color="#C0594B"/><span>{p.balance<=0?"Sem saldo disponível":`Estoque baixo (mín: ${p.min_stock})`}</span></div>}
                        <div style={styles.stockEntryRow}>
                          <input type="number" min="1" style={{...styles.input,flex:1}} placeholder="Unidades a adicionar"
                            value={stockInputs[p.id]||""} onChange={e=>setStockInputs(s=>({...s,[p.id]:e.target.value}))}/>
                          <button style={styles.addStockBtn} onClick={()=>{const a=parseInt(stockInputs[p.id],10);if(a>0){onAddShelfStockEntry(p.id,a);setStockInputs(s=>({...s,[p.id]:""}))}}}>  <Plus size={14} strokeWidth={2.5}/>Adicionar</button>
                        </div>
                        <div style={{display:"flex",alignItems:"center",gap:6,marginTop:8}}>
                          <input type="number" min="0" style={{...styles.input,width:80,padding:"6px 8px",fontSize:12.5}} placeholder="Mín"
                            value={minStockInputs[p.id]??p.min_stock} onChange={e=>setMinStockInputs(s=>({...s,[p.id]:e.target.value}))}/>
                          <button style={{...styles.addStockBtn,background:"#9C8E7E",fontSize:11.5,padding:"0 10px"}} onClick={()=>{
                            const v=parseInt(minStockInputs[p.id]??p.min_stock,10);
                            if(!isNaN(v)&&v>=0)onUpdateShelfMinStock(p.id,v);
                          }}>Salvar mín.</button>
                        </div>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8}}>
                          <button style={styles.historyToggle} onClick={()=>setExpandedProduct(exp?null:p.id)}>
                            {exp?"Ocultar histórico":`Ver histórico (${log.length})`}
                          </button>
                          <button style={styles.deleteProductBtn} onClick={()=>onDeleteShelfProduct(p.id)}><Trash2 size={13} color="#A89A8C"/></button>
                        </div>
                        {exp&&<div style={styles.historyList}>{log.length===0?<p style={styles.historyEmpty}>Sem movimentações ainda.</p>:log.map((e,i)=><HistoryRow key={i} entry={e}/>)}</div>}
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}

          {tab==="petiscos"&&(
            <>
              <button style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:8,background:"#3E332A",color:"#FBF1E8",border:"none",borderRadius:12,padding:"12px 14px",fontSize:14,fontWeight:700,marginBottom:10}} onClick={()=>setScanKind("snack")}><ScanBarcode size={16} strokeWidth={2.5}/>Escanear código de barras</button>
              {scanKind==="snack"&&<ScanModal kind="snack" products={petiscoProducts} onClose={()=>setScanKind(null)} onMove={onPetiscoMove} onSetBarcode={onSetPetiscoBarcode} onCreate={onAddPetiscoProduct}/>}
              <button style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"#F6EEE3",color:"#8A6A48",border:"1px solid #DDD0BE",borderRadius:10,padding:"9px 12px",fontSize:12.5,fontWeight:600,marginBottom:10}} onClick={()=>setImportKind("snack")}><FileSpreadsheet size={13} strokeWidth={2.5}/>Importar códigos de barras (planilha)</button>
              {importKind==="snack"&&<BarcodeImportModal kind="snack" products={petiscoProducts} onClose={()=>setImportKind(null)} onSetBarcode={onSetPetiscoBarcode} onCreate={onAddPetiscoProduct}/>}
                            <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
                <ImportXlsBtn label="Importar XLS" onFile={onImportPetisco}/>
                <button style={{display:"flex",alignItems:"center",gap:5,background:"#F6EEE3",color:"#8A6A48",border:"1px solid #DDD0BE",borderRadius:9,padding:"6px 12px",fontSize:12.5,fontWeight:600,whiteSpace:"nowrap"}}
                  onClick={onDownloadPetiscoTemplate}>
                  <FileSpreadsheet size={13} strokeWidth={2.5}/>Baixar template
                </button>
              </div>
              <div style={{marginBottom:14}}>
                {showNewPetisco?(
                  <div style={styles.newProductBox}>
                    <input style={styles.input} placeholder="Nome do petisco (ex: Biscoito de Frango 100g)"
                      value={newPetiscoName} onChange={e=>setNewPetiscoName(e.target.value)} autoFocus/>
                    <div style={{display:"flex",gap:8,marginTop:8}}>
                      <button style={styles.avulsaConfirmBtn} onClick={()=>{if(!newPetiscoName.trim())return;onAddPetiscoProduct(newPetiscoName.trim());setNewPetiscoName("");setShowNewPetisco(false);}}>Salvar</button>
                      <button style={styles.avulsaCancelBtn} onClick={()=>setShowNewPetisco(false)}>Cancelar</button>
                    </div>
                  </div>
                ):(
                  <button style={styles.newProductTrigger} onClick={()=>setShowNewPetisco(true)}>
                    <Plus size={16} strokeWidth={2.5}/>Cadastrar petisco
                  </button>
                )}
              </div>
              {petiscoProducts.length===0?<EmptyState text="Nenhum petisco cadastrado ainda."/>:(
                <div style={styles.cardList}>
                  {q&&petiscoView.length===0&&<EmptyState text="Nenhum petisco encontrado."/>}
                  {petiscoView.map(p=>{
                    const log=petiscoStockLog[p.id]||[];
                    const exp=expandedPetisco===p.id;

                    return (
                      <div key={p.id} style={styles.stockCard}>

                          <div style={styles.cardIdentity}><div style={styles.dogBadge}><Cookie size={14} color="#B8825A"/></div><div><div style={styles.cardDog}>{p.name}</div><button style={{background:"none",border:"none",padding:0,fontSize:11.5,color:"#A89A8C",display:"flex",alignItems:"center",gap:4}} onClick={()=>{const v=window.prompt("Código de barras (deixe vazio para remover):",p.barcode||"");if(v!==null)onSetPetiscoBarcode(p.id,v.trim()||null);}}><ScanBarcode size={11}/>{p.barcode||"Vincular código"}</button></div></div>

                        {isLow&&<div style={styles.lowStockWarning}><AlertTriangle size={13} color="#C0594B"/><span>{p.balance<=0?"Sem saldo disponível":`Estoque baixo (mín: ${p.min_stock})`}</span></div>}
                        <div style={styles.stockEntryRow}>
                          <input type="number" min="1" style={{...styles.input,flex:1}} placeholder="Unidades produzidas"
                            value={petiscoInputs[p.id]||""} onChange={e=>setPetiscoInputs(s=>({...s,[p.id]:e.target.value}))}/>
                          <button style={styles.addStockBtn} onClick={()=>{const a=parseInt(petiscoInputs[p.id],10);if(a>0){onAddPetiscoStockEntry(p.id,a);setPetiscoInputs(s=>({...s,[p.id]:""}))}}}>  <Plus size={14} strokeWidth={2.5}/>Adicionar</button>
                        </div>
                        <div style={{display:"flex",alignItems:"center",gap:6,marginTop:8}}>
                          <input type="number" min="0" style={{...styles.input,width:80,padding:"6px 8px",fontSize:12.5}} placeholder="Mín"
                            value={petiscoMinInputs[p.id]??p.min_stock} onChange={e=>setPetiscoMinInputs(s=>({...s,[p.id]:e.target.value}))}/>
                          <button style={{...styles.addStockBtn,background:"#9C8E7E",fontSize:11.5,padding:"0 10px"}} onClick={()=>{
                            const v=parseInt(petiscoMinInputs[p.id]??p.min_stock,10);
                            if(!isNaN(v)&&v>=0)onUpdatePetiscoMinStock(p.id,v);

                        </div>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8}}>
                          <button style={styles.historyToggle} onClick={()=>setExpandedPetisco(exp?null:p.id)}>

                          <button style={styles.deleteProductBtn} onClick={()=>onDeletePetiscoProduct(p.id)}><Trash2 size={13} color="#A89A8C"/></button>

                        {exp&&<div style={styles.historyList}>{log.length===0?<p style={styles.historyEmpty}>Sem movimentações ainda.</p>:log.map((e,i)=><HistoryRow key={i} entry={e}/>)}</div>}
                      </div>
                    );
                  })}
                </div>

            </>
          )}
        </div>
      );
    }

    // ─── ETIQUETAS VIEW (impressão direta) ────────────────────────────────────
    function LabelsView({ getDeliveriesForRange, settings, onSettings, onPrint, onGenerateBat }) {
      const [rFilter,    setRFilter]    = useState("amanha");
      const [customDate, setCustomDate] = useState(()=>tomorrowISO());
      const [excluded,   setExcluded]   = useState({});
      const [previewKey, setPreviewKey] = useState(null);
      const [showCfg,    setShowCfg]    = useState(false);
      const [wIn, setWIn] = useState(String(settings.w));
      const [hIn, setHIn] = useState(String(settings.h));
      const [gapIn, setGapIn] = useState(String(settings.gap||0));
      const [offIn, setOffIn] = useState(String(settings.offsetY||0));
      const t = todayISO(), tmrw = tomorrowISO();
      const activeDate = rFilter==="hoje" ? t : rFilter==="amanha" ? tmrw : customDate;

      const items = useMemo(()=>getDeliveriesForRange(activeDate, activeDate),[activeDate,getDeliveriesForRange]);
      const keyOf = (it) => it.client.id+it.date+(it.orderId||"");
      const selected = items.filter(it=>!excluded[keyOf(it)]);
      const previewItem = items.find(it=>keyOf(it)===previewKey) || selected[0] || items[0] || null;
      const copiesOf = (it) => labelCopies(it.client, settings);
      const totalLabels = selected.reduce((s,it)=>s+copiesOf(it),0);

      const previewDoc = previewItem
        ? labelDoc(buildLabelHTML(previewItem.client, previewItem.date, settings, 1, copiesOf(previewItem)), settings, true)
        : "";
      const ZOOM = 1.6;

      const toggle = (it) => setExcluded(p=>({...p,[keyOf(it)]:!p[keyOf(it)]}));
      const optRow = (key,label) => (
        <label key={key} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"#3E332A",padding:"4px 0"}}>
          <input type="checkbox" checked={!!settings[key]} onChange={e=>onSettings({[key]:e.target.checked})}/>{label}
        </label>
      );

      return (
        <div style={styles.section}>
          <div style={styles.sectionHeadRow}>
            <h2 style={styles.sectionTitle}>Etiquetas</h2>
            <span style={styles.countPill}>{items.length} entrega{items.length!==1?"s":""}</span>
          </div>
          <div style={styles.filterRow}>
            {[["hoje","Hoje"],["amanha","Amanhã"],["data","Outra data"]].map(([key,lbl])=>(
              <button key={key} onClick={()=>{setRFilter(key);setExcluded({});setPreviewKey(null);}}
                style={{...styles.filterBtn,...(rFilter===key?styles.filterBtnActive:{})}}>{lbl}</button>
            ))}
          </div>
          {rFilter==="data"&&(<div style={{marginBottom:16}}><input type="date" style={{...styles.input,maxWidth:200}} value={customDate} onChange={e=>{setCustomDate(e.target.value);setExcluded({});setPreviewKey(null);}}/></div>)}

          {previewItem&&(
            <div style={{marginBottom:16}}>
              <div style={{fontSize:12,fontWeight:600,color:"#8A7A6C",marginBottom:6}}>Pré-visualização ({settings.w}×{settings.h} mm){previewItem?` — ${previewItem.client.dog}`:""}</div>
              <div style={{background:"#E9E1D6",borderRadius:12,padding:14,display:"flex",justifyContent:"center",overflowX:"auto"}}>
                <div style={{width:`${settings.w*ZOOM}mm`,height:`${settings.h*ZOOM}mm`,background:"#fff",borderRadius:`${2*ZOOM}mm`,boxShadow:"0 2px 8px rgba(62,51,42,0.25)",overflow:"hidden",flexShrink:0}}>
                  <iframe title="Prévia da etiqueta" srcDoc={previewDoc} scrolling="no"
                    style={{width:`${settings.w}mm`,height:`${settings.h}mm`,border:0,transform:`scale(${ZOOM})`,transformOrigin:"top left",display:"block"}}/>
                </div>
              </div>
            </div>
          )}

          <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
            <button style={{...styles.batBtn,opacity:totalLabels>0?1:0.45}} disabled={totalLabels===0}
              onClick={()=>onPrint(selected,activeDate)}>
              <Printer size={13} strokeWidth={2.5}/>Imprimir {totalLabels} etiqueta{totalLabels!==1?"s":""}
            </button>
            <button style={{...styles.batBtn,background:"#B8825A",opacity:previewItem?1:0.45}} disabled={!previewItem}
              onClick={()=>previewItem&&onPrint([previewItem],activeDate)}>
              Imprimir só a da prévia
            </button>
            <button style={{...styles.batBtn,background:"#7A6C5E",opacity:previewItem?1:0.45}} disabled={!previewItem}
              onClick={()=>previewItem&&onPrint([previewItem,previewItem,previewItem],activeDate)}
              title="Imprime 3 etiquetas iguais para conferir o alinhamento no rolo">
              Teste de alinhamento (3)
            </button>
            <button style={{...styles.batBtn,background:"#9C8E7E"}} onClick={()=>setShowCfg(v=>!v)}>
              {showCfg?"Fechar ajustes":"Ajustes da etiqueta"}
            </button>
          </div>

          {showCfg&&(
            <div style={{...styles.avulsaPicker,marginTop:0,marginBottom:16}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                <Field label="Largura (mm)">
                  <input style={styles.input} inputMode="decimal" value={wIn}
                    onChange={e=>{setWIn(e.target.value);const v=parseFloat(e.target.value.replace(",","."));if(v>=20&&v<=110)onSettings({w:v});}}/>
                </Field>
                <Field label="Altura (mm)">
                  <input style={styles.input} inputMode="decimal" value={hIn}
                    onChange={e=>{setHIn(e.target.value);const v=parseFloat(e.target.value.replace(",","."));if(v>=15&&v<=110)onSettings({h:v});}}/>
                </Field>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                <Field label="Intervalo entre etiquetas (mm)">
                  <input style={styles.input} inputMode="decimal" value={gapIn}
                    onChange={e=>{setGapIn(e.target.value);const x=parseFloat(e.target.value.replace(",","."));if(x>=0&&x<=10)onSettings({gap:x});}}/>
                </Field>
                <Field label="Ajuste vertical (mm)">
                  <input style={styles.input} inputMode="decimal" value={offIn}
                    onChange={e=>{setOffIn(e.target.value);const x=parseFloat(e.target.value.replace(",","."));if(x>=-3&&x<=3)onSettings({offsetY:x});}}/>
                </Field>
              </div>
              <p style={{margin:"-4px 0 10px",fontSize:11.5,color:"#8A7A6C",lineHeight:1.5}}>
                Se as etiquetas saírem desalinhadas (o conteúdo vai "subindo" a cada etiqueta), coloque aqui o espaço vazio entre uma etiqueta e outra no rolo (geralmente 2 a 3 mm). O ajuste vertical move o conteúdo para cima (−) ou para baixo (+).
              </p>
              {optRow("showLogo","Mostrar o logo da marca")}
              {optRow("showObs","Mostrar observações (horário, referência e observações do cliente)")}
              {optRow("tutorFirstName","Usar só o primeiro nome do tutor")}
              {optRow("showCep","Mostrar cidade e CEP")}
              {optRow("showPhone","Mostrar telefone")}
              {optRow("showDate","Mostrar data da entrega")}
              {optRow("copiesByVolumes","Uma etiqueta por volume (Vol. 1/2, 2/2…)")}
              <p style={{margin:"10px 0 0",fontSize:11.5,color:"#8A7A6C",lineHeight:1.5}}>
                As configurações ficam salvas neste computador. Para imprimir sem a janela de confirmação do Chrome, abra o app por um atalho do Chrome com <b>--kiosk-printing</b> no destino e deixe a Elgin L42 Pro como impressora padrão do Windows.
              </p>
            </div>
          )}

          {items.length===0?<EmptyState text="Nenhuma entrega neste dia."/>:(
            <div style={styles.cardList}>
              {items.map(it=>{
                const k = keyOf(it); const on = !excluded[k]; const isPrev = previewItem && keyOf(previewItem)===k;
                return (
                  <div key={k} style={{...styles.roteiroCard,display:"flex",alignItems:"center",gap:10,borderColor:isPrev?"#B8825A":"#EFE4D6"}}>
                    <input type="checkbox" checked={on} onChange={()=>toggle(it)} style={{width:18,height:18,flexShrink:0}}/>
                    <button style={{background:"none",border:"none",textAlign:"left",flex:1,minWidth:0,padding:0}} onClick={()=>setPreviewKey(k)}>
                      <div style={{display:"flex",gap:6,alignItems:"baseline",flexWrap:"wrap"}}>
                        <span style={styles.cardDog}>{it.client.dog}</span>
                        <span style={{fontSize:12.5,color:"#8A7A6C"}}>· {it.client.tutor}</span>
                      </div>
                      <div style={{fontSize:12,color:"#7A6C5E",marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{it.client.address}</div>
                      {(it.client.janelaEntrega||it.client.notes)&&<div style={{fontSize:11.5,color:"#A8412F",fontWeight:600,marginTop:2}}>OBS: {[it.client.janelaEntrega,it.client.notes].filter(Boolean).join(" | ")}</div>}
                    </button>
                    {copiesOf(it)>1&&<span style={styles.countPill}>{copiesOf(it)} etiq.</span>}
                  </div>
                );
              })}
            </div>
          )}
          <div style={{marginTop:18,textAlign:"right"}}>
            <button style={{background:"none",border:"none",color:"#A89A8C",fontSize:12,fontWeight:600,textDecoration:"underline"}}
              onClick={()=>onGenerateBat(activeDate,selected)}>
              Método antigo: gerar .bat do BarTender
            </button>
          </div>
        </div>
      );
    }

    // ─── PRODUÇÃO · SEMANA SEGUINTE (lista de sexta-feira) ────────────────────
    const dowShort = (iso) => weekdayShort[new Date(iso+"T00:00:00").getDay()];

    function ProducaoSemanaView({ clients, subscriberStock, shelfProducts, petiscoProducts, getDeliveriesForRange, getStatus, showToast }) {
      const [offset, setOffset] = useState(1);
      const [onlyNeeded, setOnlyNeeded] = useState(false);
      const t = todayISO();
      const weekStart = useMemo(()=>{ const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+offset*7-d.getDay()); return dateToISO(d); },[offset]);
      const weekEnd = addDays(weekStart,6);
      const rangeLabel = `${formatDateBR(weekStart)} a ${formatDateBR(weekEnd)}`;

      const data = useMemo(()=>{
        const pending = getDeliveriesForRange(t, weekEnd).filter(({client,date})=>getStatus(client.id,date)!=="entregue");
        const per = {};
        const avulsos = [];
        pending.forEach(({client,date})=>{
          if (client.frequency==="avulsa") { if (date>=weekStart) avulsos.push({client,date}); return; }
          const p = per[client.id] || (per[client.id]={client,dates:[],need:0,committed:0});
          const u = client.units||0;
          if (date>=weekStart) { p.need+=u; p.dates.push(date); }
          else p.committed+=u;
        });
        const rows = Object.values(per).filter(p=>p.dates.length>0).map(p=>{
          const saldo = subscriberStock[p.client.id]??0;
          return {...p, saldo, produzir: Math.max(0, p.need+p.committed-saldo)};
        }).sort((a,b)=>(a.dates[0]||"").localeCompare(b.dates[0]||"")||a.client.dog.localeCompare(b.client.dog));
        const groups = {};
        rows.forEach(r=>{
          const raw = (r.client.receita||"").trim();
          const key = raw ? normLabel(raw) : "__sem__";
          const g = groups[key] || (groups[key]={label:raw||"Sem receita definida", sem:!raw, pets:0, need:0, produzir:0});
          g.pets++; g.need+=r.need; g.produzir+=r.produzir;
        });
        const groupList = Object.values(groups).sort((a,b)=>(a.sem-b.sem)||(b.produzir-a.produzir)||a.label.localeCompare(b.label));
        const lowOf = (arr) => arr.filter(p=>(p.min_stock||0)>0&&p.balance<p.min_stock).map(p=>({name:p.name,balance:p.balance,min:p.min_stock,produzir:p.min_stock-p.balance}));
        return { rows, groups:groupList, lowShelf:lowOf(shelfProducts), lowSnack:lowOf(petiscoProducts), avulsos };
      },[getDeliveriesForRange,getStatus,t,weekStart,weekEnd,subscriberStock,shelfProducts,petiscoProducts]);

      const totalProduzir = data.rows.reduce((s,r)=>s+r.produzir,0);
      const shown = onlyNeeded ? data.rows.filter(r=>r.produzir>0) : data.rows;

      const buildText = () => {
        const L = [`*Produção ObentōPet — semana ${rangeLabel}*`, `Total a produzir: ${totalProduzir} un. (${data.rows.filter(r=>r.produzir>0).length} pets)`, ``, `*Resumo por receita*`];
        data.groups.forEach(g=>L.push(`• ${g.label}: ${g.produzir} un. (${g.pets} pet${g.pets!==1?"s":""})`));
        L.push("", "*Por pet*");
        shown.forEach((r,i)=>L.push(`${i+1}. ${r.client.dog} (${r.client.tutor}) — produzir ${r.produzir} un.${r.client.receita?` · ${r.client.receita}`:""} · entregas: ${r.dates.map(d=>dowShort(d).toLowerCase()+" "+formatDateBR(d)).join(", ")}`));
        if (data.lowShelf.length) { L.push("", "*Avulsos abaixo do mínimo*"); data.lowShelf.forEach(p=>L.push(`• ${p.name}: +${p.produzir}`)); }
        if (data.lowSnack.length) { L.push("", "*Petiscos abaixo do mínimo*"); data.lowSnack.forEach(p=>L.push(`• ${p.name}: +${p.produzir}`)); }
        return L.join("\n");
      };
      const copyWhatsApp = () => {
        const txt = buildText();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(()=>showToast("Lista copiada! Cole no WhatsApp.")).catch(()=>showToast("Não foi possível copiar automaticamente.","error"));
        } else showToast("Não foi possível copiar automaticamente.","error");
      };

      const handlePrint = () => {
        const tbl = (head, rowsHtml) => `<table><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rowsHtml}</table>`;
        const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Produção ${rangeLabel}</title>
          <style>@page{size:A4;margin:12mm}body{font-family:Arial,sans-serif;color:#3E332A;font-size:12px}h1{font-size:19px;margin:0 0 4px}h2{font-size:12px;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.5px;color:#8A6A48}.sub{color:#8A7A6C;margin-bottom:8px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:5px 8px;text-align:left}th{background:#F6EEE3}td.n{text-align:right}.big{font-weight:700;color:#A8412F}tr{page-break-inside:avoid}</style></head><body>
          <h1>Lista de produção — semana ${rangeLabel}</h1><div class="sub">Emitida em ${formatDateBR(t)} · ${totalProduzir} un. a produzir</div>
          <h2>Resumo por receita</h2>
          ${tbl(["Receita","Pets","Necessário","Produzir"], data.groups.map(g=>`<tr><td>${escHtml(g.label)}</td><td class="n">${g.pets}</td><td class="n">${g.need}</td><td class="n big">${g.produzir}</td></tr>`).join(""))}
          <h2>Detalhe por pet</h2>
          ${tbl(["Pet","Tutor","Receita","Entregas","Necess.","Saldo","Produzir"], shown.map(r=>`<tr><td><b>${escHtml(r.client.dog)}</b></td><td>${escHtml(r.client.tutor)}</td><td>${escHtml(r.client.receita||"—")}</td><td>${r.dates.map(d=>dowShort(d)+" "+formatDateBR(d)).join(", ")}</td><td class="n">${r.need+r.committed}</td><td class="n">${r.saldo}</td><td class="n big">${r.produzir}</td></tr>`).join(""))}
          ${data.lowShelf.length?`<h2>Avulsos abaixo do mínimo</h2>${tbl(["Produto","Saldo","Mín","Produzir"], data.lowShelf.map(p=>`<tr><td>${escHtml(p.name)}</td><td class="n">${p.balance}</td><td class="n">${p.min}</td><td class="n big">+${p.produzir}</td></tr>`).join(""))}`:""}
          ${data.lowSnack.length?`<h2>Petiscos abaixo do mínimo</h2>${tbl(["Petisco","Saldo","Mín","Produzir"], data.lowSnack.map(p=>`<tr><td>${escHtml(p.name)}</td><td class="n">${p.balance}</td><td class="n">${p.min}</td><td class="n big">+${p.produzir}</td></tr>`).join(""))}`:""}
          </body></html>`;
        printHtmlDoc(html);
      };

      const Section = ({icon:Icon, title, children}) => (
        <div style={{marginTop:22}}>
          <div style={styles.producaoSection}><Icon size={14} color="#B8825A"/><span style={styles.producaoSectionTitle}>{title}</span></div>
          {children}
        </div>
      );

      return (
        <div>
          <div style={styles.weekNav}>
            <button style={styles.navArrow} onClick={()=>setOffset(o=>Math.max(0,o-1))} disabled={offset<=0}><ChevronLeft size={18}/></button>
            <div style={{textAlign:"center"}}>
              <div style={styles.weekLabel}>{rangeLabel}</div>
              <div style={{fontSize:10.5,color:"#A89A8C",fontWeight:600}}>{offset===1?"Semana seguinte":offset===0?"Semana atual":`+${offset} semanas`} · semana {getWeekNumber(weekStart)}</div>
            </div>
            <button style={styles.navArrow} onClick={()=>setOffset(o=>o+1)}><ChevronRight size={18}/></button>
          </div>

          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:6}}>
            <span style={{...styles.countPill,background:totalProduzir>0?"#FBEAE6":"#E8F5E8",color:totalProduzir>0?"#A8412F":"#4A7A4A"}}>{totalProduzir} un. a produzir</span>
            <span style={styles.countPill}>{data.rows.length} pet{data.rows.length!==1?"s":""} com entrega</span>
            <div style={{flex:1}}/>
            <button style={styles.batBtn} onClick={handlePrint}><Printer size={13} strokeWidth={2.5}/>Imprimir PDF</button>
            <button style={{...styles.batBtn,background:"#25A244"}} onClick={copyWhatsApp}><MessageCircle size={13} strokeWidth={2.5}/>Copiar WhatsApp</button>
          </div>
          <p style={{margin:"4px 0 0",fontSize:11.5,color:"#A89A8C",lineHeight:1.45}}>
            Produzir = unidades das entregas da semana + entregas pendentes até lá − saldo atual em estoque.
          </p>

          <Section icon={ClipboardList} title="Resumo por receita">
            {data.groups.length===0?<EmptyState text="Nenhuma entrega de assinante nesta semana."/>:(
              <div style={styles.cardList}>
                {data.groups.map(g=>(
                  <div key={g.label} style={styles.producaoCard}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:14.5,color:g.sem?"#A89A8C":"#3E332A"}}>{g.label}</div>
                        <div style={{fontSize:12,color:"#8A7A6C"}}>{g.pets} pet{g.pets!==1?"s":""} · necessário {g.need} un.</div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:22,fontWeight:800,color:g.produzir>0?"#A8412F":"#5C8A5C",lineHeight:1}}>{g.produzir}</div>
                        <div style={{fontSize:10.5,color:"#A89A8C",fontWeight:600}}>a produzir</div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </Section>

          <Section icon={PawPrint} title="Detalhe por pet">

    // ─── PRODUÇÃO · ESTOQUE BAIXO ─────────────────────────────────────────────
    function ProducaoEstoqueView({ clients, subscriberStock, shelfProducts, petiscoProducts }) {
      const subscribers = clients.filter(c=>c.frequency!=="avulsa");
      const lowSubscribers = subscribers.filter(c=>(subscriberStock[c.id]??0)<=(c.units||0));

      const lowPetiscos    = petiscoProducts.filter(p=>p.balance<=(p.min_stock||0));
      const total = lowSubscribers.length+lowShelf.length+lowPetiscos.length;

      const handlePrint = () => {
        const win = window.open("","_blank","width=700,height=600");
        const t = todayISO();
        const rows = [
          ...lowSubscribers.map(c=>({cat:"Assinante",name:c.dog+" ("+c.tutor+")",atual:subscriberStock[c.id]??0,min:c.units||0,deficit:(c.units||0)-(subscriberStock[c.id]??0)})),
          ...lowShelf.map(p=>({cat:"Avulso",name:p.name,atual:p.balance,min:p.min_stock||0,deficit:(p.min_stock||0)-p.balance})),
          ...lowPetiscos.map(p=>({cat:"Petisco",name:p.name,atual:p.balance,min:p.min_stock||0,deficit:(p.min_stock||0)-p.balance})),

          </head><body><h1>Produção necessária — ${t}</h1>
          <table><tr><th>Categoria</th><th>Produto/Pet</th><th>Saldo atual</th><th>Mín</th><th>Produzir</th></tr>
          ${rows.map(r=>`<tr><td>${r.cat}</td><td>${r.name}</td><td>${r.atual}</td><td>${r.min}</td><td class="deficit">+${Math.max(0,r.deficit)}</td></tr>`).join("")}
          </table></body></html>`);
        win.document.close();
        win.print();
      };

      return (
        <div style={styles.section}>

            </div>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:20}}>
              {lowSubscribers.length>0&&(
                <div>
                  <div style={styles.producaoSection}>
                    <PawPrint size={14} color="#B8825A"/>
                    <span style={styles.producaoSectionTitle}>Assinantes com saldo baixo</span>
                  </div>
                  <div style={styles.cardList}>
                    {lowSubscribers.map(c=>{
                      const atual=subscriberStock[c.id]??0;

                      return (

                  </div>
                  <div style={styles.cardList}>
                    {lowShelf.map(p=>{
                      const deficit=Math.max(0,(p.min_stock||0)-p.balance);

                              <div style={{fontSize:13,color:"#C0594B",fontWeight:700}}>Saldo: {p.balance} / {p.min_stock||0} mín</div>

                    {lowPetiscos.map(p=>{
                      const deficit=Math.max(0,(p.min_stock||0)-p.balance);

                            <div style={{textAlign:"right"}}>

                              <div style={{fontSize:12,color:"#B8825A",fontWeight:600}}>Produzir: +{deficit} un.</div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ─── ROTEIRO VIEW ─────────────────────────────────────────────────────────
    function RoteiroView({ todayDeliveries, getStatus, getDeliveriesForRange }) {
      const [rFilter, setRFilter] = useState("hoje");
      const [rCustomDate, setRCustomDate] = useState(()=>todayISO());
      const t = todayISO();
      const tmrw = tomorrowISO();
      const activeDate = rFilter==="hoje" ? t : rFilter==="amanha" ? tmrw : rCustomDate;

      const items = useMemo(()=>{
        return getDeliveriesForRange(activeDate, activeDate);
      },[activeDate,getDeliveriesForRange]);

      const copyWhatsApp = () => {
        const dateLabel = formatDateFull(activeDate);
        const lines = [`*Roteiro ObentōPet — ${dateLabel}*`,`Total: ${items.length} entrega${items.length!==1?"s":""}`,``];
        items.forEach(({client,date},i)=>{
          lines.push(`${i+1}. 🐾 *${client.dog}* (${client.tutor})`);
          lines.push(`   📍 ${client.address}`);
          if (client.volumes) lines.push(`   📦 ${client.volumes} volume${client.volumes!==1?"s":""}${client.units?` · ${client.units} un.`:""}`);
          else if (client.units) lines.push(`   📦 ${client.units} unidade${client.units!==1?"s":""}`);
          if (client.complemento) lines.push(`   🏢 ${client.complemento}`);
          if (client.referencia) lines.push(`   🧭 ${client.referencia}`);
          if (client.janelaEntrega) lines.push(`   🕒 ${client.janelaEntrega}`);
          if (client.phone) lines.push(`   📱 ${client.phone}`);
          lines.push("");
        });
        navigator.clipboard.writeText(lines.join("\n")).then(()=>{
          alert("Roteiro copiado! Cole no WhatsApp.");
        }).catch(()=>{
          alert("Não foi possível copiar automaticamente. Selecione e copie manualmente.");
        });
      };

      const handlePrint = () => {
        const dateLabel = formatDateFull(activeDate);
        const win = window.open("","_blank","width=700,height=600");
        win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Roteiro ${dateLabel}</title>
          <style>body{font-family:sans-serif;padding:24px;color:#3E332A}h1{font-size:18px;margin-bottom:4px}.sub{font-size:13px;color:#8A7A6C;margin-bottom:20px}.card{border:1px solid #E8DDD0;border-radius:10px;padding:14px 16px;margin-bottom:12px}.num{font-size:11px;font-weight:700;color:#B8825A;text-transform:uppercase;margin-bottom:4px}.dog{font-size:16px;font-weight:700}.tutor{font-size:13px;color:#8A7A6C}.addr{font-size:13px;margin-top:6px;color:#3E332A}.info{font-size:12px;color:#A89A8C;margin-top:3px}@media print{body{padding:12px}}</style>
          </head><body><h1>Roteiro ObentōPet</h1><p class="sub">${dateLabel} · ${items.length} entrega${items.length!==1?"s":""}</p>
          ${items.map(({client},i)=>`<div class="card"><div class="num">Entrega ${i+1}</div><div class="dog">🐾 ${client.dog}</div><div class="tutor">${client.tutor}</div><div class="addr">📍 ${client.address}</div>${client.volumes?`<div class="info">📦 ${client.volumes} volume${client.volumes!==1?"s":""}${client.units?` · ${client.units} un.`:""}</div>`:client.units?`<div class="info">📦 ${client.units} unidade${client.units!==1?"s":""}</div>`:""}${client.complemento?`<div class="info">🏢 ${client.complemento}</div>`:""}${client.referencia?`<div class="info">🧭 ${client.referencia}</div>`:""}${client.janelaEntrega?`<div class="info" style="color:#A8412F;font-weight:700">🕒 ${client.janelaEntrega}</div>`:""}${client.phone?`<div class="info">📱 ${client.phone}</div>`:""}</div>`).join("")}
          </body></html>`);
        win.document.close();
        win.print();
      };

      return (
        <div style={styles.section}>
          <div style={styles.sectionHeadRow}>
            <h2 style={styles.sectionTitle}>Roteiro</h2>
            <span style={styles.countPill}>{items.length} entrega{items.length!==1?"s":""}</span>
          </div>
          <div style={styles.filterRow}>
            {[["hoje","Hoje"],["amanha","Amanhã"],["data","Outra data"]].map(([key,lbl])=>(
              <button key={key} onClick={()=>setRFilter(key)}
                style={{...styles.filterBtn,...(rFilter===key?styles.filterBtnActive:{})}}>{lbl}</button>
            ))}
          </div>
          {rFilter==="data"&&(<div style={{marginBottom:16}}><input type="date" style={{...styles.input,maxWidth:200}} value={rCustomDate} onChange={e=>setRCustomDate(e.target.value)}/></div>)}
          <div style={{display:"flex",gap:8,marginBottom:16}}>
            <button style={styles.batBtn} onClick={handlePrint}>
              <Printer size={13} strokeWidth={2.5}/>Imprimir PDF
            </button>
            <button style={{...styles.batBtn,background:"#25A244"}} onClick={copyWhatsApp}>
              <MessageCircle size={13} strokeWidth={2.5}/>Copiar WhatsApp
            </button>
          </div>
          {items.length===0?<EmptyState text="Nenhuma entrega neste período."/>:(
            <div style={styles.cardList}>
              {items.map(({client,date,orderId},i)=>(
                <div key={client.id+date+(orderId||"")} style={styles.roteiroCard}>
                  <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                    <div style={{width:28,height:28,borderRadius:"50%",background:"#F6EEE3",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:12,fontWeight:700,color:"#B8825A"}}>{i+1}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                        <span style={styles.cardDog}>{client.dog}</span>
                        <span style={{fontSize:12.5,color:"#8A7A6C"}}>· {client.tutor}</span>
                        {getStatus(client.id,date)==="entregue"&&<span style={{fontSize:10.5,fontWeight:700,color:"#5C8A5C",background:"#E8F5E8",padding:"2px 7px",borderRadius:6}}>✓ Entregue</span>}
                      </div>
                      <div style={{fontSize:12.5,color:"#7A6C5E",marginTop:4,display:"flex",gap:4,alignItems:"center"}}>
                        <MapPin size={11} color="#A89A8C" style={{flexShrink:0}}/>
                        {client.address}
                      </div>
                      {client.complemento&&<div style={{fontSize:12,color:"#7A6C5E",marginTop:3}}>Compl.: {client.complemento}</div>}
                      {client.referencia&&<div style={{fontSize:12,color:"#7A6C5E",marginTop:2}}>Ref.: {client.referencia}</div>}
                      {client.janelaEntrega&&<div style={{fontSize:12,color:"#A8412F",fontWeight:700,marginTop:2}}>Horário: {client.janelaEntrega}</div>}
                      {client.phone&&<div style={{fontSize:12,color:"#A89A8C",marginTop:3,display:"flex",gap:4,alignItems:"center"}}><Phone size={11} color="#C9BBA8"/>{client.phone}</div>}
                      {client.contatoAlt&&<div style={{fontSize:12,color:"#A89A8C",marginTop:2}}>Contato alt.: {client.contatoAlt}</div>}
                      {(client.volumes||client.units)&&<div style={{fontSize:11.5,color:"#B8825A",fontWeight:600,marginTop:3,display:"flex",gap:10}}>
                        {client.volumes&&<span>📦 {client.volumes} vol.</span>}
                        {client.units&&<span>{client.units} un.</span>}
                      </div>}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

                    </button>
                    <button type="button" onClick={()=>setScope("following")}

                      Esta e as seguintes
                    </button>
                  </div>
                  <p style={{margin:"6px 0 0",fontSize:11.5,color:"#A89A8C",lineHeight:1.4}}>
                    {scope==="only"?"A data original volta a aparecer normalmente nas próximas ocorrências.":"O dia fixo de entrega será alterado permanentemente a partir desta data."}

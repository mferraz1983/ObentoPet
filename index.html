<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ObentōPet — Entregas</title>

  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.3/babel.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    input:focus, textarea:focus, select:focus { outline: 2px solid #B8825A; outline-offset: 1px; }
    button:focus-visible { outline: 2px solid #B8825A; outline-offset: 2px; }
    button { font-family: inherit; cursor: pointer; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #E8DDD0; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;
    const { createClient } = supabase;
    const {
      Plus, Check, Clock, Truck, PawPrint, MapPin, X, Search,
      ChevronLeft, ChevronRight, Trash2, Edit3, Package,
      ArrowDownCircle, ArrowUpCircle, AlertTriangle, Cookie,
      CheckCircle, RefreshCw,
    } = LucideReact;

    // ─── Supabase ────────────────────────────────────────────────────────────────
    const SUPABASE_URL = "https://jyrudfwdwkwynolpbni.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5cnVqZGZ3ZHdrd3lub2xwYm5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNDQ1NjIsImV4cCI6MjA5NzcyMDU2Mn0.qXI47InAtYkEspDp_cD34nOjaHk1mnKw2KU6y7MNL1A";
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    // ─── Helpers ─────────────────────────────────────────────────────────────────

    // FIX: usa data local em vez de UTC — evita bug de fuso horário (Brasil UTC-3)
    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    const weekdayNames = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
    const weekdayShort = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];

    function dateToISO(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
    function formatDateBR(iso) { const [,m,d] = iso.split("-"); return `${d}/${m}`; }
    function addDays(iso, days) {
      const d = new Date(iso + "T00:00:00");
      d.setDate(d.getDate() + days);
      return dateToISO(d);
    }

    // DB ↔ App mapping
    const dbToClient = (r) => ({
      id: r.id, tutor: r.tutor, dog: r.dog, address: r.address,
      frequency: r.frequency, nextDate: r.next_date,
      units: r.units, notes: r.notes || "",
    });
    const clientToDb = (data, id) => ({
      id, tutor: data.tutor, dog: data.dog, address: data.address,
      frequency: data.frequency, next_date: data.nextDate,
      units: data.units, notes: data.notes,
    });

    // ─── Frequências / Status ─────────────────────────────────────────────────────
    function getOccurrencesInRange(client, startISO, endISO) {
      const out = [];
      if (!client.nextDate) return out;
      if (client.frequency === "avulsa") {
        if (client.nextDate >= startISO && client.nextDate <= endISO) out.push(client.nextDate);
        return out;
      }
      if (client.frequency === "mensal") {
        let cur = new Date(client.nextDate + "T00:00:00");
        const start = new Date(startISO + "T00:00:00");
        const end   = new Date(endISO   + "T00:00:00");
        while (cur > start) { const p = new Date(cur); p.setMonth(p.getMonth()-1); cur = p; }
        while (cur <= end)  { if (cur >= start) out.push(dateToISO(cur)); const n = new Date(cur); n.setMonth(n.getMonth()+1); cur = n; }
        return out;
      }
      const step = client.frequency === "semanal" ? 7 : 14;
      let cur = client.nextDate;
      while (cur > startISO) cur = addDays(cur, -step);
      while (cur <= endISO)  { if (cur >= startISO) out.push(cur); cur = addDays(cur, step); }
      return out;
    }

    const frequencyLabel = { semanal:"Semanal", quinzenal:"Quinzenal", mensal:"Mensal", avulsa:"Avulsa" };
    const statusConfig   = {
      preparando: { label:"Preparando", color:"#B8825A", icon:Clock },
      a_caminho:  { label:"A caminho",  color:"#3E7CB1", icon:Truck },
      entregue:   { label:"Entregue",   color:"#5C8A5C", icon:Check },
    };

    // ─── Toast ────────────────────────────────────────────────────────────────────
    function Toast({ message, type = "success", onDismiss }) {
      useEffect(() => { const t = setTimeout(onDismiss, 4000); return () => clearTimeout(t); }, [onDismiss]);
      const bg = type === "error" ? "#C0594B" : "#5C8A5C";
      const Icon = type === "error" ? AlertTriangle : CheckCircle;
      return (
        <div style={{ ...styles.toast, background: bg }} onClick={onDismiss}>
          <Icon size={16} color="#fff" strokeWidth={2.5} />
          <span>{message}</span>
        </div>
      );
    }

    // ─── App ──────────────────────────────────────────────────────────────────────
    function App() {
      const [clients,            setClients]            = useState([]);
      const [loaded,             setLoaded]             = useState(false);
      const [refreshing,         setRefreshing]         = useState(false);
      const [statusLog,          setStatusLog]          = useState({});
      const [view,               setView]               = useState("hoje");
      const [weekOffset,         setWeekOffset]         = useState(0);
      const [search,             setSearch]             = useState("");
      const [showForm,           setShowForm]           = useState(false);
      const [editingClient,      setEditingClient]      = useState(null);
      const [toast,              setToast]              = useState(null);

      const [subscriberStock,    setSubscriberStock]    = useState({});
      const [subscriberStockLog, setSubscriberStockLog] = useState({});
      const [shelfProducts,      setShelfProducts]      = useState([]);
      const [shelfStockLog,      setShelfStockLog]      = useState({});
      const [deliveryDeduction,  setDeliveryDeduction]  = useState({});
      const [petiscoProducts,    setPetiscoProducts]    = useState([]);
      const [petiscoStockLog,    setPetiscoStockLog]    = useState({});

      const showToast = useCallback((msg, type = "success") => setToast({ msg, type }), []);

      // ── Carrega todos os dados do Supabase ────────────────────────────────────
      const loadData = useCallback(async (silent = false) => {
        if (!silent) setLoaded(false);
        else setRefreshing(true);
        try {
          const [
            { data: cData,   error: e1 },
            { data: sData,   error: e2 },
            { data: ssData,  error: e3 },
            { data: sslData, error: e4 },
            { data: spData,  error: e5 },
            { data: splData, error: e6 },
            { data: ddData,  error: e7 },
            { data: ppData,  error: e8 },
            { data: pplData, error: e9 },
          ] = await Promise.all([
            db.from("clients").select("*"),
            db.from("status_log").select("*"),
            db.from("subscriber_stock").select("*"),
            db.from("subscriber_stock_log").select("*").order("ts", { ascending: false }),
            db.from("shelf_products").select("*"),
            db.from("shelf_stock_log").select("*").order("ts", { ascending: false }),
            db.from("delivery_deduction").select("*"),
            db.from("snack_products").select("*"),
            db.from("snack_stock_log").select("*").order("ts", { ascending: false }),
          ]);

          // FIX: verifica erro do Supabase antes de processar
          const firstError = e1||e2||e3||e4||e5||e6||e7||e8||e9;
          if (firstError) throw new Error(firstError.message);

          setClients((cData || []).map(dbToClient));

          const sl = {};
          (sData || []).forEach(r => { sl[r.key] = r.status; });
          setStatusLog(sl);

          const ss = {};
          (ssData || []).forEach(r => { ss[r.client_id] = r.balance; });
          setSubscriberStock(ss);

          const ssl = {};
          (sslData || []).forEach(r => {
            if (!ssl[r.client_id]) ssl[r.client_id] = [];
            if (ssl[r.client_id].length < 100)
              ssl[r.client_id].push({ date: r.date, amount: r.amount, reason: r.reason, ts: r.ts });
          });
          setSubscriberStockLog(ssl);

          setShelfProducts((spData || []).map(p => ({ id: p.id, name: p.name, balance: p.balance })));

          const spl = {};
          (splData || []).forEach(r => {
            if (!spl[r.product_id]) spl[r.product_id] = [];
            if (spl[r.product_id].length < 100)
              spl[r.product_id].push({ date: r.date, amount: r.amount, reason: r.reason, ts: r.ts });
          });
          setShelfStockLog(spl);

          const dd = {};
          (ddData || []).forEach(r => { dd[r.key] = { productId: r.product_id, amount: r.amount }; });
          setDeliveryDeduction(dd);

          setPetiscoProducts((ppData || []).map(p => ({ id: p.id, name: p.name, balance: p.balance })));

          const ppl = {};
          (pplData || []).forEach(r => {
            if (!ppl[r.product_id]) ppl[r.product_id] = [];
            if (ppl[r.product_id].length < 100)
              ppl[r.product_id].push({ date: r.date, amount: r.amount, reason: r.reason, ts: r.ts });
          });
          setPetiscoStockLog(ppl);

          if (silent) showToast("Dados atualizados!");
        } catch (e) {
          console.error("Erro ao carregar dados:", e);
          showToast("Erro ao conectar com o banco de dados. Verifique a internet.", "error");
        } finally {
          setLoaded(true);
          setRefreshing(false);
        }
      }, [showToast]);

      // Carrega na primeira vez
      useEffect(() => { loadData(); }, [loadData]);

      // FIX: sincronização para uso simultâneo — recarrega quando o app volta ao foco
      useEffect(() => {
        const handleVisibility = () => {
          if (!document.hidden) loadData(true);
        };
        document.addEventListener("visibilitychange", handleVisibility);
        return () => document.removeEventListener("visibilitychange", handleVisibility);
      }, [loadData]);

      // ── Clientes ───────────────────────────────────────────────────────────────
      const saveClient = async (data) => {
        const isEditing = !!editingClient;
        const id = isEditing ? editingClient.id : "c" + Date.now();
        const row = clientToDb(data, id);

        // FIX: verifica erro do Supabase e propaga para o modal tratar
        if (isEditing) {
          const { error } = await db.from("clients").update(row).eq("id", id);
          if (error) throw new Error("Falha ao atualizar: " + error.message);
          setClients(prev => prev.map(c => c.id === id ? { ...c, ...data } : c));
        } else {
          const { error } = await db.from("clients").insert(row);
          if (error) throw new Error("Falha ao inserir: " + error.message);
          setClients(prev => [...prev, { ...data, id }]);
          if (data.frequency !== "avulsa") {
            await db.from("subscriber_stock").upsert({ client_id: id, balance: 0 });
            setSubscriberStock(prev => ({ ...prev, [id]: 0 }));
          }
        }

        setShowForm(false);
        setEditingClient(null);
        showToast(isEditing ? `${data.dog} atualizado com sucesso!` : `${data.dog} adicionado com sucesso!`);
      };

      // FIX: deleta também dados relacionados no banco
      const deleteClient = async (id) => {
        const { error } = await db.from("clients").delete().eq("id", id);
        if (error) { showToast("Erro ao excluir cliente.", "error"); return; }
        await db.from("subscriber_stock").delete().eq("client_id", id);
        await db.from("subscriber_stock_log").delete().eq("client_id", id);
        setClients(prev => prev.filter(c => c.id !== id));
        setSubscriberStock(prev => { const n = {...prev}; delete n[id]; return n; });
        setSubscriberStockLog(prev => { const n = {...prev}; delete n[id]; return n; });
      };

      // ── Status de entrega ─────────────────────────────────────────────────────
      const getStatus = (clientId, date) => statusLog[`${clientId}|${date}`] || "preparando";

      const setStatus = (clientId, date, newStatus, deduction) => {
        const key = `${clientId}|${date}`;
        const wasEntregue  = (statusLog[key] || "preparando") === "entregue";
        const willEntregue = newStatus === "entregue";
        const client = clients.find(c => c.id === clientId);

        setStatusLog(prev => ({ ...prev, [key]: newStatus }));
        db.from("status_log").upsert({ key, status: newStatus });

        if (!client) return;

        if (client.frequency === "avulsa") {
          if (!wasEntregue && willEntregue && deduction?.productId) {
            applyShelfDelta(deduction.productId, -deduction.amount, date, "Entrega avulsa");
            setDeliveryDeduction(prev => ({ ...prev, [key]: deduction }));
            db.from("delivery_deduction").upsert({ key, product_id: deduction.productId, amount: deduction.amount });
          }
          if (wasEntregue && !willEntregue) {
            setDeliveryDeduction(prev => {
              const ded = prev[key];
              if (ded?.productId) applyShelfDelta(ded.productId, ded.amount, date, "Estorno (status revertido)");
              const n = { ...prev }; delete n[key]; return n;
            });
            db.from("delivery_deduction").delete().eq("key", key);
          }
        } else {
          const amount = client.units || 0;
          if (!wasEntregue && willEntregue)  applySubscriberDelta(clientId, -amount, date, "Entrega realizada");
          if (wasEntregue  && !willEntregue) applySubscriberDelta(clientId,  amount, date, "Estorno (status revertido)");
        }
      };

      // FIX: usa setState funcional para evitar closure desatualizada
      const applySubscriberDelta = (clientId, delta, date, reason) => {
        const ts = Date.now();
        setSubscriberStock(prev => {
          const newBalance = (prev[clientId] || 0) + delta;
          db.from("subscriber_stock").upsert({ client_id: clientId, balance: newBalance });
          return { ...prev, [clientId]: newBalance };
        });
        setSubscriberStockLog(prev => ({
          ...prev,
          [clientId]: [{ date, amount: delta, reason, ts }, ...(prev[clientId] || [])].slice(0, 100),
        }));
        db.from("subscriber_stock_log").insert({ client_id: clientId, date, amount: delta, reason, ts });
      };

      const addSubscriberProduction = (clientId, amount) => {
        if (!amount || amount <= 0) return;
        applySubscriberDelta(clientId, amount, todayISO(), "Produção adicionada");
      };

      // FIX: usa setState funcional para evitar closure desatualizada
      const applyShelfDelta = (productId, delta, date, reason) => {
        const ts = Date.now();
        setShelfProducts(prev => {
          const product = prev.find(p => p.id === productId);
          const newBalance = (product?.balance || 0) + delta;
          db.from("shelf_products").update({ balance: newBalance }).eq("id", productId);
          return prev.map(p => p.id === productId ? { ...p, balance: newBalance } : p);
        });
        setShelfStockLog(prev => ({
          ...prev,
          [productId]: [{ date, amount: delta, reason, ts }, ...(prev[productId] || [])].slice(0, 100),
        }));
        db.from("shelf_stock_log").insert({ product_id: productId, date, amount: delta, reason, ts });
      };

      const addShelfProduct = async (name) => {
        const id = "p" + Date.now();
        const { error } = await db.from("shelf_products").insert({ id, name, balance: 0 });
        if (error) { showToast("Erro ao criar produto.", "error"); return null; }
        setShelfProducts(prev => [...prev, { id, name, balance: 0 }]);
        return id;
      };

      const addShelfStockEntry = (productId, amount) => {
        if (!amount || amount <= 0) return;
        applyShelfDelta(productId, amount, todayISO(), "Entrada de estoque");
      };

      const deleteShelfProduct = async (productId) => {
        const { error } = await db.from("shelf_products").delete().eq("id", productId);
        if (error) { showToast("Erro ao excluir produto.", "error"); return; }
        setShelfProducts(prev => prev.filter(p => p.id !== productId));
      };

      // FIX: usa setState funcional para evitar closure desatualizada
      const applyPetiscoDelta = (productId, delta, date, reason) => {
        const ts = Date.now();
        setPetiscoProducts(prev => {
          const product = prev.find(p => p.id === productId);
          const newBalance = (product?.balance || 0) + delta;
          db.from("snack_products").update({ balance: newBalance }).eq("id", productId);
          return prev.map(p => p.id === productId ? { ...p, balance: newBalance } : p);
        });
        setPetiscoStockLog(prev => ({
          ...prev,
          [productId]: [{ date, amount: delta, reason, ts }, ...(prev[productId] || [])].slice(0, 100),
        }));
        db.from("snack_stock_log").insert({ product_id: productId, date, amount: delta, reason, ts });
      };

      const addPetiscoProduct = async (name) => {
        const id = "pet" + Date.now();
        const { error } = await db.from("snack_products").insert({ id, name, balance: 0 });
        if (error) { showToast("Erro ao criar petisco.", "error"); return null; }
        setPetiscoProducts(prev => [...prev, { id, name, balance: 0 }]);
        return id;
      };

      const addPetiscoStockEntry = (productId, amount) => {
        if (!amount || amount <= 0) return;
        applyPetiscoDelta(productId, amount, todayISO(), "Produção adicionada");
      };

      const deletePetiscoProduct = async (productId) => {
        const { error } = await db.from("snack_products").delete().eq("id", productId);
        if (error) { showToast("Erro ao excluir petisco.", "error"); return; }
        setPetiscoProducts(prev => prev.filter(p => p.id !== productId));
      };

      // ── Semana ────────────────────────────────────────────────────────────────
      const weekStart = useMemo(() => {
        const d = new Date();
        d.setDate(d.getDate() + weekOffset * 7 - d.getDay());
        return dateToISO(d);
      }, [weekOffset]);

      const weekDays = useMemo(() => Array.from({ length: 7 }, (_, i) => addDays(weekStart, i)), [weekStart]);

      const todayDeliveries = useMemo(() => {
        const t = todayISO();
        return clients
          .flatMap(c => getOccurrencesInRange(c, t, t).map(() => ({ client: c, date: t })))
          .sort((a, b) => a.client.tutor.localeCompare(b.client.tutor));
      }, [clients]);

      const weekDeliveries = useMemo(() => {
        const map = Object.fromEntries(weekDays.map(d => [d, []]));
        clients.forEach(c => {
          getOccurrencesInRange(c, weekDays[0], weekDays[6]).forEach(d => { if (map[d]) map[d].push(c); });
        });
        Object.keys(map).forEach(d => map[d].sort((a, b) => a.tutor.localeCompare(b.tutor)));
        return map;
      }, [clients, weekDays]);

      const filteredClients = useMemo(() => {
        const q = search.trim().toLowerCase();
        return q ? clients.filter(c =>
          c.tutor.toLowerCase().includes(q) ||
          c.dog.toLowerCase().includes(q) ||
          c.address.toLowerCase().includes(q)
        ) : clients;
      }, [clients, search]);

      // ── Render ────────────────────────────────────────────────────────────────
      if (!loaded) return (
        <div style={styles.loadingScreen}>
          <PawPrint size={36} color="#B8825A" />
          <p style={{ color:"#B8825A", fontFamily:"'Segoe UI',sans-serif", marginTop:12, fontSize:15, fontWeight:600 }}>Carregando...</p>
        </div>
      );

      return (
        <div style={styles.app}>
          {toast && <Toast message={toast.msg} type={toast.type} onDismiss={() => setToast(null)} />}

          <header style={styles.header}>
            <div style={styles.headerInner}>
              <div style={styles.brandRow}>
                <div style={styles.brandMark}><PawPrint size={20} color="#FBF1E8" strokeWidth={2.5} /></div>
                <div>
                  <h1 style={styles.brandTitle}>ObentōPet</h1>
                  <p style={styles.brandSub}>Controle de Entregas</p>
                </div>
              </div>
              <div style={{ display:"flex", gap:8 }}>
                {/* Botão de atualizar para uso simultâneo */}
                <button
                  style={{ ...styles.refreshBtn, opacity: refreshing ? 0.5 : 1 }}
                  onClick={() => loadData(true)}
                  disabled={refreshing}
                  title="Atualizar dados"
                >
                  <RefreshCw size={16} strokeWidth={2.5} style={{ animation: refreshing ? "spin 1s linear infinite" : "none" }} />
                </button>
                <button style={styles.newBtn} onClick={() => { setEditingClient(null); setShowForm(true); }}>
                  <Plus size={18} strokeWidth={2.5} /><span>Novo cliente</span>
                </button>
              </div>
            </div>
            <nav style={styles.tabRow}>
              {[["hoje","Hoje"],["semana","Semana"],["clientes","Clientes"],["estoque","Estoque"]].map(([key,label]) => (
                <button key={key} onClick={() => setView(key)}
                  style={{ ...styles.tab, ...(view === key ? styles.tabActive : {}) }}>{label}</button>
              ))}
            </nav>
          </header>

          <main style={styles.main}>
            {view === "hoje"     && <TodayView items={todayDeliveries} getStatus={getStatus} setStatus={setStatus} shelfProducts={shelfProducts} />}
            {view === "semana"   && <WeekView weekDays={weekDays} weekDeliveries={weekDeliveries} weekOffset={weekOffset} setWeekOffset={setWeekOffset} getStatus={getStatus} setStatus={setStatus} shelfProducts={shelfProducts} />}
            {view === "clientes" && <ClientsView clients={filteredClients} search={search} setSearch={setSearch} onEdit={c => { setEditingClient(c); setShowForm(true); }} onDelete={deleteClient} />}
            {view === "estoque"  && (
              <StockView
                clients={clients}
                subscriberStock={subscriberStock} subscriberStockLog={subscriberStockLog}
                shelfProducts={shelfProducts}     shelfStockLog={shelfStockLog}
                petiscoProducts={petiscoProducts} petiscoStockLog={petiscoStockLog}
                onAddSubscriberProduction={addSubscriberProduction}
                onAddShelfProduct={addShelfProduct}     onAddShelfStockEntry={addShelfStockEntry}     onDeleteShelfProduct={deleteShelfProduct}
                onAddPetiscoProduct={addPetiscoProduct} onAddPetiscoStockEntry={addPetiscoStockEntry} onDeletePetiscoProduct={deletePetiscoProduct}
              />
            )}
          </main>

          {showForm && (
            <ClientFormModal
              initial={editingClient}
              onClose={() => { setShowForm(false); setEditingClient(null); }}
              onSave={saveClient}
            />
          )}

          <style>{`
            @keyframes spin { to { transform: rotate(360deg); } }
          `}</style>
        </div>
      );
    }

    // ─── TODAY VIEW ───────────────────────────────────────────────────────────────
    function TodayView({ items, getStatus, setStatus, shelfProducts }) {
      const t = todayISO();
      const d = new Date(t + "T00:00:00");
      const label = `${weekdayNames[d.getDay()]}, ${d.getDate()} de ${d.toLocaleDateString("pt-BR", { month:"long" })}`;
      return (
        <div style={styles.section}>
          <div style={styles.sectionHeadRow}>
            <h2 style={styles.sectionTitle}>{label}</h2>
            <span style={styles.countPill}>{items.length} entrega{items.length !== 1 ? "s" : ""}</span>
          </div>
          {items.length === 0 ? <EmptyState text="Nenhuma entrega marcada para hoje." /> : (
            <div style={styles.cardList}>
              {items.map(({ client, date }) => (
                <DeliveryCard key={client.id + date} client={client} status={getStatus(client.id, date)}
                  onStatusChange={(s, ded) => setStatus(client.id, date, s, ded)} shelfProducts={shelfProducts} />
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─── WEEK VIEW ────────────────────────────────────────────────────────────────
    function WeekView({ weekDays, weekDeliveries, weekOffset, setWeekOffset, getStatus, setStatus, shelfProducts }) {
      const [activeDay, setActiveDay] = useState(null);
      const t = todayISO();
      const activeDate = activeDay || (weekDays.includes(t) ? t : weekDays[0]);
      return (
        <div style={styles.section}>
          <div style={styles.weekNav}>
            <button style={styles.navArrow} onClick={() => { setWeekOffset(w => w-1); setActiveDay(null); }}><ChevronLeft size={18} /></button>
            <span style={styles.weekLabel}>{formatDateBR(weekDays[0])} – {formatDateBR(weekDays[6])}</span>
            <button style={styles.navArrow} onClick={() => { setWeekOffset(w => w+1); setActiveDay(null); }}><ChevronRight size={18} /></button>
          </div>
          <div style={styles.weekStrip}>
            {weekDays.map((d, i) => {
              const count = weekDeliveries[d]?.length || 0;
              const isToday = d === t, isActive = d === activeDate;
              return (
                <button key={d} onClick={() => setActiveDay(d)} style={{ ...styles.dayChip, ...(isActive ? styles.dayChipActive : {}), ...(isToday && !isActive ? styles.dayChipToday : {}) }}>
                  <span style={{ ...styles.dayChipDow, ...(isActive ? { color:"#C9BBA8" } : {}) }}>{weekdayShort[i]}</span>
                  <span style={{ ...styles.dayChipNum, ...(isActive ? { color:"#FBF1E8" } : {}) }}>{d.split("-")[2]}</span>
                  {count > 0 && <span style={{ ...styles.dayChipDot, ...(isActive ? { background:"#FBF1E8" } : {}) }} />}
                </button>
              );
            })}
          </div>
          <div style={{ marginTop:20 }}>
            {(weekDeliveries[activeDate] || []).length === 0
              ? <EmptyState text="Nenhuma entrega marcada para este dia." />
              : (
                <div style={styles.cardList}>
                  {weekDeliveries[activeDate].map(client => (
                    <DeliveryCard key={client.id + activeDate} client={client} status={getStatus(client.id, activeDate)}
                      onStatusChange={(s, ded) => setStatus(client.id, activeDate, s, ded)} shelfProducts={shelfProducts} />
                  ))}
                </div>
              )
            }
          </div>
        </div>
      );
    }

    // ─── DELIVERY CARD ────────────────────────────────────────────────────────────
    function DeliveryCard({ client, status, onStatusChange, shelfProducts }) {
      const [pickerOpen, setPickerOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState("");
      const [selectedAmount, setSelectedAmount] = useState(String(client.units || 1));
      const isAvulsa = client.frequency === "avulsa";

      const handleStatusClick = (key) => {
        if (key === "entregue" && isAvulsa && status !== "entregue") { setPickerOpen(true); return; }
        onStatusChange(key);
      };

      const confirmAvulsaDelivery = () => {
        const amount = parseInt(selectedAmount, 10);
        if (!selectedProduct || !amount || amount < 1) return;
        onStatusChange("entregue", { productId: selectedProduct, amount });
        setPickerOpen(false);
      };

      return (
        <div style={styles.card}>
          <div style={styles.cardTop}>
            <div style={styles.cardIdentity}>
              <div style={styles.dogBadge}><PawPrint size={14} color="#B8825A" /></div>
              <div>
                <div style={styles.cardDog}>{client.dog}</div>
                <div style={styles.cardTutor}>{client.tutor}</div>
              </div>
            </div>
            <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:5 }}>
              <span style={styles.freqTag}>{frequencyLabel[client.frequency]}</span>
              {client.units ? <span style={styles.unitsTag}>{client.units} {client.units===1?"unidade":"unidades"}</span> : null}
            </div>
          </div>
          <div style={styles.cardAddress}>
            <MapPin size={13} color="#A89A8C" style={{ flexShrink:0, marginTop:2 }} />
            <span>{client.address}</span>
          </div>
          {pickerOpen ? (
            <div style={styles.avulsaPicker}>
              <p style={styles.avulsaPickerLabel}>Qual produto sai do estoque?</p>
              {shelfProducts.length === 0 ? (
                <p style={styles.avulsaPickerEmpty}>Nenhum produto cadastrado em Estoque → Avulsos ainda.</p>
              ) : (
                <select style={styles.input} value={selectedProduct} onChange={e => setSelectedProduct(e.target.value)}>
                  <option value="">Selecione um produto…</option>
                  {shelfProducts.map(p => <option key={p.id} value={p.id}>{p.name} (saldo: {p.balance})</option>)}
                </select>
              )}
              <div style={{ display:"flex", gap:8, marginTop:8 }}>
                <input type="number" min="1" style={{ ...styles.input, flex:1 }} value={selectedAmount}
                  onChange={e => setSelectedAmount(e.target.value)} placeholder="Qtd" />
                <button style={styles.avulsaConfirmBtn} onClick={confirmAvulsaDelivery}
                  disabled={!selectedProduct}>Confirmar</button>
                <button style={styles.avulsaCancelBtn} onClick={() => setPickerOpen(false)}>Cancelar</button>
              </div>
            </div>
          ) : (
            <div style={styles.statusRow}>
              {Object.entries(statusConfig).map(([key, conf]) => {
                const Icon = conf.icon; const active = status === key;
                return (
                  <button key={key} onClick={() => handleStatusClick(key)}
                    style={{ ...styles.statusBtn, ...(active
                      ? { background:conf.color, color:"#FFF7EF", borderColor:conf.color }
                      : { background:"#FFF7EF", color:"#8A7A6C", borderColor:"#E8DDD0" }) }}>
                    <Icon size={13} strokeWidth={2.5} />{conf.label}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ─── CLIENTS VIEW ─────────────────────────────────────────────────────────────

        setDeleting(null);

        <div style={styles.section}>
          <div style={styles.searchBar}>

              value={search} onChange={e => setSearch(e.target.value)} />
            {search && <button style={styles.clearSearch} onClick={() => setSearch("")}><X size={14} color="#A89A8C" /></button>}
          </div>
          {clients.length === 0
            ? <EmptyState text={search ? "Nenhum resultado encontrado." : "Nenhum cliente cadastrado ainda."} />
            : (
              <div style={styles.cardList}>
                {clients.map(c => (
                  <div key={c.id} style={styles.clientRow}>
                    <div style={styles.dogBadge}><PawPrint size={14} color="#B8825A" /></div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={styles.cardDog}>{c.dog}</div>
                      <div style={styles.cardTutor}>{c.tutor}</div>
                      <div style={styles.clientMeta}>
                        {frequencyLabel[c.frequency]} · próxima: {c.nextDate ? formatDateBR(c.nextDate) : "—"}
                        {c.units ? ` · ${c.units} ${c.units===1?"unidade":"unidades"}` : ""}
                      </div>
                      {c.address && <div style={styles.clientAddress}><MapPin size={11} color="#C9BBA8" />{c.address}</div>}
                    </div>
                    <div style={styles.rowActions}>
                      <button style={styles.iconBtn} onClick={() => onEdit(c)}><Edit3 size={15} color="#8A7A6C" /></button>
                      {confirmDelete === c.id ? (
                        <button
                          style={{ ...styles.iconBtn, background:"#C0594B", borderColor:"#C0594B", opacity: deleting===c.id ? 0.6 : 1 }}
                          disabled={deleting===c.id}

                          <Check size={15} color="#fff" />

                      ) : (
                        <button style={styles.iconBtn} onClick={() => setConfirmDelete(c.id)}><Trash2 size={15} color="#8A7A6C" /></button>

    // ─── STOCK VIEW ───────────────────────────────────────────────────────────────

      const [productionInputs, setProductionInputs] = useState({});

      const [savingProduct, setSavingProduct] = useState(false);

        if (!newProductName.trim()) return;
        setSavingProduct(true);
        await onAddShelfProduct(newProductName.trim());
        setNewProductName(""); setShowNewProduct(false); setSavingProduct(false);
      };

      const handleSavePetisco = async () => {
        if (!newPetiscoName.trim()) return;
        setSavingPetisco(true);

      return (
        <div style={styles.section}>
          <div style={styles.sectionHeadRow}><h2 style={styles.sectionTitle}>Estoque</h2></div>

              <button key={key} style={{ ...styles.stockTabBtn, ...(tab===key ? styles.stockTabBtnActive : {}) }}
                onClick={() => setTab(key)}>{label}</button>
            ))}
          </div>

          {/* ASSINANTES */}
          {tab === "assinantes" && (
            subscribers.length === 0
              ? <EmptyState text="Nenhum cliente assinante cadastrado ainda." />

                <div style={styles.cardList}>
                  {subscribers.map(c => {

                    const expanded = expandedClient === c.id;
                    return (
                      <div key={c.id} style={styles.stockCard}>
                        <div style={styles.stockCardTop}>
                          <div style={styles.cardIdentity}>
                            <div style={styles.dogBadge}><PawPrint size={14} color="#B8825A" /></div>
                            <div><div style={styles.cardDog}>{c.dog}</div><div style={styles.cardTutor}>{c.tutor}</div></div>
                          </div>
                          <div style={{ textAlign:"right" }}>
                            <div style={{ ...styles.balanceNum, color: isLow ? "#C0594B" : "#3E332A" }}>{balance}</div>
                            <div style={styles.balanceLabel}>em estoque</div>
                          </div>
                        </div>
                        {isLow && (
                          <div style={styles.lowStockWarning}>
                            <AlertTriangle size={13} color="#C0594B" />
                            <span>Saldo baixo — próxima entrega: {c.units||0} un.</span>
                          </div>
                        )}
                        <div style={styles.stockEntryRow}>
                          <input type="number" min="1" style={{ ...styles.input, flex:1 }}
                            placeholder="Unidades produzidas"
                            value={productionInputs[c.id] || ""}
                            onChange={e => setProductionInputs(p => ({ ...p, [c.id]: e.target.value }))}
                            onKeyDown={e => { if(e.key==="Enter"){ const a=parseInt(productionInputs[c.id],10); if(a>0){onAddSubscriberProduction(c.id,a);setProductionInputs(p=>({...p,[c.id]:""}))}; }}}
                          />
                          <button style={styles.addStockBtn} onClick={() => {
                            const a = parseInt(productionInputs[c.id],10);
                            if (a>0) { onAddSubscriberProduction(c.id, a); setProductionInputs(p => ({ ...p, [c.id]:"" })); }
                          }}><Plus size={14} strokeWidth={2.5} />Adicionar</button>
                        </div>
                        <button style={styles.historyToggle} onClick={() => setExpandedClient(expanded ? null : c.id)}>
                          {expanded ? "Ocultar histórico" : `Ver histórico (${log.length})`}
                        </button>
                        {expanded && (
                          <div style={styles.historyList}>
                            {log.length === 0
                              ? <p style={styles.historyEmpty}>Sem movimentações ainda.</p>
                              : log.map((e,i) => <HistoryRow key={i} entry={e} />)
                            }
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )
          )}

          {/* AVULSOS */}
          {tab === "avulsos" && (
            <>
              <div style={{ marginBottom:14 }}>
                {showNewProduct ? (
                  <div style={styles.newProductBox}>
                    <input style={styles.input} placeholder="Nome do produto (ex: Biscoito Natural 200g)"
                      value={newProductName} onChange={e => setNewProductName(e.target.value)} autoFocus />
                    <div style={{ display:"flex", gap:8, marginTop:8 }}>
                      <button style={{ ...styles.avulsaConfirmBtn, opacity: savingProduct ? 0.6 : 1 }}
                        disabled={savingProduct} onClick={handleSaveProduct}>
                        {savingProduct ? "Salvando…" : "Salvar"}
                      </button>
                      <button style={styles.avulsaCancelBtn} onClick={() => { setShowNewProduct(false); setNewProductName(""); }}>Cancelar</button>
                    </div>
                  </div>

                  <button style={styles.newProductTrigger} onClick={() => setShowNewProduct(true)}>
                    <Plus size={16} strokeWidth={2.5} />Cadastrar produto de prateleira
                  </button>
                )}

              {shelfProducts.length === 0
                ? <EmptyState text="Nenhum produto de prateleira cadastrado ainda." />

                            <div style={styles.cardIdentity}>
                              <div style={styles.dogBadge}><Package size={14} color="#B8825A" /></div>
                              <div style={styles.cardDog}>{p.name}</div>
                            </div>
                            <div style={{ textAlign:"right" }}>
                              <div style={{ ...styles.balanceNum, color: isLow ? "#C0594B" : "#3E332A" }}>{p.balance}</div>
                              <div style={styles.balanceLabel}>em estoque</div>
                            </div>
                          </div>
                          {isLow && <div style={styles.lowStockWarning}><AlertTriangle size={13} color="#C0594B" /><span>Sem saldo disponível</span></div>}
                          <div style={styles.stockEntryRow}>
                            <input type="number" min="1" style={{ ...styles.input, flex:1 }} placeholder="Unidades a adicionar"
                              value={stockInputs[p.id] || ""}
                              onChange={e => setStockInputs(s => ({ ...s, [p.id]: e.target.value }))} />
                            <button style={styles.addStockBtn} onClick={() => {
                              const a = parseInt(stockInputs[p.id],10);
                              if (a>0) { onAddShelfStockEntry(p.id, a); setStockInputs(s => ({ ...s, [p.id]:"" })); }
                            }}><Plus size={14} strokeWidth={2.5} />Adicionar</button>
                          </div>
                          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:8 }}>
                            <button style={styles.historyToggle} onClick={() => setExpandedProduct(expanded ? null : p.id)}>
                              {expanded ? "Ocultar histórico" : `Ver histórico (${log.length})`}
                            </button>
                            <button style={styles.deleteProductBtn} onClick={() => onDeleteShelfProduct(p.id)}>
                              <Trash2 size={13} color="#A89A8C" />
                            </button>
                          </div>
                          {expanded && (
                            <div style={styles.historyList}>
                              {log.length === 0 ? <p style={styles.historyEmpty}>Sem movimentações ainda.</p> : log.map((e,i) => <HistoryRow key={i} entry={e} />)}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )
              }
            </>
          )}

          {/* PETISCOS */}
          {tab === "petiscos" && (
            <>
              <div style={{ marginBottom:14 }}>
                {showNewPetisco ? (
                  <div style={styles.newProductBox}>
                    <input style={styles.input} placeholder="Nome do petisco (ex: Palito de Frango 100g)"
                      value={newPetiscoName} onChange={e => setNewPetiscoName(e.target.value)} autoFocus />
                    <div style={{ display:"flex", gap:8, marginTop:8 }}>
                      <button style={{ ...styles.avulsaConfirmBtn, opacity: savingPetisco ? 0.6 : 1 }}
                        disabled={savingPetisco} onClick={handleSavePetisco}>
                        {savingPetisco ? "Salvando…" : "Salvar"}
                      </button>
                      <button style={styles.avulsaCancelBtn} onClick={() => { setShowNewPetisco(false); setNewPetiscoName(""); }}>Cancelar</button>
                    </div>
                  </div>
                ) : (
                  <button style={styles.newProductTrigger} onClick={() => setShowNewPetisco(true)}>
                    <Plus size={16} strokeWidth={2.5} />Cadastrar petisco
                  </button>
                )}
              </div>
              {petiscoProducts.length === 0
                ? <EmptyState text="Nenhum petisco cadastrado ainda." />
                : (
                  <div style={styles.cardList}>
                    {petiscoProducts.map(p => {
                      const log = petiscoStockLog[p.id] || [];
                      const expanded = expandedPetisco === p.id;
                      const isLow = p.balance <= 0;
                      return (
                        <div key={p.id} style={styles.stockCard}>
                          <div style={styles.stockCardTop}>
                            <div style={styles.cardIdentity}>
                              <div style={styles.dogBadge}><Cookie size={14} color="#B8825A" /></div>
                              <div style={styles.cardDog}>{p.name}</div>
                            </div>
                            <div style={{ textAlign:"right" }}>
                              <div style={{ ...styles.balanceNum, color: isLow ? "#C0594B" : "#3E332A" }}>{p.balance}</div>
                              <div style={styles.balanceLabel}>em estoque</div>
                            </div>
                          </div>
                          {isLow && <div style={styles.lowStockWarning}><AlertTriangle size={13} color="#C0594B" /><span>Sem saldo disponível</span></div>}
                          <div style={styles.stockEntryRow}>
                            <input type="number" min="1" style={{ ...styles.input, flex:1 }} placeholder="Unidades produzidas"
                              value={petiscoInputs[p.id] || ""}
                              onChange={e => setPetiscoInputs(s => ({ ...s, [p.id]: e.target.value }))} />
                            <button style={styles.addStockBtn} onClick={() => {
                              const a = parseInt(petiscoInputs[p.id],10);
                              if (a>0) { onAddPetiscoStockEntry(p.id, a); setPetiscoInputs(s => ({ ...s, [p.id]:"" })); }
                            }}><Plus size={14} strokeWidth={2.5} />Adicionar</button>
                          </div>
                          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:8 }}>
                            <button style={styles.historyToggle} onClick={() => setExpandedPetisco(expanded ? null : p.id)}>
                              {expanded ? "Ocultar histórico" : `Ver histórico (${log.length})`}
                            </button>
                            <button style={styles.deleteProductBtn} onClick={() => onDeletePetiscoProduct(p.id)}>
                              <Trash2 size={13} color="#A89A8C" />
                            </button>
                          </div>
                          {expanded && (
                            <div style={styles.historyList}>
                              {log.length === 0 ? <p style={styles.historyEmpty}>Sem movimentações ainda.</p> : log.map((e,i) => <HistoryRow key={i} entry={e} />)}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )
              }
            </>
          )}
        </div>
      );
    }

    function HistoryRow({ entry }) {
      const positive = entry.amount > 0;
      const Icon = positive ? ArrowUpCircle : ArrowDownCircle;
      return (
        <div style={styles.historyRow}>
          <Icon size={15} color={positive ? "#5C8A5C" : "#C0594B"} style={{ flexShrink:0 }} />
          <div style={{ flex:1 }}>
            <div style={styles.historyReason}>{entry.reason}</div>
            <div style={styles.historyDate}>{entry.date ? formatDateBR(entry.date) : "—"}</div>
          </div>
          <div style={{ ...styles.historyAmount, color: positive ? "#5C8A5C" : "#C0594B" }}>
            {positive ? "+" : ""}{entry.amount}
          </div>
        </div>
      );
    }

    // ─── CLIENT FORM MODAL ────────────────────────────────────────────────────────
    function ClientFormModal({ initial, onClose, onSave }) {
      const [tutor,     setTutor]     = useState(initial?.tutor     || "");
      const [dog,       setDog]       = useState(initial?.dog       || "");
      const [address,   setAddress]   = useState(initial?.address   || "");
      const [frequency, setFrequency] = useState(initial?.frequency || "semanal");
      const [nextDate,  setNextDate]  = useState(initial?.nextDate  || todayISO());
      const [units,     setUnits]     = useState(initial?.units ? String(initial.units) : "1");
      const [notes,     setNotes]     = useState(initial?.notes     || "");
      const [error,     setError]     = useState("");
      const [saving,    setSaving]    = useState(false);

      // FIX: try/catch/finally para garantir que saving volta a false em caso de erro
      const handleSubmit = async () => {
        if (!tutor.trim() || !dog.trim() || !address.trim()) {
          setError("Preencha tutor, cão e endereço."); return;
        }
        const unitsNum = parseInt(units, 10);
        if (!unitsNum || unitsNum < 1) {
          setError("Informe uma quantidade de unidades válida."); return;
        }
        setError("");
        setSaving(true);
        try {
          await onSave({ tutor:tutor.trim(), dog:dog.trim(), address:address.trim(), frequency, nextDate, units:unitsNum, notes });
        } catch (e) {
          setError("Erro ao salvar. Verifique a conexão e tente novamente.");
          setSaving(false);
        }
        // Não chama setSaving(false) no sucesso porque o modal fecha (componente desmonta)
      };

      return (
        <div style={styles.modalOverlay} onClick={onClose}>
          <div style={styles.modal} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHead}>
              <h3 style={styles.modalTitle}>{initial ? "Editar cliente" : "Novo cliente"}</h3>
              <button style={styles.modalClose} onClick={onClose} disabled={saving}><X size={18} color="#8A7A6C" /></button>
            </div>
            <div style={styles.formBody}>
              <Field label="Nome do tutor">
                <input style={styles.input} value={tutor} onChange={e => setTutor(e.target.value)} placeholder="Ex: Marina Costa" />
              </Field>
              <Field label="Nome do cão">
                <input style={styles.input} value={dog} onChange={e => setDog(e.target.value)} placeholder="Ex: Mia" />
              </Field>
              <Field label="Endereço de entrega">
                <input style={styles.input} value={address} onChange={e => setAddress(e.target.value)} placeholder="Rua, número, bairro" />
              </Field>
              <Field label="Frequência">
                <div style={styles.freqGrid}>
                  {Object.entries(frequencyLabel).map(([key, label]) => (
                    <button key={key} type="button" onClick={() => setFrequency(key)}
                      style={{ ...styles.freqOption, ...(frequency===key ? styles.freqOptionActive : {}) }}>{label}</button>
                  ))}
                </div>
              </Field>
              <Field label={frequency === "avulsa" ? "Data da entrega" : "Próxima entrega (data âncora)"}>
                <input type="date" style={styles.input} value={nextDate} onChange={e => setNextDate(e.target.value)} />
              </Field>
              <Field label="Quantidade de unidades por entrega">
                <input type="number" min="1" style={styles.input} value={units} onChange={e => setUnits(e.target.value)} placeholder="Ex: 4" />
              </Field>
              <Field label="Observações (opcional)">
                <textarea style={{ ...styles.input, minHeight:60, resize:"vertical", fontFamily:"inherit" }}
                  value={notes} onChange={e => setNotes(e.target.value)} placeholder="Ex: portaria pede documento" />
              </Field>
              {error && <p style={styles.errorText}>{error}</p>}
              <button style={{ ...styles.saveBtn, opacity: saving ? 0.7 : 1 }} onClick={handleSubmit} disabled={saving}>
                {saving ? "Salvando…" : initial ? "Salvar alterações" : "Adicionar cliente"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function Field({ label, children }) {
      return <div style={styles.field}><label style={styles.fieldLabel}>{label}</label>{children}</div>;
    }

    function EmptyState({ text }) {
      return (
        <div style={styles.empty}>
          <PawPrint size={26} color="#D9CBBC" />
          <p style={styles.emptyText}>{text}</p>
        </div>
      );

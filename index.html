    function getOccurrencesInRange(client, startISO, endISO, clientReschedules = []) {
      if (client.frequency === "avulsa") return [];
      const rescheduledOriginals = new Set(clientReschedules.map(r => r.original_date));
      const rawOut = [];
      if (client.nextDate) {
        if (client.frequency === "mensal") {
          let cur = new Date(client.nextDate+"T00:00:00");
          const start = new Date(startISO+"T00:00:00");
          const end   = new Date(endISO+"T00:00:00");
          while (cur > start) { const p = new Date(cur); p.setMonth(p.getMonth()-1); cur = p; }
          while (cur <= end) {
            if (cur >= start) { const d = dateToISO(cur); if (!rescheduledOriginals.has(d)) rawOut.push(d); }
            const n = new Date(cur); n.setMonth(n.getMonth()+1); cur = n;
          }
        } else {
          const step = client.frequency === "semanal" ? 7 : 14;
          let cur = client.nextDate;
          while (cur > startISO) cur = addDays(cur, -step);
          while (cur <= endISO) {
            if (cur >= startISO && !rescheduledOriginals.has(cur)) rawOut.push(cur);
            cur = addDays(cur, step);
          }
        }
      }
      const result = new Set(rawOut);
      clientReschedules.forEach(r => { if (r.new_date >= startISO && r.new_date <= endISO) result.add(r.new_date); });
      return Array.from(result).sort();
    }

    const escHtml = (s) => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const LABEL_DEFAULTS = { w:65, h:30, showLogo:true, tutorFirstName:false, showObs:true, showCep:false, showPhone:false, showDate:false, copiesByVolumes:false, gap:0, offsetY:0 };
    const LABEL_STORE_KEY = "obentopet_label_settings_v2";
    function loadLabelSettings() {
      try { const raw = localStorage.getItem(LABEL_STORE_KEY); if (raw) return {...LABEL_DEFAULTS, ...JSON.parse(raw)}; } catch(e) {}
      return {...LABEL_DEFAULTS};
    }
    function saveLabelSettings(st) { try { localStorage.setItem(LABEL_STORE_KEY, JSON.stringify(st)); } catch(e) {} }
    const maskCep = (v) => { const d = String(v||"").replace(/\D/g,"").slice(0,8); return d.length>5 ? d.slice(0,5)+"-"+d.slice(5) : d; };

    function labelCopies(c, o) { return o.copiesByVolumes && c.volumes>1 ? c.volumes : 1; }

    // Geometria comum (mm) usada pelo CSS e pelo cálculo de fontes
    function labelGeom(o) {
      const sc = Math.min(o.w/65, o.h/30);
      const pad = 1.8*sc;
      const innerW = o.w-2*pad, innerH = o.h-2*pad;
      const logoH = o.showLogo ? innerH*0.74 : 0;
      const logoW = logoH*LABEL_LOGO_RATIO;
      const gap = o.showLogo ? 2.5*sc : 0;
      const txtW = innerW - logoW - gap;
      return { sc, pad, innerW, innerH, logoH, logoW, gap, txtW };
    }

    function buildLabelHTML(c, date, o, idx=1, total=1) {
      const g = labelGeom(o);
      const sc = g.sc;
      const pet = (c.dog||"").toUpperCase().trim();
      const tutorRaw = (c.tutor||"").trim();
      const tutor = (o.tutorFirstName ? tutorRaw.split(/\s+/)[0] : tutorRaw).toUpperCase();
      const a1 = c.address || "";
      const a2 = [c.complemento, c.bairro].filter(Boolean).join(" - ");
      const a3 = o.showCep ? [c.cidade, c.cep].filter(Boolean).join(" · ") : "";
      const obsParts = o.showObs ? [c.janelaEntrega?("Horário: "+c.janelaEntrega):"", c.referencia?("Ref.: "+c.referencia):"", (c.notes||"").trim()].filter(Boolean) : [];
      const obs = obsParts.join(" | ");
      const bottomLeft = [o.showPhone && c.phone ? c.phone : "", o.showDate && date ? formatDateBR(date) : ""].filter(Boolean).join("  ·  ");
      const bottomRight = total>1 ? ("Vol. "+idx+"/"+total) : "";
      const hasBottom = !!(bottomLeft||bottomRight);

      // fontes (mm) ajustadas ao comprimento do texto e à largura útil
      const nPet = Math.max(pet.length,1);
      const petLs = nPet<=8 ? 0.30 : nPet<=12 ? 0.16 : 0.06;
      const petFs = Math.min(5.0*sc, (g.txtW-2.4*sc)/(nPet*(0.70+petLs)));
      const tutFs = Math.min(5.0*sc, g.txtW/(Math.max(tutor.length,1)*0.76));
      const obsFs = 2.3*sc;
      const obsCpl = g.txtW/(obsFs*0.64);
      const obsWanted = obs ? Math.min(2, Math.ceil(obs.length/obsCpl)) : 0;
      const botFs = 2.2*sc, botH = hasBottom ? botFs*1.25 : 0;
      const petH = petFs*1.0 + 1.0*sc, tutH = tutFs*1.15;
      const parts = [a1,a2,a3].filter(Boolean);
      const fitAddr = (obsLines) => {
        const oh = obs ? obsLines*obsFs*1.2 + 1.2*sc : 0;
        const addrMax = g.innerH - petH - tutH - oh - botH - 1.6*sc;
        // 1) preferir cada linha do endereço inteira, sem quebrar
        for (let fs=3.0*sc; fs>=2.4*sc-0.001; fs-=0.1*sc) {
          const cpl = g.txtW/(fs*0.56);
          if (parts.every(x=>x.length<=cpl) && parts.length*fs*1.16<=addrMax) return {fs, ok:true};
        }
        // 2) permitir quebra de linha
        for (let fs=3.0*sc; fs>=2.0*sc-0.001; fs-=0.1*sc) {
          const cpl = g.txtW/(fs*0.60);
          const lines = parts.reduce((s,x)=>s+Math.max(1,Math.ceil(x.length/cpl)),0);
          if (lines*fs*1.16<=addrMax) return {fs, ok:true};
        }
        return {fs:2.0*sc, ok:false};
      };
      let obsLines = obsWanted;
      let fit = fitAddr(obsLines);
      if (!fit.ok && obsLines>1) { obsLines = 1; fit = fitAddr(1); }
      const addrFs = fit.fs;
      const f = (n) => n.toFixed(2)+"mm";
      return `<div class="label">`
        + (o.showLogo ? `<div class="logo"></div>` : ``)
        + `<div class="txt">`
        +   `<div class="pet" style="font-size:${f(petFs)};letter-spacing:${petLs}em">${escHtml(pet)}</div>`
        +   `<div class="tutor" style="font-size:${f(tutFs)}">${escHtml(tutor)}</div>`
        +   `<div class="addr" style="font-size:${f(addrFs)}"><div>${escHtml(a1)}</div>${a2?`<div>${escHtml(a2)}</div>`:""}${a3?`<div>${escHtml(a3)}</div>`:""}</div>`
        +   (obs ? `<div class="obs" style="font-size:${f(obsFs)}"><div class="obs-in" style="-webkit-line-clamp:${obsLines}"><b>OBS:</b> ${escHtml(obs)}</div></div>` : ``)
        +   (hasBottom ? `<div class="bot" style="font-size:${f(botFs)}"><span>${escHtml(bottomLeft)}</span><span>${escHtml(bottomRight)}</span></div>` : ``)
        + `</div></div>`;
    }

    function labelsCss(o, preview) {
      const g = labelGeom(o);
      const gap = Math.max(0, Number(o.gap)||0), offY = Math.max(-3, Math.min(3, Number(o.offsetY)||0));
      const pageH = (Number(o.h)+gap).toFixed(2);
      const padTop = Math.max(0, g.pad+offY).toFixed(2), padBot = Math.max(0, g.pad+gap-offY).toFixed(2), padX = g.pad.toFixed(2);
      return `@page{size:${o.w}mm ${pageH}mm;margin:0}
        *{box-sizing:border-box}
        html,body{margin:0;padding:0;background:#fff}
        body{font-family:"Poppins","Montserrat","Segoe UI",Arial,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
        .label{width:${o.w}mm;height:${pageH}mm;padding:${padTop}mm ${padX}mm ${padBot}mm ${padX}mm;display:flex;flex-direction:row;align-items:center;gap:${g.gap.toFixed(2)}mm;overflow:hidden;page-break-after:always;break-after:page}
        .label:last-child{page-break-after:auto;break-after:auto}
        .logo{flex:0 0 auto;width:${g.logoW.toFixed(2)}mm;height:${g.logoH.toFixed(2)}mm;background:url(${LABEL_LOGO}) center/contain no-repeat}
        .txt{flex:1 1 auto;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:${(0.5*g.sc).toFixed(2)}mm;overflow:hidden}
        .pet{display:inline-block;align-self:flex-start;max-width:100%;background:#000;color:#fff;font-weight:500;line-height:1.1;padding:0.25mm 1.2mm 0.25mm 1.2mm;white-space:nowrap;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
        .tutor{font-weight:800;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .addr{font-weight:400;line-height:1.16}
        .addr div{overflow-wrap:anywhere}
        .obs{border:0.25mm solid #000;border-radius:0.8mm;padding:0.2mm 0.8mm;overflow:hidden}
        .obs-in{line-height:1.16;font-weight:600;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
        .bot{display:flex;justify-content:space-between;gap:2mm;font-weight:600;white-space:nowrap}`;
    }

    function labelDoc(bodyHtml, o, preview) {
      return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Etiquetas ObentōPet</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="${LABEL_FONTS}" rel="stylesheet"><style>${labelsCss(o,preview)}</style></head><body>${bodyHtml}</body></html>`;
    }

    function printHtmlDoc(html) {
      const iframe = document.createElement("iframe");
      iframe.style.cssText = "position:fixed;left:-10000px;top:0;width:210mm;height:297mm;border:0;";
      document.body.appendChild(iframe);
      const w = iframe.contentWindow;
      w.document.open(); w.document.write(html); w.document.close();
      setTimeout(()=>{
        const fontsReady = (w.document.fonts && w.document.fonts.ready) ? Promise.race([w.document.fonts.ready, new Promise(r=>setTimeout(r,2500))]) : Promise.resolve();
        fontsReady.then(()=>setTimeout(()=>{
          try { w.focus(); w.print(); } catch(e) { console.error("Erro ao imprimir:", e); }
          setTimeout(()=>{ try { iframe.remove(); } catch(e) {} }, 60000);
        }, 150));
      }, 200);
    }

    function printLabelsNow(items, settings) {
      const o = {...LABEL_DEFAULTS, ...settings};
      const pages = [];
      items.forEach(({client, date})=>{
        const n = labelCopies(client, o);
        for (let i=1;i<=n;i++) pages.push(buildLabelHTML(client, date, o, i, n));
      });
      printHtmlDoc(labelDoc(pages.join(""), o, false));
      return pages.length;
    }


    function normLabel(s) {
      return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s-]/g,"").trim();
    }
    function suggestLabelFile(dog, tutor, allClients=[], editingId=null) {
      const base = normLabel(dog);
      if (!base) return "";
      const hasDup = allClients.some(c => c.id !== editingId && normLabel(c.dog) === base);
      if (hasDup) {
        const initials = (tutor||"").trim().split(/\s+/).map(w=>normLabel(w)[0]).filter(Boolean).join("");
        return initials ? `${base} - ${initials}` : base;
      }
      return base;
    }

    const frequencyLabel = { semanal:"Semanal", quinzenal:"Quinzenal", mensal:"Mensal", avulsa:"Avulsa" };
    const statusConfig = {
      preparando: { label:"Preparando", color:"#B8825A", icon:Clock },
      a_caminho:  { label:"A caminho",  color:"#3E7CB1", icon:Truck },
      entregue:   { label:"Entregue",   color:"#5C8A5C", icon:Check },

    // ─── Toast ────────────────────────────────────────────────────────────────
    function Toast({ message, type="success", onDismiss }) {
      useEffect(() => { const t = setTimeout(onDismiss, type==="error"?5000:3500); return ()=>clearTimeout(t); }, [onDismiss]);
      const bg = type==="error" ? "#C0594B" : type==="info" ? "#3E7CB1" : "#5C8A5C";
      const Icon = type==="error" ? AlertTriangle : CheckCircle;
      return (
        <div style={{...styles.toast, background:bg}} onClick={onDismiss}>
          <Icon size={16} color="#fff" strokeWidth={2.5} />
          <span>{message}</span>
        </div>
      );
    }

      { key:"roteiro",   title:"Roteiro",   sub:"para o entregador",     icon:Route,         desc:"Lista do dia em PDF ou WhatsApp" },

    ];

    function HomeView({ onOpen, todayItems, getStatus, clientsCount }) {

      const isFriday = new Date().getDay()===5;

        if (key==="hoje" && pend>0) return { text:`${pend} pendente${pend!==1?"s":""}`, warn:true };
        if (key==="clientes" && clientsCount>0) return { text:`${clientsCount}`, warn:false };

      return (
        <div style={styles.section}>

            <div style={{fontSize:13,color:"#8A7A6C",fontWeight:600}}>{formatDateFull(todayISO())}</div>
            <div style={{fontSize:20,fontWeight:800,color:"#3E332A",marginTop:2}}>
              {todayItems.length} entrega{todayItems.length!==1?"s":""} hoje
              {todayItems.length>0&&<span style={{fontSize:13,fontWeight:600,color:pend>0?"#A8412F":"#5C8A5C",marginLeft:8}}>{pend>0?`${pend} pendente${pend!==1?"s":""}`:"tudo entregue"}</span>}
            </div>

          <div style={styles.moduleGrid}>

              return (

                  <div style={styles.moduleTitle}>{m.title}</div>
                  <div style={styles.moduleDesc}>{m.desc}</div>
                  {b&&<span style={{...styles.moduleBadge,...(b.warn?{background:"#FBEAE6",color:"#A8412F"}:{})}}>{b.text}</span>}
                </button>

    // ─── App ──────────────────────────────────────────────────────────────────
    function App() {
      const [clients,            setClients]            = useState([]);
      const [loaded,             setLoaded]             = useState(false);
      const [statusLog,          setStatusLog]          = useState({});
      const [view,               setView]               = useState("home");
      const [labelSettings,      setLabelSettings]      = useState(loadLabelSettings);
      const [weekOffset,         setWeekOffset]         = useState(0);
      const [entregasFilter,     setEntregasFilter]     = useState("hoje");
      const [search,             setSearch]             = useState("");
      const [showForm,           setShowForm]           = useState(false);
      const [editingClient,      setEditingClient]      = useState(null);
      const [toastQueue,         setToastQueue]         = useState([]);
      const [reschedules,        setReschedules]        = useState({});
      const [rescheduleModal,    setRescheduleModal]    = useState(null);
      const [avulsaOrders,       setAvulsaOrders]       = useState({});
      const [subscriberStock,    setSubscriberStock]    = useState({});
      const [subscriberStockLog, setSubscriberStockLog] = useState({});
      const [shelfProducts,      setShelfProducts]      = useState([]);
      const [shelfStockLog,      setShelfStockLog]      = useState({});
      const [deliveryDeduction,  setDeliveryDeduction]  = useState({});
      const [petiscoProducts,    setPetiscoProducts]    = useState([]);
      const [petiscoStockLog,    setPetiscoStockLog]    = useState({});
      const [realtimeOnline,     setRealtimeOnline]     = useState(null);

      const showToast = useCallback((msg, type="success") => {
        const id = genId();
        setToastQueue(q => [...q, { id, msg, type }]);
      }, []);
      const dismissToast = useCallback((id) => setToastQueue(q => q.filter(t => t.id !== id)), []);

      // ── Initial data load ─────────────────────────────────────────────────
      useEffect(() => {
        (async () => {
          try {
            const [
              { data:cData,   error:e1  },
              { data:sData,   error:e2  },
              { data:ssData,  error:e3  },
              { data:sslData, error:e4  },
              { data:spData,  error:e5  },
              { data:splData, error:e6  },
              { data:ddData,  error:e7  },
              { data:ppData,  error:e8  },
              { data:pplData, error:e9  },
              { data:rsData,  error:e10 },
              { data:aoData,  error:e11 },
            ] = await Promise.all([
              db.from("clients").select("*"),
              db.from("status_log").select("*"),
              db.from("subscriber_stock").select("*"),
              db.from("subscriber_stock_log").select("*").order("ts",{ascending:false}),
              db.from("shelf_products").select("*"),
              db.from("shelf_stock_log").select("*").order("ts",{ascending:false}),
              db.from("delivery_deduction").select("*"),
              db.from("snack_products").select("*"),
              db.from("snack_stock_log").select("*").order("ts",{ascending:false}),
              db.from("delivery_reschedules").select("*"),
              db.from("avulsa_orders").select("*").order("date",{ascending:true}),
            ]);
            const errs = [e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11].filter(Boolean);
            if (errs.length) console.warn("Erros ao carregar:", errs.map(e=>e.message));
            if (cData?.length) setClients(cData.map(dbToClient));
            const sl = {};
            (sData||[]).forEach(r => { sl[r.key] = r.status; });
            setStatusLog(sl);
            const ss = {};
            (ssData||[]).forEach(r => { ss[r.client_id] = r.balance; });
            setSubscriberStock(ss);
            const ssl = {};
            (sslData||[]).forEach(r => {
              if (!ssl[r.client_id]) ssl[r.client_id] = [];
              if (ssl[r.client_id].length < 100)
                ssl[r.client_id].push({date:r.date,amount:r.amount,reason:r.reason,ts:r.ts});
            });
            setSubscriberStockLog(ssl);
            setShelfProducts((spData||[]).map(p=>({id:p.id,name:p.name,balance:p.balance,min_stock:p.min_stock??0})));
            const spl = {};
            (splData||[]).forEach(r => {
              if (!spl[r.product_id]) spl[r.product_id] = [];
              if (spl[r.product_id].length < 100)
                spl[r.product_id].push({date:r.date,amount:r.amount,reason:r.reason,ts:r.ts});
            });
            setShelfStockLog(spl);
            const dd = {};
            (ddData||[]).forEach(r => { dd[r.key] = {productId:r.product_id,amount:r.amount}; });
            setDeliveryDeduction(dd);
            setPetiscoProducts((ppData||[]).map(p=>({id:p.id,name:p.name,balance:p.balance,min_stock:p.min_stock??0})));
            const ppl = {};
            (pplData||[]).forEach(r => {
              if (!ppl[r.product_id]) ppl[r.product_id] = [];
              if (ppl[r.product_id].length < 100)
                ppl[r.product_id].push({date:r.date,amount:r.amount,reason:r.reason,ts:r.ts});
            });
            setPetiscoStockLog(ppl);
            const rs = {};
            (rsData||[]).forEach(r => {
              if (!rs[r.client_id]) rs[r.client_id] = [];
              if (!rs[r.client_id].find(e=>e.original_date===r.original_date))
                rs[r.client_id].push({original_date:r.original_date,new_date:r.new_date});
            });
            setReschedules(rs);
            const ao = {};
            (aoData||[]).forEach(r => {
              if (!ao[r.client_id]) ao[r.client_id] = [];
              ao[r.client_id].push({id:r.id,date:r.date});
            });
            setAvulsaOrders(ao);
          } catch(e) {
            console.error("Erro ao carregar dados:", e);
            showToast("Erro ao carregar dados. Verifique a conexão.", "error");
          } finally {
            setLoaded(true);
          }
        })();
      }, []);

      // ── Realtime sync ─────────────────────────────────────────────────────
      useEffect(() => {
        const channel = db.channel("obentopet-realtime")
          .on("postgres_changes",{event:"*",schema:"public",table:"status_log"},({eventType,new:n,old:o})=>{
            if (eventType==="INSERT"||eventType==="UPDATE") setStatusLog(prev=>({...prev,[n.key]:n.status}));
            else if (eventType==="DELETE") setStatusLog(prev=>{const c={...prev};delete c[o.key];return c;});
          })
          .on("postgres_changes",{event:"UPDATE",schema:"public",table:"subscriber_stock"},({new:n})=>{
            setSubscriberStock(prev=>({...prev,[n.client_id]:n.balance}));
          })
          .on("postgres_changes",{event:"UPDATE",schema:"public",table:"shelf_products"},({new:n})=>{
            setShelfProducts(prev=>prev.map(p=>p.id===n.id?{...p,balance:n.balance,min_stock:n.min_stock??p.min_stock,barcode:("barcode" in n)?n.barcode:p.barcode}:p));
          })
          .on("postgres_changes",{event:"UPDATE",schema:"public",table:"snack_products"},({new:n})=>{
            setPetiscoProducts(prev=>prev.map(p=>p.id===n.id?{...p,balance:n.balance,min_stock:n.min_stock??p.min_stock,barcode:("barcode" in n)?n.barcode:p.barcode}:p));
          })
          .on("postgres_changes",{event:"*",schema:"public",table:"avulsa_orders"},({eventType,new:n,old:o})=>{
            if (eventType==="INSERT") {
              setAvulsaOrders(prev=>{
                const existing=prev[n.client_id]||[];
                if(existing.some(o=>o.id===n.id))return prev;
                const list=[...existing,{id:n.id,date:n.date}];
                list.sort((a,b)=>a.date.localeCompare(b.date));
                return {...prev,[n.client_id]:list};
              });
            } else if (eventType==="DELETE") {
              setAvulsaOrders(prev=>({...prev,[o.client_id]:(prev[o.client_id]||[]).filter(x=>x.id!==o.id)}));
            } else if (eventType==="UPDATE") {
              setAvulsaOrders(prev=>{
                const list=(prev[n.client_id]||[]).map(x=>x.id===n.id?{...x,date:n.date}:x);
                list.sort((a,b)=>a.date.localeCompare(b.date));
                return {...prev,[n.client_id]:list};
              });
            }
          })
          .on("postgres_changes",{event:"*",schema:"public",table:"clients"},({eventType,new:n,old:o})=>{
            if (eventType==="INSERT") setClients(prev=>{if(prev.some(c=>c.id===n.id))return prev;return [...prev,dbToClient(n)];});
            else if (eventType==="UPDATE") setClients(prev=>prev.map(c=>c.id===n.id?dbToClient(n):c));
            else if (eventType==="DELETE") setClients(prev=>prev.filter(c=>c.id!==o.id));
          })
          .on("postgres_changes",{event:"*",schema:"public",table:"delivery_reschedules"},({eventType,new:n,old:o})=>{
            if (eventType==="INSERT"||eventType==="UPDATE") {
              setReschedules(prev=>{
                const cid=n.client_id;
                const existing=(prev[cid]||[]).filter(r=>r.original_date!==n.original_date);
                return {...prev,[cid]:[...existing,{original_date:n.original_date,new_date:n.new_date}]};
              });
            } else if (eventType==="DELETE"&&o?.client_id) {
              setReschedules(prev=>({
                ...prev,[o.client_id]:(prev[o.client_id]||[]).filter(r=>r.original_date!==o.original_date)
              }));
            }
          })
          .subscribe((status)=>{
            setRealtimeOnline(status==="SUBSCRIBED");
          });
        return ()=>{ db.removeChannel(channel); };
      }, []);

      const rescheduleDelivery = async (clientId, originalDate, newDate, scope, orderId) => {
        const client = clients.find(c=>c.id===clientId);
        if (!client||!newDate||newDate===originalDate) return;
        try {
          if (client.frequency==="avulsa") {
            if (orderId) {
              const {error} = await db.from("avulsa_orders").update({date:newDate}).eq("id",orderId);
              if (error) throw error;
              setAvulsaOrders(prev=>{
                const list=(prev[clientId]||[]).map(o=>o.id===orderId?{...o,date:newDate}:o);
                list.sort((a,b)=>a.date.localeCompare(b.date));
                return {...prev,[clientId]:list};
              });
            }
          } else if (scope==="only") {
            await db.from("delivery_reschedules")
              .delete().eq("client_id",clientId).eq("original_date",originalDate);
            const {error} = await db.from("delivery_reschedules")
              .insert({client_id:clientId,original_date:originalDate,new_date:newDate});
            if (error) throw error;
            setReschedules(prev=>{
              const existing=(prev[clientId]||[]).filter(r=>r.original_date!==originalDate);
              return {...prev,[clientId]:[...existing,{original_date:originalDate,new_date:newDate}]};
            });
          } else {
            const {error} = await db.from("clients").update({next_date:newDate}).eq("id",clientId);
            if (error) throw error;
            setClients(prev=>prev.map(c=>c.id===clientId?{...c,nextDate:newDate}:c));
            await db.from("delivery_reschedules")
              .delete().eq("client_id",clientId).eq("original_date",originalDate);
            await db.from("delivery_reschedules")
              .insert({client_id:clientId,original_date:originalDate,new_date:"1900-01-01"});
            setReschedules(prev=>{
              const existing=(prev[clientId]||[]).filter(r=>r.original_date!==originalDate);
              return {...prev,[clientId]:[...existing,{original_date:originalDate,new_date:"1900-01-01"}]};
            });
          }
          setRescheduleModal(null);
          showToast(`Entrega de ${client.dog} reagendada!`);
        } catch(err) {
          showToast(`Erro ao reagendar: ${err.message}`,"error");
        }
      };

      const openReschedule = (client, date, orderId) =>
        setRescheduleModal({clientId:client.id,date,dog:client.dog,frequency:client.frequency,orderId});

      const cancelDelivery = async (client, date, orderId) => {
        try {
          if (client.frequency==="avulsa") {
            if (orderId) {
              const {error} = await db.from("avulsa_orders").delete().eq("id",orderId);
              if (error) throw error;
              setAvulsaOrders(prev=>({...prev,[client.id]:(prev[client.id]||[]).filter(o=>o.id!==orderId)}));
            }
          } else {
            await db.from("delivery_reschedules")
              .delete().eq("client_id",client.id).eq("original_date",date);
            const {error} = await db.from("delivery_reschedules")
              .insert({client_id:client.id,original_date:date,new_date:"1900-01-01"});
            if (error) throw error;
            setReschedules(prev=>{
              const existing=(prev[client.id]||[]).filter(r=>r.original_date!==date);
              return {...prev,[client.id]:[...existing,{original_date:date,new_date:"1900-01-01"}]};
            });
          }
          showToast(`Entrega de ${client.dog} cancelada.`,"info");
        } catch(err) {
          showToast(`Erro ao cancelar: ${err.message}`,"error");
        }
      };

      // ── Backup export ─────────────────────────────────────────────────────
      const exportBackup = async () => {
        showToast("Gerando backup…", "info");
        try {
          const [c,sl,ss,ssl,sp,spl,dd,pp,ppl,rs,ao] = await Promise.all([
            db.from("clients").select("*"),
            db.from("status_log").select("*"),
            db.from("subscriber_stock").select("*"),
            db.from("subscriber_stock_log").select("*"),
            db.from("shelf_products").select("*"),
            db.from("shelf_stock_log").select("*"),
            db.from("delivery_deduction").select("*"),
            db.from("snack_products").select("*"),
            db.from("snack_stock_log").select("*"),
            db.from("delivery_reschedules").select("*"),
            db.from("avulsa_orders").select("*"),
          ]);
          const backup = {
            exported_at: new Date().toISOString(),
            clients: c.data, status_log: sl.data,
            subscriber_stock: ss.data, subscriber_stock_log: ssl.data,
            shelf_products: sp.data, shelf_stock_log: spl.data,
            delivery_deduction: dd.data,
            snack_products: pp.data, snack_stock_log: ppl.data,
            delivery_reschedules: rs.data, avulsa_orders: ao.data,
          };
          const blob = new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
          const url  = URL.createObjectURL(blob);
          const a    = document.createElement("a");
          const date = todayISO();
          a.href=url; a.download=`obentopet_backup_${date}.json`;
          document.body.appendChild(a); a.click();
          document.body.removeChild(a); URL.revokeObjectURL(url);
          showToast("Backup exportado com sucesso!");
        } catch(err) {
          showToast(`Erro no backup: ${err.message}`,"error");
        }
      };

      // ── BAT generation ────────────────────────────────────────────────────
      const generateBat = (date, items) => {
        const comEtiqueta = items.filter(({client})=>client.labelFile);
        const semEtiqueta = items.filter(({client})=>!client.labelFile);
        const lines = [
          "@echo off","chcp 65001 > nul",
          `SET "BARTENDER=C:\\Program Files (x86)\\Seagull\\BarTender UltraLite\\BarTend.exe"`,
          `SET "PASTA=${PASTA_ETIQUETAS}"`,
          "",`echo ============================================`,
          `echo  ObentoPet - Etiquetas ${date}`,
          `echo  Total: ${comEtiqueta.length} etiqueta(s)`,
          `echo ============================================`,"",
        ];
        if (comEtiqueta.length===0) {
          lines.push("echo Nenhuma etiqueta configurada para este dia.");
        } else {
          comEtiqueta.forEach(({client})=>{
            lines.push(`echo Imprimindo: ${client.dog} — ${client.tutor}...`);
            lines.push(`"%BARTENDER%" /f="%PASTA%\\${client.labelFile}.btw" /p /x`);
            lines.push("");
          });
          lines.push(`echo ============================================`);
          lines.push(`echo  Todas as etiquetas enviadas!`);
          if (semEtiqueta.length>0) {
            lines.push("",`echo ATENCAO: ${semEtiqueta.length} entrega(s) sem etiqueta configurada:`);
            semEtiqueta.forEach(({client})=>lines.push(`echo   - ${client.dog} (${client.tutor})`));
          }
        }
        lines.push(`echo ============================================`,"pause");
        const content = lines.join("\r\n");
        const blob = new Blob(["\uFEFF"+content],{type:"text/plain;charset=utf-8"});
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href=url; a.download=`etiquetas_${date}.bat`;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
        showToast("Arquivo .bat gerado!");
      };

      // ── Etiquetas de endereço (impressão direta) ────────────────────────────
      const updateLabelSettings = (patch) => setLabelSettings(prev=>{ const n={...prev,...patch}; saveLabelSettings(n); return n; });
      const printLabels = (items, date) => {
        const list = items.map(it=>({client:it.client, date:it.date||date}));
        if (!list.length) { showToast("Nenhuma entrega para imprimir.","info"); return; }
        const n = printLabelsNow(list, labelSettings);
        showToast(`${n} etiqueta${n!==1?"s":""} enviada${n!==1?"s":""} para impressão.`,"info");
      };

      // ── Computed deliveries ────────────────────────────────────────────────
      const weekStart = useMemo(()=>{
        const d=new Date(); d.setDate(d.getDate()+weekOffset*7-d.getDay()); return dateToISO(d);
      },[weekOffset]);
      const weekDays = useMemo(()=>Array.from({length:7},(_,i)=>addDays(weekStart,i)),[weekStart]);

      const getDeliveriesForRange = useCallback((startISO, endISO) => {
        const recurring = clients
          .filter(c=>c.frequency!=="avulsa")
          .flatMap(c=>getOccurrencesInRange(c,startISO,endISO,reschedules[c.id]||[]).map(date=>({client:c,date,orderId:null})));
        const avulsa = clients
          .filter(c=>c.frequency==="avulsa")
          .flatMap(c=>{
            const orders = avulsaOrders[c.id];
            if (orders&&orders.length>0)
              return orders.filter(o=>o.date>=startISO&&o.date<=endISO).map(o=>({client:c,date:o.date,orderId:o.id}));
            if (c.nextDate>=startISO&&c.nextDate<=endISO) return [{client:c,date:c.nextDate,orderId:null}];
            return [];
          });
        return [...recurring,...avulsa].sort((a,b)=>a.date.localeCompare(b.date)||a.client.tutor.localeCompare(b.client.tutor));
      },[clients,reschedules,avulsaOrders]);

      const todayDeliveries = useMemo(()=>{
        const t=todayISO();
        return getDeliveriesForRange(t,t);
      },[getDeliveriesForRange]);

      const weekDeliveries = useMemo(()=>{
        const map = Object.fromEntries(weekDays.map(d=>[d,[]]));
        clients.filter(c=>c.frequency!=="avulsa").forEach(c=>{
          getOccurrencesInRange(c,weekDays[0],weekDays[6],reschedules[c.id]||[]).forEach(d=>{
            if (map[d]) map[d].push({client:c,orderId:null});
          });
        });
        clients.filter(c=>c.frequency==="avulsa").forEach(c=>{
          const orders=avulsaOrders[c.id];
          if (orders&&orders.length>0) {
            orders.filter(o=>o.date>=weekDays[0]&&o.date<=weekDays[6]).forEach(o=>{if(map[o.date])map[o.date].push({client:c,orderId:o.id});});
          } else if (c.nextDate>=weekDays[0]&&c.nextDate<=weekDays[6]) {
            if(map[c.nextDate]) map[c.nextDate].push({client:c,orderId:null});
          }
        });
        Object.keys(map).forEach(d=>map[d].sort((a,b)=>a.client.tutor.localeCompare(b.client.tutor)));
        return map;
      },[clients,weekDays,reschedules,avulsaOrders]);

      const filteredClients = useMemo(()=>{
        const q=search.trim().toLowerCase();
        return q?clients.filter(c=>c.tutor.toLowerCase().includes(q)||c.dog.toLowerCase().includes(q)||c.address.toLowerCase().includes(q)||(c.bairro||"").toLowerCase().includes(q)||(c.cep||"").includes(q)||(c.email||"").toLowerCase().includes(q)):clients;
      },[clients,search]);

      if (!loaded) return <div style={styles.loadingScreen}><PawPrint size={32} color="#B8825A"/></div>;


      return (
        <div style={styles.app}>
          <style>{globalCss}</style>
          {toastQueue.map(t=>(
            <Toast key={t.id} message={t.msg} type={t.type} onDismiss={()=>dismissToast(t.id)}/>
          ))}
          <header style={styles.header}>
            <div style={styles.headerInner}>
              {view==="home"?(
                <div style={styles.brandRow}>
                  <div style={styles.brandMark}><PawPrint size={20} color="#FBF1E8" strokeWidth={2.5}/></div>
                  <div>
                    <h1 style={styles.brandTitle}>ObentōPet</h1>
                    <p style={styles.brandSub}>Gestão de entregas e produção</p>
                  </div>
                </div>
              ):(
                <div style={styles.brandRow}>
                  <button style={styles.homeBtn} onClick={()=>setView("home")} title="Voltar ao início">
                    <ChevronLeft size={20} color="#FBF1E8" strokeWidth={2.5}/>
                  </button>
                  <div>
                    <h1 style={styles.brandTitle}>{(MODULES.find(m=>m.key===view)||{}).title||"ObentōPet"}</h1>
                    <p style={styles.brandSub}>ObentōPet · {(MODULES.find(m=>m.key===view)||{}).sub||""}</p>
                  </div>
                </div>
              )}
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <ConnBadge online={realtimeOnline}/>
                <button style={styles.backupBtn} onClick={exportBackup} title="Exportar backup JSON">
                  <Download size={14} strokeWidth={2.5}/>
                </button>
                <button style={styles.newBtn} onClick={()=>{setEditingClient(null);setShowForm(true);}}>
                  <Plus size={18} strokeWidth={2.5}/><span>Novo cliente</span>
                </button>
              </div>
            </div>
          </header>
          <main style={styles.main}>
            {view==="home"&&(
              <HomeView onOpen={setView} todayItems={todayDeliveries} getStatus={getStatus} clientsCount={clients.length}/>
            )}
            {view==="etiquetas"&&(
              <LabelsView getDeliveriesForRange={getDeliveriesForRange} settings={labelSettings}
                onSettings={updateLabelSettings} onPrint={printLabels} onGenerateBat={generateBat}/>
            )}
            {view==="hoje"&&(
              <TodayView items={todayDeliveries} getStatus={getStatus} setStatus={setStatus}
                shelfProducts={shelfProducts} onReschedule={openReschedule} onCancelDelivery={cancelDelivery}/>
            )}
            {view==="entregas"&&(
              <EntregasView weekDays={weekDays} weekDeliveries={weekDeliveries} weekOffset={weekOffset}
                setWeekOffset={setWeekOffset} getStatus={getStatus} setStatus={setStatus}
                shelfProducts={shelfProducts} onReschedule={openReschedule} onCancelDelivery={cancelDelivery} onGenerateBat={generateBat} onPrintLabels={printLabels}
                filter={entregasFilter} setFilter={setEntregasFilter}
                getDeliveriesForRange={getDeliveriesForRange}/>
            )}
            {view==="clientes"&&(
              <ClientsView clients={filteredClients} search={search} setSearch={setSearch}
                onEdit={c=>{setEditingClient(c);setShowForm(true);}} onDelete={deleteClient}
                avulsaOrders={avulsaOrders} onAddAvulsaOrder={addAvulsaOrder} onDeleteAvulsaOrder={deleteAvulsaOrder}
                statusLog={statusLog}
                onImportClients={importClients} onDownloadClientsTemplate={downloadClientsTemplate}/>
            )}
            {view==="estoque"&&(
              <StockView
                clients={clients}
                subscriberStock={subscriberStock} subscriberStockLog={subscriberStockLog}
                shelfProducts={shelfProducts} shelfStockLog={shelfStockLog}
                petiscoProducts={petiscoProducts} petiscoStockLog={petiscoStockLog}
                onAddSubscriberProduction={addSubscriberProduction}
                onUpdateClientUnits={updateClientUnits}
                onSetSubscriberBalance={setSubscriberBalance}
                onAddShelfProduct={addShelfProduct} onAddShelfStockEntry={addShelfStockEntry} onDeleteShelfProduct={deleteShelfProduct} onUpdateShelfMinStock={updateShelfMinStock} onShelfMove={(id,d,r)=>applyShelfDelta(id,d,todayISO(),r)} onSetShelfBarcode={setShelfBarcode}
                onAddPetiscoProduct={addPetiscoProduct} onAddPetiscoStockEntry={addPetiscoStockEntry} onDeletePetiscoProduct={deletePetiscoProduct} onUpdatePetiscoMinStock={updatePetiscoMinStock} onPetiscoMove={(id,d,r)=>applyPetiscoDelta(id,d,todayISO(),r)} onSetPetiscoBarcode={setPetiscoBarcode}
                onEditClient={c=>{setEditingClient(c);setShowForm(true);}}
                onImportShelf={importShelfProducts} onDownloadShelfTemplate={downloadShelfTemplate}
                onImportPetisco={importPetiscoProducts} onDownloadPetiscoTemplate={downloadPetiscoTemplate}/>
            )}
            {view==="producao"&&(
              <ProducaoView clients={clients} subscriberStock={subscriberStock}
                shelfProducts={shelfProducts} petiscoProducts={petiscoProducts}
                getDeliveriesForRange={getDeliveriesForRange} getStatus={getStatus} showToast={showToast}/>
            )}
            {view==="roteiro"&&(
              <RoteiroView todayDeliveries={todayDeliveries} getStatus={getStatus}
                getDeliveriesForRange={getDeliveriesForRange}/>
            )}
          </main>
          {showForm&&(
            <ClientFormModal initial={editingClient} clients={clients}
              onClose={()=>{setShowForm(false);setEditingClient(null);}} onSave={saveClient}/>
          )}
          {rescheduleModal&&(
            <RescheduleModal info={rescheduleModal}
              onClose={()=>setRescheduleModal(null)} onConfirm={rescheduleDelivery}/>
          )}
        </div>
      );
    }


    // ─── TODAY VIEW ───────────────────────────────────────────────────────────
    function TodayView({ items, getStatus, setStatus, shelfProducts, onReschedule, onCancelDelivery }) {
      const t = todayISO();
      const label = formatDateFull(t);
      const pendentes = items.filter(({client,date})=>getStatus(client.id,date)!=="entregue").length;
      return (
        <div style={styles.section}>
          <div style={styles.sectionHeadRow}>
            <h2 style={styles.sectionTitle}>{label}</h2>
            <div style={{display:"flex",gap:6}}>
              {pendentes>0&&<span style={{...styles.countPill,background:"#FBEAE6",color:"#A8412F"}}>{pendentes} pendente{pendentes!==1?"s":""}</span>}
              <span style={styles.countPill}>{items.length} entrega{items.length!==1?"s":""}</span>
            </div>
          </div>
          {items.length===0?<EmptyState text="Nenhuma entrega marcada para hoje."/>:(
            <div style={styles.cardList}>
              {items.map(({client,date,orderId})=>(
                <DeliveryCard key={client.id+date+(orderId||"")} client={client} date={date} orderId={orderId}
                  status={getStatus(client.id,date)} onStatusChange={(s,ded)=>setStatus(client.id,date,s,ded)}
                  shelfProducts={shelfProducts} onReschedule={onReschedule} onCancelDelivery={onCancelDelivery}/>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─── ENTREGAS VIEW ────────────────────────────────────────────────────────
    function EntregasView({ weekDays, weekDeliveries, weekOffset, setWeekOffset, getStatus, setStatus, shelfProducts, onReschedule, onCancelDelivery, onGenerateBat, onPrintLabels, filter, setFilter, getDeliveriesForRange }) {
      const [activeDay, setActiveDay] = useState(null);
      const t = todayISO();
      const tmrw = tomorrowISO();

      const filterRanges = useMemo(()=>{
        const wStart = weekDays[0], wEnd = weekDays[6];
        const nextWStart = addDays(wEnd,1), nextWEnd = addDays(wEnd,7);
        return { hoje:[t,t], amanha:[tmrw,tmrw], semana:[wStart,wEnd], proxima:[nextWStart,nextWEnd] };
      },[weekDays,t,tmrw]);

      const filterItems = useMemo(()=>{
        if (filter==="semana"||filter==="proxima") return null;
        const [s,e] = filterRanges[filter]||[t,t];
        return getDeliveriesForRange(s,e);
      },[filter,filterRanges,getDeliveriesForRange,t]);

      const activeDate = activeDay||(weekDays.includes(t)?t:weekDays[0]);
      const activeDayItems = weekDeliveries[activeDate]||[];
      const comEtiqueta = activeDayItems.filter(({client})=>client.labelFile).length;

      const weekNum = getWeekNumber(weekDays[0]);

      if (filter!=="semana"&&filter!=="proxima") {
        const [rangeStart] = filterRanges[filter]||[t,t];
        const label = filter==="hoje"?formatDateFull(t):filter==="amanha"?formatDateFull(tmrw):"";
        return (
          <div style={styles.section}>
            <div style={styles.filterRow}>
              {[["hoje","Hoje"],["amanha","Amanhã"],["semana","Semana"],["proxima","Prox. semana"]].map(([key,lbl])=>(
                <button key={key} onClick={()=>setFilter(key)}
                  style={{...styles.filterBtn,...(filter===key?styles.filterBtnActive:{})}}>{lbl}</button>
              ))}
            </div>
            <h2 style={{...styles.sectionTitle,marginBottom:16}}>{label}</h2>
            {filterItems.length===0?<EmptyState text="Nenhuma entrega neste período."/>:(
              <div style={styles.cardList}>
                {filterItems.map(({client,date,orderId})=>(
                  <DeliveryCard key={client.id+date+(orderId||"")} client={client} date={date} orderId={orderId}
                    status={getStatus(client.id,date)} onStatusChange={(s,ded)=>setStatus(client.id,date,s,ded)}
                    shelfProducts={shelfProducts} onReschedule={onReschedule} onCancelDelivery={onCancelDelivery} showDate={filter!=="hoje"&&filter!=="amanha"}/>
                ))}
              </div>
            )}
          </div>
        );
      }

      return (
        <div style={styles.section}>
          <div style={styles.filterRow}>
            {[["hoje","Hoje"],["amanha","Amanhã"],["semana","Semana"],["proxima","Prox. semana"]].map(([key,lbl])=>(
              <button key={key} onClick={()=>setFilter(key)}
                style={{...styles.filterBtn,...(filter===key?styles.filterBtnActive:{})}}>{lbl}</button>
            ))}
          </div>
          <div style={styles.weekNav}>
            <button style={styles.navArrow} onClick={()=>setWeekOffset(w=>w-1)}><ChevronLeft size={18}/></button>
            <div style={{textAlign:"center"}}>
              <div style={styles.weekLabel}>{formatDateBR(weekDays[0])} – {formatDateBR(weekDays[6])}</div>
              <div style={{fontSize:10.5,color:"#A89A8C",fontWeight:600}}>Semana {weekNum}</div>
            </div>
            <button style={styles.navArrow} onClick={()=>setWeekOffset(w=>w+1)}><ChevronRight size={18}/></button>
          </div>
          <div style={styles.weekStrip}>
            {weekDays.map((d,i)=>{
              const count=weekDeliveries[d]?.length||0;
              const isToday=d===t, isActive=d===activeDate;
              return (
                <button key={d} onClick={()=>setActiveDay(d)}
                  style={{...styles.dayChip,...(isActive?styles.dayChipActive:{}),...(isToday&&!isActive?styles.dayChipToday:{})}}>
                  <span style={{...styles.dayChipDow,...(isActive?{color:"#C9BBA8"}:{})}}>{weekdayShort[i]}</span>
                  <span style={{...styles.dayChipNum,...(isActive?{color:"#FBF1E8"}:{})}}>{d.split("-")[2]}</span>
                  {count>0&&<span style={{...styles.dayChipDot,...(isActive?{background:"#FBF1E8"}:{})}}/>}
                </button>
              );
            })}
          </div>
          <div style={{marginTop:20}}>
            {activeDayItems.length>0&&(
              <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginBottom:12}}>
                <button style={styles.batBtn} onClick={()=>onPrintLabels(activeDayItems,activeDate)}
                  title="Imprime as etiquetas de endereço direto na impressora padrão">
                  <Printer size={13} strokeWidth={2.5}/>
                  Etiquetas ({activeDayItems.length})
                </button>
                <button style={{...styles.batBtn,background:"#9C8E7E"}} onClick={()=>onGenerateBat(activeDate,activeDayItems)}
                  title={`Método antigo: gera .bat para o BarTender (${comEtiqueta} de ${activeDayItems.length} com arquivo .btw)`}>
                  .bat
                </button>
              </div>
            )}
            {activeDayItems.length===0?<EmptyState text="Nenhuma entrega marcada para este dia."/>:(
              <div style={styles.cardList}>
                {activeDayItems.map(({client,orderId})=>(
                  <DeliveryCard key={client.id+activeDate+(orderId||"")} client={client} date={activeDate} orderId={orderId}
                    status={getStatus(client.id,activeDate)} onStatusChange={(s,ded)=>setStatus(client.id,activeDate,s,ded)}
                    shelfProducts={shelfProducts} onReschedule={onReschedule} onCancelDelivery={onCancelDelivery}/>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }


    // ─── DELIVERY CARD ────────────────────────────────────────────────────────
    function DeliveryCard({ client, date, orderId, status, onStatusChange, shelfProducts, onReschedule, onCancelDelivery, showDate=false }) {

      const [confirmCancel, setConfirmCancel] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState("");
      const [selectedAmount, setSelectedAmount] = useState(String(client.units||1));
      const isAvulsa = client.frequency==="avulsa";

      const handleStatusClick = (key) => {
        if (key==="entregue"&&isAvulsa&&status!=="entregue") { setPickerOpen(true); return; }
        onStatusChange(key);
      };
      const confirmAvulsaDelivery = () => {
        const amount = parseInt(selectedAmount,10);
        if (!selectedProduct||!amount||amount<1) return;
        onStatusChange("entregue",{productId:selectedProduct,amount});
        setPickerOpen(false);
      };

      return (
        <div style={styles.card}>
          <div style={styles.cardTop}>
            <div style={styles.cardIdentity}>
              <div style={styles.dogBadge}><PawPrint size={14} color="#B8825A"/></div>
              <div>
                <div style={styles.cardDog}>{client.dog}</div>
                <div style={styles.cardTutor}>{client.tutor}</div>
              </div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5}}>
              {showDate&&<span style={{fontSize:11.5,fontWeight:700,color:"#B8825A"}}>{formatDateBR(date)}</span>}
              <span style={styles.freqTag}>{frequencyLabel[client.frequency]}</span>
              {client.volumes?<span style={{...styles.unitsTag,background:"#F0EBE3",color:"#8A6A48"}}>{client.volumes} {client.volumes===1?"volume":"volumes"}</span>:null}
              {client.units?<span style={styles.unitsTag}>{client.units} {client.units===1?"unidade":"unidades"}</span>:null}
            </div>
          </div>
          <div style={styles.cardAddress}>
            <MapPin size={13} color="#A89A8C" style={{flexShrink:0,marginTop:2}}/>
            <span>{client.address}</span>
          </div>
          {(client.complemento||client.referencia||client.janelaEntrega)&&(
            <div style={{fontSize:11.5,color:"#7A6C5E",marginTop:4,lineHeight:1.45,paddingLeft:19}}>
              {client.complemento&&<div>Compl.: {client.complemento}</div>}
              {client.referencia&&<div>Ref.: {client.referencia}</div>}
              {client.janelaEntrega&&<div style={{color:"#A8412F",fontWeight:600}}>Horário: {client.janelaEntrega}</div>}
            </div>
          )}
          {client.phone&&(
            <div style={{display:"flex",gap:6,fontSize:12,color:"#A89A8C",marginTop:4,alignItems:"center"}}>
              <Phone size={11} color="#A89A8C" style={{flexShrink:0}}/>
              <span>{client.phone}</span>
            </div>
          )}

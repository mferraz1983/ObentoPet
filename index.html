    function getOccurrencesInRange(client, startISO, endISO, clientReschedules = []) {
      if (client.frequency === "avulsa") return [];
      const rescheduledOriginals = new Set(clientReschedules.map(r => r.original_date));
      const rawOut = [];
      if (client.nextDate) {
        if (client.frequency === "mensal") {
          let cur = new Date(client.nextDate + "T00:00:00");
          const start = new Date(startISO + "T00:00:00");
          const end   = new Date(endISO   + "T00:00:00");
          while (cur > start) { const p = new Date(cur); p.setMonth(p.getMonth()-1); cur = p; }
          while (cur <= end)  {
            if (cur >= start) { const d = dateToISO(cur); if (!rescheduledOriginals.has(d)) rawOut.push(d); }
            const n = new Date(cur); n.setMonth(n.getMonth()+1); cur = n;
          }
        } else {
          const step = client.frequency === "semanal" ? 7 : 14;
          let cur = client.nextDate;
          while (cur > startISO) cur = addDays(cur, -step);
          while (cur <= endISO)  {
            if (cur >= startISO && !rescheduledOriginals.has(cur)) rawOut.push(cur);
            cur = addDays(cur, step);
          }
        }
      }
      const result = new Set(rawOut);
      clientReschedules.forEach(r => { if (r.new_date >= startISO && r.new_date <= endISO) result.add(r.new_date); });
      return Array.from(result).sort();
    }

      const base = normLabel(dog);

      }
      return base;

        } else if (scope === "only") {
          const id = `rs_${clientId}_${originalDate}`;
          await db.from("delivery_reschedules").upsert({ id, client_id: clientId, original_date: originalDate, new_date: newDate });
          setReschedules(prev => {
            const existing = (prev[clientId] || []).filter(r => r.original_date !== originalDate);
            return { ...prev, [clientId]: [...existing, { original_date: originalDate, new_date: newDate }] };
          });
        } else {
          await db.from("clients").update({ next_date: newDate }).eq("id", clientId);
          setClients(prev => prev.map(c => c.id === clientId ? { ...c, nextDate: newDate } : c));
          const id = `rs_${clientId}_${originalDate}`;
          db.from("delivery_reschedules").delete().eq("id", id);
          setReschedules(prev => ({
            ...prev, [clientId]: (prev[clientId] || []).filter(r => r.original_date !== originalDate),
          }));
        }
        setRescheduleModal(null);
        showToast(`Entrega de ${client.dog} reagendada!`);
      };

      const openReschedule = (client, date, orderId) =>
        setRescheduleModal({ clientId: client.id, date, dog: client.dog, frequency: client.frequency, orderId });

      const generateBat = (date, items) => {
        const comEtiqueta = items.filter(({ client }) => client.labelFile);
        const semEtiqueta = items.filter(({ client }) => !client.labelFile);
        const lines = [
          "@echo off", "chcp 65001 > nul",
          `SET "BARTENDER=C:\\Program Files (x86)\\Seagull\\BarTender UltraLite\\BarTend.exe"`,
          `SET "PASTA=${PASTA_ETIQUETAS}"`,
          "", `echo ============================================`,
          `echo  ObentoPet - Etiquetas ${date}`,
          `echo  Total: ${comEtiqueta.length} etiqueta(s)`,
          `echo ============================================`, "",
        ];
        if (comEtiqueta.length === 0) {
          lines.push("echo Nenhuma etiqueta configurada para este dia.");
        } else {
          comEtiqueta.forEach(({ client }) => {
            lines.push(`echo Imprimindo: ${client.dog} — ${client.tutor}...`);
            lines.push(`"%BARTENDER%" /f="%PASTA%\\${client.labelFile}.btw" /p /x`);
            lines.push("");
          });
          lines.push(`echo ============================================`);
          lines.push(`echo  Todas as etiquetas enviadas!`);
          if (semEtiqueta.length > 0) {
            lines.push("", `echo ATENCAO: ${semEtiqueta.length} entrega(s) sem etiqueta configurada:`);
            semEtiqueta.forEach(({ client }) => lines.push(`echo   - ${client.dog} (${client.tutor})`));
          }
        }
        lines.push("echo ============================================", "pause");
        const content = lines.join("\r\n");
        const blob = new Blob(["\uFEFF" + content], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `etiquetas_${date}.bat`;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
        showToast("Arquivo .bat gerado!");
      };

      const weekStart = useMemo(() => {
        const d = new Date();
        d.setDate(d.getDate() + weekOffset * 7 - d.getDay());
        return dateToISO(d);
      }, [weekOffset]);

      const weekDays = useMemo(() => Array.from({ length: 7 }, (_, i) => addDays(weekStart, i)), [weekStart]);

      const todayDeliveries = useMemo(() => {
        const t = todayISO();
        const recurring = clients
          .filter(c => c.frequency !== "avulsa")
          .flatMap(c => getOccurrencesInRange(c, t, t, reschedules[c.id] || []).map(date => ({ client: c, date, orderId: null })));
        const avulsa = clients
          .filter(c => c.frequency === "avulsa")
          .flatMap(c => {
            const orders = avulsaOrders[c.id];
            if (orders && orders.length > 0)
              return orders.filter(o => o.date === t).map(o => ({ client: c, date: t, orderId: o.id }));
            if (c.nextDate === t) return [{ client: c, date: t, orderId: null }];
            return [];
          });
        return [...recurring, ...avulsa].sort((a, b) => a.client.tutor.localeCompare(b.client.tutor));
      }, [clients, reschedules, avulsaOrders]);

      const weekDeliveries = useMemo(() => {
        const map = Object.fromEntries(weekDays.map(d => [d, []]));
        clients.filter(c => c.frequency !== "avulsa").forEach(c => {
          getOccurrencesInRange(c, weekDays[0], weekDays[6], reschedules[c.id] || []).forEach(d => {
            if (map[d]) map[d].push({ client: c, orderId: null });
          });
        });
        clients.filter(c => c.frequency === "avulsa").forEach(c => {
          const orders = avulsaOrders[c.id];
          if (orders && orders.length > 0) {
            orders.filter(o => o.date >= weekDays[0] && o.date <= weekDays[6])
              .forEach(o => { if (map[o.date]) map[o.date].push({ client: c, orderId: o.id }); });
          } else if (c.nextDate >= weekDays[0] && c.nextDate <= weekDays[6]) {
            if (map[c.nextDate]) map[c.nextDate].push({ client: c, orderId: null });
          }
        });
        Object.keys(map).forEach(d => map[d].sort((a, b) => a.client.tutor.localeCompare(b.client.tutor)));
        return map;
      }, [clients, weekDays, reschedules, avulsaOrders]);

      const filteredClients = useMemo(() => {
        const q = search.trim().toLowerCase();
        return q ? clients.filter(c =>
          c.tutor.toLowerCase().includes(q) ||
          c.dog.toLowerCase().includes(q) ||
          c.address.toLowerCase().includes(q)
        ) : clients;
      }, [clients, search]);

      if (!loaded) return <div style={styles.loadingScreen}><PawPrint size={32} color="#B8825A" /></div>;

      return (
        <div style={styles.app}>
          <style>{globalCss}</style>
          {toast && <Toast message={toast} onDismiss={() => setToast(null)} />}
          <header style={styles.header}>
            <div style={styles.headerInner}>
              <div style={styles.brandRow}>
                <div style={styles.brandMark}><PawPrint size={20} color="#FBF1E8" strokeWidth={2.5} /></div>
                <div>
                  <h1 style={styles.brandTitle}>ObentōPet</h1>
                  <p style={styles.brandSub}>Controle de Entregas</p>
                </div>
              </div>
              <button style={styles.newBtn} onClick={() => { setEditingClient(null); setShowForm(true); }}>
                <Plus size={18} strokeWidth={2.5} /><span>Novo cliente</span>
              </button>
            </div>
            <nav style={styles.tabRow}>
              {[["hoje","Hoje"],["semana","Entregas"],["clientes","Clientes"],["estoque","Estoque"]].map(([key,label]) => (
                <button key={key} onClick={() => setView(key)}
                  style={{ ...styles.tab, ...(view === key ? styles.tabActive : {}) }}>{label}</button>
              ))}
            </nav>
          </header>
          <main style={styles.main}>
            {view === "hoje" && (
              <TodayView items={todayDeliveries} getStatus={getStatus} setStatus={setStatus}
                shelfProducts={shelfProducts} onReschedule={openReschedule} />
            )}
            {view === "semana" && (
              <WeekView weekDays={weekDays} weekDeliveries={weekDeliveries} weekOffset={weekOffset}
                setWeekOffset={setWeekOffset} getStatus={getStatus} setStatus={setStatus}
                shelfProducts={shelfProducts} onReschedule={openReschedule} onGenerateBat={generateBat} />
            )}
            {view === "clientes" && (
              <ClientsView clients={filteredClients} search={search} setSearch={setSearch}
                onEdit={c => { setEditingClient(c); setShowForm(true); }} onDelete={deleteClient}
                avulsaOrders={avulsaOrders} onAddAvulsaOrder={addAvulsaOrder} onDeleteAvulsaOrder={deleteAvulsaOrder} />
            )}
            {view === "estoque" && (
              <StockView
                clients={clients}
                subscriberStock={subscriberStock} subscriberStockLog={subscriberStockLog}
                shelfProducts={shelfProducts}     shelfStockLog={shelfStockLog}
                petiscoProducts={petiscoProducts} petiscoStockLog={petiscoStockLog}
                onAddSubscriberProduction={addSubscriberProduction}
                onAddShelfProduct={addShelfProduct}     onAddShelfStockEntry={addShelfStockEntry}     onDeleteShelfProduct={deleteShelfProduct}
                onAddPetiscoProduct={addPetiscoProduct} onAddPetiscoStockEntry={addPetiscoStockEntry} onDeletePetiscoProduct={deletePetiscoProduct}
              />
            )}
          </main>
          {showForm && (
            <ClientFormModal initial={editingClient} clients={clients}
              onClose={() => { setShowForm(false); setEditingClient(null); }} onSave={saveClient} />
          )}
          {rescheduleModal && (
            <RescheduleModal info={rescheduleModal}
              onClose={() => setRescheduleModal(null)} onConfirm={rescheduleDelivery} />
          )}
        </div>
      );
    }

    // ─── TODAY VIEW ───────────────────────────────────────────────────────────
    function TodayView({ items, getStatus, setStatus, shelfProducts, onReschedule }) {
      const t = todayISO();
      const d = new Date(t + "T00:00:00");
      const label = `${weekdayNames[d.getDay()]}, ${d.getDate()} de ${d.toLocaleDateString("pt-BR", { month:"long" })}`;
      return (
        <div style={styles.section}>
          <div style={styles.sectionHeadRow}>
            <h2 style={styles.sectionTitle}>{label}</h2>
            <span style={styles.countPill}>{items.length} entrega{items.length !== 1 ? "s" : ""}</span>
          </div>
          {items.length === 0 ? <EmptyState text="Nenhuma entrega marcada para hoje." /> : (
            <div style={styles.cardList}>
              {items.map(({ client, date, orderId }) => (
                <DeliveryCard key={client.id + date + (orderId||"")} client={client} date={date} orderId={orderId}
                  status={getStatus(client.id, date)} onStatusChange={(s, ded) => setStatus(client.id, date, s, ded)}
                  shelfProducts={shelfProducts} onReschedule={onReschedule} />
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─── WEEK VIEW ────────────────────────────────────────────────────────────
    function WeekView({ weekDays, weekDeliveries, weekOffset, setWeekOffset, getStatus, setStatus, shelfProducts, onReschedule, onGenerateBat }) {
      const [activeDay, setActiveDay] = useState(null);
      const t = todayISO();
      const activeDate = activeDay || (weekDays.includes(t) ? t : weekDays[0]);
      const activeDayItems = weekDeliveries[activeDate] || [];
      const comEtiqueta = activeDayItems.filter(({ client }) => client.labelFile).length;
      return (
        <div style={styles.section}>
          <div style={styles.weekNav}>
            <button style={styles.navArrow} onClick={() => setWeekOffset(w => w-1)}><ChevronLeft size={18} /></button>
            <span style={styles.weekLabel}>{formatDateBR(weekDays[0])} – {formatDateBR(weekDays[6])}</span>
            <button style={styles.navArrow} onClick={() => setWeekOffset(w => w+1)}><ChevronRight size={18} /></button>
          </div>
          <div style={styles.weekStrip}>
            {weekDays.map((d, i) => {
              const count = weekDeliveries[d]?.length || 0;
              const isToday = d === t, isActive = d === activeDate;
              return (
                <button key={d} onClick={() => setActiveDay(d)}
                  style={{ ...styles.dayChip, ...(isActive ? styles.dayChipActive : {}), ...(isToday && !isActive ? styles.dayChipToday : {}) }}>
                  <span style={{ ...styles.dayChipDow, ...(isActive ? { color:"#C9BBA8" } : {}) }}>{weekdayShort[i]}</span>
                  <span style={{ ...styles.dayChipNum, ...(isActive ? { color:"#FBF1E8" } : {}) }}>{d.split("-")[2]}</span>
                  {count > 0 && <span style={{ ...styles.dayChipDot, ...(isActive ? { background:"#FBF1E8" } : {}) }} />}
                </button>
              );
            })}
          </div>
          <div style={{ marginTop:20 }}>
            {activeDayItems.length > 0 && (
              <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:12 }}>
                <button style={styles.batBtn} onClick={() => onGenerateBat(activeDate, activeDayItems)}
                  title={`${comEtiqueta} de ${activeDayItems.length} com etiqueta configurada`}>
                  <Printer size={13} strokeWidth={2.5} />
                  Etiquetas{comEtiqueta < activeDayItems.length ? ` (${comEtiqueta}/${activeDayItems.length})` : ""}
                </button>
              </div>
            )}
            {activeDayItems.length === 0 ? <EmptyState text="Nenhuma entrega marcada para este dia." /> : (
              <div style={styles.cardList}>
                {activeDayItems.map(({ client, orderId }) => (
                  <DeliveryCard key={client.id + activeDate + (orderId||"")} client={client} date={activeDate} orderId={orderId}
                    status={getStatus(client.id, activeDate)} onStatusChange={(s, ded) => setStatus(client.id, activeDate, s, ded)}
                    shelfProducts={shelfProducts} onReschedule={onReschedule} />
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── DELIVERY CARD ────────────────────────────────────────────────────────
    function DeliveryCard({ client, date, orderId, status, onStatusChange, shelfProducts, onReschedule }) {
      const [pickerOpen, setPickerOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState("");
      const [selectedAmount, setSelectedAmount] = useState(String(client.units || 1));
      const isAvulsa = client.frequency === "avulsa";

      const handleStatusClick = (key) => {
        if (key === "entregue" && isAvulsa && status !== "entregue") { setPickerOpen(true); return; }
        onStatusChange(key);
      };
      const confirmAvulsaDelivery = () => {
        const amount = parseInt(selectedAmount, 10);
        if (!selectedProduct || !amount || amount < 1) return;
        onStatusChange("entregue", { productId: selectedProduct, amount });
        setPickerOpen(false);
      };

      return (
        <div style={styles.card}>
          <div style={styles.cardTop}>
            <div style={styles.cardIdentity}>
              <div style={styles.dogBadge}><PawPrint size={14} color="#B8825A" /></div>
              <div>
                <div style={styles.cardDog}>{client.dog}</div>
                <div style={styles.cardTutor}>{client.tutor}</div>
              </div>
            </div>
            <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:5 }}>
              <span style={styles.freqTag}>{frequencyLabel[client.frequency]}</span>
              {client.units ? <span style={styles.unitsTag}>{client.units} {client.units===1?"unidade":"unidades"}</span> : null}
            </div>
          </div>
          <div style={styles.cardAddress}>
            <MapPin size={13} color="#A89A8C" style={{ flexShrink:0, marginTop:2 }} />
            <span>{client.address}</span>
          </div>
          {pickerOpen ? (
            <div style={styles.avulsaPicker}>
              <p style={styles.avulsaPickerLabel}>Qual produto sai do estoque?</p>
              {shelfProducts.length === 0 ? (
                <p style={styles.avulsaPickerEmpty}>Nenhum produto cadastrado em Estoque ainda.</p>
              ) : (
                <select style={styles.input} value={selectedProduct} onChange={e => setSelectedProduct(e.target.value)}>
                  <option value="">Selecione um produto…</option>
                  {shelfProducts.map(p => <option key={p.id} value={p.id}>{p.name} (saldo: {p.balance})</option>)}
                </select>
              )}
              <div style={{ display:"flex", gap:8, marginTop:8 }}>
                <input type="number" min="1" style={{ ...styles.input, flex:1 }} value={selectedAmount}
                  onChange={e => setSelectedAmount(e.target.value)} placeholder="Qtd" />
                <button style={styles.avulsaConfirmBtn} onClick={confirmAvulsaDelivery} disabled={!selectedProduct}>Confirmar</button>
                <button style={styles.avulsaCancelBtn} onClick={() => setPickerOpen(false)}>Cancelar</button>
              </div>
            </div>
          ) : (
            <>
              <div style={styles.statusRow}>
                {Object.entries(statusConfig).map(([key, conf]) => {
                  const Icon = conf.icon; const active = status === key;
                  return (
                    <button key={key} onClick={() => handleStatusClick(key)}
                      style={{ ...styles.statusBtn, ...(active ? { background:conf.color, color:"#FFF7EF", borderColor:conf.color } : { background:"#FFF7EF", color:"#8A7A6C", borderColor:"#E8DDD0" }) }}>
                      <Icon size={13} strokeWidth={2.5} />{conf.label}
                    </button>
                  );
                })}
              </div>
              <div style={{ display:"flex", justifyContent:"flex-end", marginTop:8 }}>
                <button style={styles.rescheduleBtn} onClick={() => onReschedule(client, date, orderId)}>
                  <Calendar size={12} strokeWidth={2.5} />Reagendar
                </button>
              </div>
            </>
          )}
        </div>
      );
    }

    // ─── RESCHEDULE MODAL ─────────────────────────────────────────────────────
    function RescheduleModal({ info, onClose, onConfirm }) {
      const [newDate, setNewDate] = useState("");
      const [scope,   setScope]   = useState("only");
      const isRecurring = info.frequency !== "avulsa";
      const canConfirm  = newDate && newDate !== info.date;
      return (
        <div style={styles.modalOverlay} onClick={onClose}>
          <div style={styles.modal} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHead}>
              <h3 style={styles.modalTitle}>Reagendar entrega</h3>
              <button style={styles.modalClose} onClick={onClose}><X size={18} color="#8A7A6C" /></button>
            </div>
            <div style={styles.formBody}>
              <div style={styles.rescheduleInfo}>
                <div style={styles.dogBadge}><PawPrint size={14} color="#B8825A" /></div>
                <div>
                  <div style={{ fontSize:15.5, fontWeight:700, color:"#3E332A" }}>{info.dog}</div>
                  <div style={{ fontSize:12.5, color:"#A89A8C", marginTop:1 }}>entrega original: {formatDateBR(info.date)}</div>
                </div>
              </div>
              <Field label="Nova data de entrega">
                <input type="date" style={styles.input} value={newDate} onChange={e => setNewDate(e.target.value)} />
              </Field>
              {isRecurring && (
                <Field label="O que alterar?">
                  <div style={styles.freqGrid}>
                    <button type="button" onClick={() => setScope("only")}
                      style={{ ...styles.freqOption, ...(scope==="only" ? styles.freqOptionActive : {}), textAlign:"center", lineHeight:1.35 }}>
                      Só esta entrega
                    </button>
                    <button type="button" onClick={() => setScope("following")}
                      style={{ ...styles.freqOption, ...(scope==="following" ? styles.freqOptionActive : {}), textAlign:"center", lineHeight:1.35 }}>
                      Esta e as seguintes
                    </button>
                  </div>
                  <p style={{ margin:"6px 0 0", fontSize:11.5, color:"#A89A8C", lineHeight:1.4 }}>
                    {scope === "only"
                      ? "A data original volta a aparecer normalmente nas próximas ocorrências."
                      : "O dia fixo de entrega será alterado permanentemente a partir desta data."}
                  </p>
                </Field>
              )}
              <button style={{ ...styles.saveBtn, opacity: canConfirm ? 1 : 0.45 }} disabled={!canConfirm}
                onClick={() => { if (canConfirm) onConfirm(info.clientId, info.date, newDate, scope, info.orderId); }}>
                Confirmar reagendamento
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─── CLIENTS VIEW ─────────────────────────────────────────────────────────
    function ClientsView({ clients, search, setSearch, onEdit, onDelete, avulsaOrders, onAddAvulsaOrder, onDeleteAvulsaOrder }) {
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [newOrderFor,   setNewOrderFor]   = useState(null);
      const today = todayISO();

      const getAvulsaMeta = (c) => {
        const orders = avulsaOrders[c.id] || [];
        if (orders.length === 0) return `Avulsa · próxima: ${formatDateBR(c.nextDate)}`;
        const upcoming = orders.filter(o => o.date >= today);
        if (upcoming.length === 0) return "Avulsa · sem entrega agendada";
        return `Avulsa · ${upcoming.length} agendada${upcoming.length !== 1 ? "s" : ""} · próxima: ${formatDateBR(upcoming[0].date)}`;
      };

      return (
        <div style={styles.section}>
          <div style={styles.searchBar}>
            <Search size={16} color="#A89A8C" />
            <input style={styles.searchInput} placeholder="Buscar por tutor, cão ou endereço…"
              value={search} onChange={e => setSearch(e.target.value)} />
          </div>
          {clients.length === 0 ? <EmptyState text="Nenhum cliente cadastrado ainda." /> : (
            <div style={styles.cardList}>
              {clients.map(c => {
                const isAvulsa = c.frequency === "avulsa";
                const orders = isAvulsa ? (avulsaOrders[c.id] || []) : [];
                return (
                  <div key={c.id} style={styles.clientCard}>
                    <div style={styles.clientRow}>
                      <div style={styles.dogBadge}><PawPrint size={14} color="#B8825A" /></div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                          <div style={styles.cardDog}>{c.dog}</div>
                          <span style={{
                            fontSize:10, fontWeight:700, padding:"2px 7px", borderRadius:6, whiteSpace:"nowrap",
                            color:      isAvulsa ? "#8A6A48" : "#3E7CB1",
                            background: isAvulsa ? "#F6EEE3" : "#EAF2F8",
                          }}>{isAvulsa ? "Avulso" : "Assinante"}</span>
                        </div>
                        <div style={styles.cardTutor}>{c.tutor}</div>
                        <div style={styles.clientMeta}>
                          {isAvulsa
                            ? getAvulsaMeta(c)
                            : `${frequencyLabel[c.frequency]} · próxima: ${formatDateBR(c.nextDate)}${c.units ? ` · ${c.units} ${c.units===1?"unidade":"unidades"}` : ""}`
                          }
                        </div>
                      </div>
                      <div style={styles.rowActions}>
                        {isAvulsa && (
                          <button style={{ ...styles.iconBtn, borderColor:"#D4A574" }} title="Novo pedido"
                            onClick={() => setNewOrderFor(c.id)}>
                            <Plus size={15} color="#B8825A" />
                          </button>
                        )}
                        <button style={styles.iconBtn} onClick={() => onEdit(c)}><Edit3 size={15} color="#8A7A6C" /></button>
                        {confirmDelete === c.id ? (
                          <button style={{ ...styles.iconBtn, background:"#C0594B" }}
                            onClick={() => { onDelete(c.id); setConfirmDelete(null); }}>
                            <Check size={15} color="#fff" />
                          </button>
                        ) : (
                          <button style={styles.iconBtn} onClick={() => setConfirmDelete(c.id)}><Trash2 size={15} color="#8A7A6C" /></button>
                        )}
                      </div>
                    </div>
                    {isAvulsa && orders.length > 0 && (
                      <div style={styles.orderList}>
                        {orders.map(o => {
                          const isPast = o.date < today;
                          return (
                            <div key={o.id} style={styles.orderRow}>
                              <Calendar size={12} color={isPast ? "#C9BBA8" : "#B8825A"} style={{ flexShrink:0 }} />
                              <span style={{ ...styles.orderDate, color: isPast ? "#C9BBA8" : "#3E332A" }}>
                                {formatDateBR(o.date)}
                                {isPast && <span style={styles.orderPastBadge}>passado</span>}
                              </span>
                              <button style={styles.orderDeleteBtn} onClick={() => onDeleteAvulsaOrder(c.id, o.id)}>
                                <X size={11} color="#C9BBA8" />
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
          {newOrderFor && (
            <NewOrderModal
              onClose={() => setNewOrderFor(null)}
              onConfirm={(date) => { onAddAvulsaOrder(newOrderFor, date); setNewOrderFor(null); }}
            />
          )}
        </div>
      );
    }

    // ─── NEW ORDER MODAL ──────────────────────────────────────────────────────
    function NewOrderModal({ onClose, onConfirm }) {
      const [date, setDate] = useState(todayISO());
      return (
        <div style={styles.modalOverlay} onClick={onClose}>
          <div style={styles.modal} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHead}>
              <h3 style={styles.modalTitle}>Novo pedido avulso</h3>
              <button style={styles.modalClose} onClick={onClose}><X size={18} color="#8A7A6C" /></button>
            </div>
            <div style={styles.formBody}>
              <Field label="Data de entrega">
                <input type="date" style={styles.input} value={date} onChange={e => setDate(e.target.value)} />
              </Field>
              <button style={styles.saveBtn} onClick={() => { if (date) onConfirm(date); }}>
                Adicionar pedido
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─── STOCK VIEW ───────────────────────────────────────────────────────────
    function StockView({ clients, subscriberStock, subscriberStockLog, shelfProducts, shelfStockLog, petiscoProducts, petiscoStockLog, onAddSubscriberProduction, onAddShelfProduct, onAddShelfStockEntry, onDeleteShelfProduct, onAddPetiscoProduct, onAddPetiscoStockEntry, onDeletePetiscoProduct }) {
      const [tab, setTab] = useState("assinantes");
      const [expandedClient,  setExpandedClient]  = useState(null);
      const [productionInputs,setProductionInputs]= useState({});
      const [expandedProduct, setExpandedProduct] = useState(null);
      const [showNewProduct,  setShowNewProduct]  = useState(false);
      const [newProductName,  setNewProductName]  = useState("");
      const [stockInputs,     setStockInputs]     = useState({});
      const [expandedPetisco, setExpandedPetisco] = useState(null);
      const [showNewPetisco,  setShowNewPetisco]  = useState(false);
      const [newPetiscoName,  setNewPetiscoName]  = useState("");
      const [petiscoInputs,   setPetiscoInputs]   = useState({});

      const subscribers = clients.filter(c => c.frequency !== "avulsa");

      return (
        <div style={styles.section}>
          <div style={styles.sectionHeadRow}><h2 style={styles.sectionTitle}>Estoque</h2></div>
          <div style={styles.stockTabRow}>
            {[["assinantes","Assinantes"],["avulsos","Avulsos"],["petiscos","Petiscos"]].map(([key,label]) => (
              <button key={key} style={{ ...styles.stockTabBtn, ...(tab===key ? styles.stockTabBtnActive : {}) }}
                onClick={() => setTab(key)}>{label}</button>
            ))}
          </div>

          {tab === "assinantes" && (
            subscribers.length === 0 ? <EmptyState text="Nenhum cliente assinante cadastrado ainda." /> : (
              <div style={styles.cardList}>
                {subscribers.map(c => {
                  const balance = subscriberStock[c.id] ?? 0;
                  const isLow = balance <= (c.units || 0);
                  const log = subscriberStockLog[c.id] || [];
                  const exp = expandedClient === c.id;
                  return (
                    <div key={c.id} style={styles.stockCard}>
                      <div style={styles.stockCardTop}>
                        <div style={styles.cardIdentity}>
                          <div style={styles.dogBadge}><PawPrint size={14} color="#B8825A" /></div>
                          <div><div style={styles.cardDog}>{c.dog}</div><div style={styles.cardTutor}>{c.tutor}</div></div>
                        </div>
                        <div style={{ textAlign:"right" }}>
                          <div style={{ ...styles.balanceNum, color: isLow ? "#C0594B" : "#3E332A" }}>{balance}</div>
                          <div style={styles.balanceLabel}>em estoque</div>
                        </div>
                      </div>
                      {isLow && <div style={styles.lowStockWarning}><AlertTriangle size={13} color="#C0594B" /><span>Saldo baixo para a próxima entrega ({c.units||0} un.)</span></div>}
                      <div style={styles.stockEntryRow}>
                        <input type="number" min="1" style={{ ...styles.input, flex:1 }} placeholder="Unidades produzidas"
                          value={productionInputs[c.id] || ""} onChange={e => setProductionInputs(p => ({ ...p, [c.id]: e.target.value }))} />
                        <button style={styles.addStockBtn} onClick={() => {
                          const a = parseInt(productionInputs[c.id],10);
                          if (a>0) { onAddSubscriberProduction(c.id, a); setProductionInputs(p => ({ ...p, [c.id]:"" })); }
                        }}><Plus size={14} strokeWidth={2.5} />Adicionar</button>
                      </div>
                      <button style={styles.historyToggle} onClick={() => setExpandedClient(exp ? null : c.id)}>
                        {exp ? "Ocultar histórico" : `Ver histórico (${log.length})`}
                      </button>
                      {exp && <div style={styles.historyList}>{log.length === 0 ? <p style={styles.historyEmpty}>Sem movimentações ainda.</p> : log.map((e,i) => <HistoryRow key={i} entry={e} />)}</div>}
                    </div>
                  );
                })}
              </div>
            )
          )}

          {tab === "avulsos" && (
            <>
              <div style={{ marginBottom:14 }}>
                {showNewProduct ? (
                  <div style={styles.newProductBox}>
                    <input style={styles.input} placeholder="Nome do produto (ex: Biscoito Natural 200g)"
                      value={newProductName} onChange={e => setNewProductName(e.target.value)} autoFocus />
                    <div style={{ display:"flex", gap:8, marginTop:8 }}>
                      <button style={styles.avulsaConfirmBtn} onClick={() => {
                        if (!newProductName.trim()) return;
                        onAddShelfProduct(newProductName.trim()); setNewProductName(""); setShowNewProduct(false);
                      }}>Salvar</button>
                      <button style={styles.avulsaCancelBtn} onClick={() => setShowNewProduct(false)}>Cancelar</button>
                    </div>
                  </div>
                ) : (
                  <button style={styles.newProductTrigger} onClick={() => setShowNewProduct(true)}>
                    <Plus size={16} strokeWidth={2.5} />Cadastrar produto de prateleira
                  </button>
                )}
              </div>
              {shelfProducts.length === 0 ? <EmptyState text="Nenhum produto de prateleira cadastrado ainda." /> : (
                <div style={styles.cardList}>
                  {shelfProducts.map(p => {
                    const log = shelfStockLog[p.id] || [];
                    const exp = expandedProduct === p.id;
                    const isLow = p.balance <= 0;
                    return (
                      <div key={p.id} style={styles.stockCard}>
                        <div style={styles.stockCardTop}>
                          <div style={styles.cardIdentity}><div style={styles.dogBadge}><Package size={14} color="#B8825A" /></div><div style={styles.cardDog}>{p.name}</div></div>
                          <div style={{ textAlign:"right" }}><div style={{ ...styles.balanceNum, color: isLow ? "#C0594B" : "#3E332A" }}>{p.balance}</div><div style={styles.balanceLabel}>em estoque</div></div>
                        </div>
                        {isLow && <div style={styles.lowStockWarning}><AlertTriangle size={13} color="#C0594B" /><span>Sem saldo disponível</span></div>}
                        <div style={styles.stockEntryRow}>
                          <input type="number" min="1" style={{ ...styles.input, flex:1 }} placeholder="Unidades a adicionar"
                            value={stockInputs[p.id] || ""} onChange={e => setStockInputs(s => ({ ...s, [p.id]: e.target.value }))} />
                          <button style={styles.addStockBtn} onClick={() => {
                            const a = parseInt(stockInputs[p.id],10);
                            if (a>0) { onAddShelfStockEntry(p.id, a); setStockInputs(s => ({ ...s, [p.id]:"" })); }
                          }}><Plus size={14} strokeWidth={2.5} />Adicionar</button>
                        </div>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:8 }}>
                          <button style={styles.historyToggle} onClick={() => setExpandedProduct(exp ? null : p.id)}>
                            {exp ? "Ocultar histórico" : `Ver histórico (${log.length})`}
                          </button>
                          <button style={styles.deleteProductBtn} onClick={() => onDeleteShelfProduct(p.id)}><Trash2 size={13} color="#A89A8C" /></button>
                        </div>
                        {exp && <div style={styles.historyList}>{log.length === 0 ? <p style={styles.historyEmpty}>Sem movimentações ainda.</p> : log.map((e,i) => <HistoryRow key={i} entry={e} />)}</div>}
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}

          {tab === "petiscos" && (
            <>
              <div style={{ marginBottom:14 }}>
                {showNewPetisco ? (
                  <div style={styles.newProductBox}>
                    <input style={styles.input} placeholder="Nome do petisco (ex: Biscoito de Frango 100g)"
                      value={newPetiscoName} onChange={e => setNewPetiscoName(e.target.value)} autoFocus />
                    <div style={{ display:"flex", gap:8, marginTop:8 }}>
                      <button style={styles.avulsaConfirmBtn} onClick={() => {
                        if (!newPetiscoName.trim()) return;
                        onAddPetiscoProduct(newPetiscoName.trim()); setNewPetiscoName(""); setShowNewPetisco(false);
                      }}>Salvar</button>
                      <button style={styles.avulsaCancelBtn} onClick={() => setShowNewPetisco(false)}>Cancelar</button>
                    </div>
                  </div>
                ) : (
                  <button style={styles.newProductTrigger} onClick={() => setShowNewPetisco(true)}>
                    <Plus size={16} strokeWidth={2.5} />Cadastrar petisco
                  </button>
                )}
              </div>
              {petiscoProducts.length === 0 ? <EmptyState text="Nenhum petisco cadastrado ainda." /> : (
                <div style={styles.cardList}>
                  {petiscoProducts.map(p => {
                    const log = petiscoStockLog[p.id] || [];
                    const exp = expandedPetisco === p.id;
                    const isLow = p.balance <= 0;
                    return (
                      <div key={p.id} style={styles.stockCard}>
                        <div style={styles.stockCardTop}>
                          <div style={styles.cardIdentity}><div style={styles.dogBadge}><Cookie size={14} color="#B8825A" /></div><div style={styles.cardDog}>{p.name}</div></div>
                          <div style={{ textAlign:"right" }}><div style={{ ...styles.balanceNum, color: isLow ? "#C0594B" : "#3E332A" }}>{p.balance}</div><div style={styles.balanceLabel}>em estoque</div></div>
                        </div>
                        {isLow && <div style={styles.lowStockWarning}><AlertTriangle size={13} color="#C0594B" /><span>Sem saldo disponível</span></div>}
                        <div style={styles.stockEntryRow}>
                          <input type="number" min="1" style={{ ...styles.input, flex:1 }} placeholder="Unidades produzidas"
                            value={petiscoInputs[p.id] || ""} onChange={e => setPetiscoInputs(s => ({ ...s, [p.id]: e.target.value }))} />
                          <button style={styles.addStockBtn} onClick={() => {
                            const a = parseInt(petiscoInputs[p.id],10);
                            if (a>0) { onAddPetiscoStockEntry(p.id, a); setPetiscoInputs(s => ({ ...s, [p.id]:"" })); }
                          }}><Plus size={14} strokeWidth={2.5} />Adicionar</button>
                        </div>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:8 }}>
                          <button style={styles.historyToggle} onClick={() => setExpandedPetisco(exp ? null : p.id)}>
                            {exp ? "Ocultar histórico" : `Ver histórico (${log.length})`}
                          </button>
                          <button style={styles.deleteProductBtn} onClick={() => onDeletePetiscoProduct(p.id)}><Trash2 size={13} color="#A89A8C" /></button>
                        </div>
                        {exp && <div style={styles.historyList}>{log.length === 0 ? <p style={styles.historyEmpty}>Sem movimentações ainda.</p> : log.map((e,i) => <HistoryRow key={i} entry={e} />)}</div>}
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function HistoryRow({ entry }) {
      const positive = entry.amount > 0;
      const Icon = positive ? ArrowUpCircle : ArrowDownCircle;
      return (
        <div style={styles.historyRow}>
          <Icon size={15} color={positive ? "#5C8A5C" : "#C0594B"} style={{ flexShrink:0 }} />
          <div style={{ flex:1 }}>
            <div style={styles.historyReason}>{entry.reason}</div>
            <div style={styles.historyDate}>{formatDateBR(entry.date)}</div>
          </div>
          <div style={{ ...styles.historyAmount, color: positive ? "#5C8A5C" : "#C0594B" }}>{positive ? "+" : ""}{entry.amount}</div>
        </div>
      );
    }

    // ─── CLIENT FORM MODAL ────────────────────────────────────────────────────
    function ClientFormModal({ initial, clients, onClose, onSave }) {
      const initIsSubscriber = initial ? initial.frequency !== "avulsa" : true;
      const [tutor,           setTutor]           = useState(initial?.tutor    || "");
      const [dog,             setDog]             = useState(initial?.dog      || "");
      const [address,         setAddress]         = useState(initial?.address  || "");
      const [isSubscriber,    setIsSubscriber]    = useState(initIsSubscriber);
      const [frequency,       setFrequency]       = useState(
        initial?.frequency && initial.frequency !== "avulsa" ? initial.frequency : "semanal"
      );
      const [nextDate,        setNextDate]        = useState(initial?.nextDate || todayISO());
      const [units,           setUnits]           = useState(initial?.units ? String(initial.units) : "");
      const [notes,           setNotes]           = useState(initial?.notes    || "");
      const [labelFile,       setLabelFile]       = useState(initial?.labelFile || "");
      const [labelFileEdited, setLabelFileEdited] = useState(!!initial?.labelFile);
      const [error,           setError]           = useState("");
      const [saving,          setSaving]          = useState(false);

      useEffect(() => {
        if (!labelFileEdited) setLabelFile(suggestLabelFile(dog, tutor, clients, initial?.id));
      }, [dog, tutor, labelFileEdited]);

      const handleSubmit = async () => {
        if (!tutor.trim() || !dog.trim() || !address.trim()) { setError("Preencha tutor, cão e endereço."); return; }
        if (isSubscriber && !nextDate) { setError("Informe a data da próxima entrega."); return; }
        const unitsNum = units ? parseInt(units, 10) : null;
        if (isSubscriber && (!unitsNum || unitsNum < 1)) { setError("Informe a quantidade de unidades por entrega."); return; }
        setSaving(true);
        await onSave({
          tutor: tutor.trim(), dog: dog.trim(), address: address.trim(),
          frequency: isSubscriber ? frequency : "avulsa",
          nextDate:  isSubscriber ? nextDate : (initial?.nextDate || null),
          units:     unitsNum, notes,
          labelFile: labelFile.trim(),
        });
        setSaving(false);
      };

      return (
        <div style={styles.modalOverlay} onClick={onClose}>
          <div style={styles.modal} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHead}>
              <h3 style={styles.modalTitle}>{initial ? "Editar cliente" : "Novo cliente"}</h3>
              <button style={styles.modalClose} onClick={onClose}><X size={18} color="#8A7A6C" /></button>
            </div>
            <div style={styles.formBody}>
              <Field label="Nome do tutor">
                <input style={styles.input} value={tutor} onChange={e => setTutor(e.target.value)} placeholder="Ex: Marina Costa" />
              </Field>
              <Field label="Nome do cão">
                <input style={styles.input} value={dog} onChange={e => setDog(e.target.value)} placeholder="Ex: Mia" />
              </Field>
              <Field label="Endereço de entrega">
                <input style={styles.input} value={address} onChange={e => setAddress(e.target.value)} placeholder="Rua, número, bairro" />
              </Field>
              <Field label="Tipo de cliente">
                <div style={styles.subscriberToggle}>
                  <button type="button" onClick={() => setIsSubscriber(true)}
                    style={{ ...styles.subscriberOpt, ...(isSubscriber ? styles.subscriberOptActive : {}) }}>
                    <span style={{ ...styles.subscriberOptTitle, color: isSubscriber ? "#8A6A48" : "#3E332A" }}>Assinante</span>
                    <span style={styles.subscriberOptSub}>entrega recorrente</span>
                  </button>
                  <button type="button" onClick={() => setIsSubscriber(false)}
                    style={{ ...styles.subscriberOpt, ...(!isSubscriber ? styles.subscriberOptActive : {}) }}>
                    <span style={{ ...styles.subscriberOptTitle, color: !isSubscriber ? "#8A6A48" : "#3E332A" }}>Avulso</span>
                    <span style={styles.subscriberOptSub}>pedido por pedido</span>
                  </button>
                </div>
              </Field>
              {isSubscriber && (
                <Field label="Frequência">
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8 }}>
                    {[["semanal","Semanal"],["quinzenal","Quinzenal"],["mensal","Mensal"]].map(([key, label]) => (
                      <button key={key} type="button" onClick={() => setFrequency(key)}
                        style={{ ...styles.freqOption, ...(frequency===key ? styles.freqOptionActive : {}) }}>
                        {label}
                      </button>
                    ))}
                  </div>
                </Field>
              )}
              {isSubscriber && (
                <Field label="Próxima entrega">
                  <input type="date" style={styles.input} value={nextDate} onChange={e => setNextDate(e.target.value)} />
                </Field>
              )}
              <Field label={isSubscriber ? "Unidades por entrega" : "Unidades por entrega (opcional)"}>
                <input type="number" min="1" style={styles.input} value={units} onChange={e => setUnits(e.target.value)} placeholder="Ex: 4" />
              </Field>
              <Field label="Arquivo de etiqueta (.btw)">
                <div style={{ position:"relative" }}>
                  <input style={{ ...styles.input, paddingRight: labelFileEdited ? 80 : 12 }}
                    value={labelFile}
                    onChange={e => { setLabelFile(e.target.value); setLabelFileEdited(true); }}
                    placeholder="ex: mia  ou  mia - mc" />
                  {labelFileEdited && (
                    <button type="button" style={styles.labelSuggestBtn}
                      onClick={() => { setLabelFileEdited(false); setLabelFile(suggestLabelFile(dog, tutor, clients, initial?.id)); }}>
                      ↺ sugerir
                    </button>
                  )}
                </div>
                <p style={{ margin:"4px 0 0", fontSize:11.5, color:"#A89A8C", lineHeight:1.4 }}>
                  Nome idêntico ao arquivo <strong>.btw</strong> salvo no OneDrive, sem a extensão.
                  {!labelFile && dog && <span style={{ color:"#C0594B" }}> Configure para gerar o .bat do dia.</span>}
                </p>
              </Field>
              <Field label="Observações (opcional)">
                <textarea style={{ ...styles.input, minHeight:60, resize:"vertical", fontFamily:"inherit" }}
                  value={notes} onChange={e => setNotes(e.target.value)} placeholder="Ex: portaria pede documento" />
              </Field>
              {error && <p style={styles.errorText}>{error}</p>}
              <button style={{ ...styles.saveBtn, opacity: saving ? 0.7 : 1 }} onClick={handleSubmit} disabled={saving}>
                {saving ? "Salvando…" : initial ? "Salvar alterações" : "Adicionar cliente"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function Field({ label, children }) {
      return <div style={styles.field}><label style={styles.fieldLabel}>{label}</label>{children}</div>;
    }

    function EmptyState({ text }) {
      return (
        <div style={styles.empty}>
          <PawPrint size={26} color="#D9CBBC" />
          <p style={styles.emptyText}>{text}</p>
        </div>
      );
    }

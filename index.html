<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ObentōPet — Entregas</title>

  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.3/babel.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #FDF8F2; }
    input:focus, textarea:focus, select:focus { outline: 2px solid #B8825A; outline-offset: 1px; }
    button:focus-visible { outline: 2px solid #B8825A; outline-offset: 2px; }
    button { font-family: inherit; cursor: pointer; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #E8DDD0; border-radius: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;
    const { createClient } = supabase;

    // ─── Ícones SVG inline (sem dependência de CDN) ───────────────────────────────
    function Ico({ size = 16, color = "currentColor", sw = 2, style, children }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={style}>
          {children}
        </svg>
      );
    }
    const Plus         = (p) => <Ico {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Ico>;
    const Check        = (p) => <Ico {...p}><polyline points="20 6 9 17 4 12"/></Ico>;
    const Clock        = (p) => <Ico {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Ico>;
    const Truck        = (p) => <Ico {...p}><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></Ico>;
    const PawPrint     = (p) => <Ico {...p}><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/><circle cx="4" cy="8" r="2"/></Ico>;
    const MapPin       = (p) => <Ico {...p}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></Ico>;
    const X            = (p) => <Ico {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Ico>;
    const Search       = (p) => <Ico {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Ico>;
    const ChevronLeft  = (p) => <Ico {...p}><polyline points="15 18 9 12 15 6"/></Ico>;
    const ChevronRight = (p) => <Ico {...p}><polyline points="9 18 15 12 9 6"/></Ico>;
    const Trash2       = (p) => <Ico {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Ico>;
    const Edit3        = (p) => <Ico {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></Ico>;
    const Package      = (p) => <Ico {...p}><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></Ico>;
    const ArrowUpCircle   = (p) => <Ico {...p}><circle cx="12" cy="12" r="10"/><polyline points="16 12 12 8 8 12"/><line x1="12" y1="16" x2="12" y2="8"/></Ico>;
    const ArrowDownCircle = (p) => <Ico {...p}><circle cx="12" cy="12" r="10"/><polyline points="8 12 12 16 16 12"/><line x1="12" y1="8" x2="12" y2="16"/></Ico>;
    const AlertTriangle= (p) => <Ico {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Ico>;
    const Cookie       = (p) => <Ico {...p}><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/><path d="M8.5 8.5v.01"/><path d="M16 15.5v.01"/><path d="M12 12v.01"/><path d="M11 17v.01"/><path d="M7 14v.01"/></Ico>;
    const CheckCircle  = (p) => <Ico {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Ico>;
    const RefreshCw    = (p) => <Ico {...p}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></Ico>;

    // ─── Supabase ────────────────────────────────────────────────────────────────
    const SUPABASE_URL = "https://jyrudfwdwkwynolpbni.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5cnVqZGZ3ZHdrd3lub2xwYm5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNDQ1NjIsImV4cCI6MjA5NzcyMDU2Mn0.qXI47InAtYkEspDp_cD34nOjaHk1mnKw2KU6y7MNL1A";
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    // ─── Helpers ─────────────────────────────────────────────────────────────────
    function todayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    const weekdayNames = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
    const weekdayShort = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
    function dateToISO(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
    function formatDateBR(iso) { if(!iso) return "—"; const [,m,d] = iso.split("-"); return `${d}/${m}`; }
    function addDays(iso, days) { const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+days); return dateToISO(d); }

    const dbToClient = (r) => ({ id:r.id, tutor:r.tutor, dog:r.dog, address:r.address, frequency:r.frequency, nextDate:r.next_date, units:r.units, notes:r.notes||"" });
    const clientToDb = (data, id) => ({ id, tutor:data.tutor, dog:data.dog, address:data.address, frequency:data.frequency, next_date:data.nextDate, units:data.units, notes:data.notes });

    function getOccurrencesInRange(client, startISO, endISO) {
      const out = [];
      if (!client.nextDate) return out;
      if (client.frequency === "avulsa") {
        if (client.nextDate >= startISO && client.nextDate <= endISO) out.push(client.nextDate);
        return out;
      }
      if (client.frequency === "mensal") {
        let cur = new Date(client.nextDate+"T00:00:00");
        const start = new Date(startISO+"T00:00:00"), end = new Date(endISO+"T00:00:00");
        while (cur > start) { const p = new Date(cur); p.setMonth(p.getMonth()-1); cur = p; }
        while (cur <= end)  { if (cur >= start) out.push(dateToISO(cur)); const n = new Date(cur); n.setMonth(n.getMonth()+1); cur = n; }
        return out;
      }
      const step = client.frequency === "semanal" ? 7 : 14;
      let cur = client.nextDate;
      while (cur > startISO) cur = addDays(cur,-step);
      while (cur <= endISO) { if (cur >= startISO) out.push(cur); cur = addDays(cur,step); }
      return out;
    }

    const freqLabel = { semanal:"Semanal", quinzenal:"Quinzenal", mensal:"Mensal", avulsa:"Avulsa" };
    const statusCfg = {
      preparando: { label:"Preparando", color:"#B8825A", Icon:Clock },
      a_caminho:  { label:"A caminho",  color:"#3E7CB1", Icon:Truck },
      entregue:   { label:"Entregue",   color:"#5C8A5C", Icon:Check },
    };

    // ─── Toast ────────────────────────────────────────────────────────────────────
    function Toast({ msg, type="success", onDismiss }) {
      useEffect(() => { const t = setTimeout(onDismiss,4000); return ()=>clearTimeout(t); }, []);
      return (
        <div onClick={onDismiss} style={{
          position:"fixed", bottom:24, left:"50%", transform:"translateX(-50%)",
          display:"flex", alignItems:"center", gap:8,
          background: type==="error" ? "#C0594B" : "#5C8A5C",
          color:"#fff", fontSize:14, fontWeight:600, padding:"12px 20px",
          borderRadius:12, boxShadow:"0 4px 16px rgba(0,0,0,0.2)",
          zIndex:200, cursor:"pointer", whiteSpace:"nowrap", maxWidth:"calc(100vw - 32px)"
        }}>
          {type==="error" ? <AlertTriangle size={16} color="#fff" sw={2.5}/> : <CheckCircle size={16} color="#fff" sw={2.5}/>}
          <span>{msg}</span>
        </div>
      );
    }

    // ─── App ──────────────────────────────────────────────────────────────────────
    function App() {
      const [clients,            setClients]            = useState([]);
      const [loaded,             setLoaded]             = useState(false);
      const [refreshing,         setRefreshing]         = useState(false);
      const [statusLog,          setStatusLog]          = useState({});
      const [subscriberStock,    setSubscriberStock]    = useState({});
      const [subscriberStockLog, setSubscriberStockLog] = useState({});
      const [shelfProducts,      setShelfProducts]      = useState([]);
      const [shelfStockLog,      setShelfStockLog]      = useState({});
      const [deliveryDeduction,  setDeliveryDeduction]  = useState({});
      const [petiscoProducts,    setPetiscoProducts]    = useState([]);
      const [petiscoStockLog,    setPetiscoStockLog]    = useState({});
      const [view,               setView]               = useState("hoje");
      const [weekOffset,         setWeekOffset]         = useState(0);
      const [search,             setSearch]             = useState("");
      const [showForm,           setShowForm]           = useState(false);
      const [editingClient,      setEditingClient]      = useState(null);
      const [toast,              setToast]              = useState(null);

      const showToast = useCallback((msg, type="success") => setToast({msg,type}), []);

      // ── Carrega dados ─────────────────────────────────────────────────────────
      const loadData = useCallback(async (silent=false) => {
        if (silent) setRefreshing(true); else setLoaded(false);
        try {
          const [
            {data:cData,  error:e1}, {data:sData,  error:e2}, {data:ssData, error:e3},
            {data:sslData,error:e4}, {data:spData, error:e5}, {data:splData,error:e6},
            {data:ddData, error:e7}, {data:ppData, error:e8}, {data:pplData,error:e9},
          ] = await Promise.all([
            db.from("clients").select("*"),
            db.from("status_log").select("*"),
            db.from("subscriber_stock").select("*"),
            db.from("subscriber_stock_log").select("*").order("ts",{ascending:false}),
            db.from("shelf_products").select("*"),
            db.from("shelf_stock_log").select("*").order("ts",{ascending:false}),
            db.from("delivery_deduction").select("*"),
            db.from("snack_products").select("*"),
            db.from("snack_stock_log").select("*").order("ts",{ascending:false}),
          ]);
          if (e1||e2||e3||e4||e5||e6||e7||e8||e9) throw new Error("Erro Supabase");

          setClients((cData||[]).map(dbToClient));

          const sl={};  (sData||[]).forEach(r=>{sl[r.key]=r.status;}); setStatusLog(sl);
          const ss={};  (ssData||[]).forEach(r=>{ss[r.client_id]=r.balance;}); setSubscriberStock(ss);

          const ssl={};
          (sslData||[]).forEach(r=>{
            if(!ssl[r.client_id]) ssl[r.client_id]=[];
            if(ssl[r.client_id].length<100) ssl[r.client_id].push({date:r.date,amount:r.amount,reason:r.reason,ts:r.ts});
          });
          setSubscriberStockLog(ssl);

          setShelfProducts((spData||[]).map(p=>({id:p.id,name:p.name,balance:p.balance})));

          const spl={};
          (splData||[]).forEach(r=>{
            if(!spl[r.product_id]) spl[r.product_id]=[];
            if(spl[r.product_id].length<100) spl[r.product_id].push({date:r.date,amount:r.amount,reason:r.reason,ts:r.ts});
          });
          setShelfStockLog(spl);

          const dd={};  (ddData||[]).forEach(r=>{dd[r.key]={productId:r.product_id,amount:r.amount};}); setDeliveryDeduction(dd);
          setPetiscoProducts((ppData||[]).map(p=>({id:p.id,name:p.name,balance:p.balance})));

          const ppl={};
          (pplData||[]).forEach(r=>{
            if(!ppl[r.product_id]) ppl[r.product_id]=[];
            if(ppl[r.product_id].length<100) ppl[r.product_id].push({date:r.date,amount:r.amount,reason:r.reason,ts:r.ts});
          });
          setPetiscoStockLog(ppl);

          if (silent) showToast("Dados atualizados!");
        } catch(e) {
          console.error(e);
          showToast("Erro ao conectar. Verifique a internet.", "error");
        } finally {
          setLoaded(true);
          setRefreshing(false);
        }
      }, [showToast]);

      useEffect(() => { loadData(); }, [loadData]);

      // Recarrega quando o usuário volta para a aba/app (uso simultâneo)
      useEffect(() => {
        const fn = () => { if(!document.hidden) loadData(true); };
        document.addEventListener("visibilitychange", fn);
        return () => document.removeEventListener("visibilitychange", fn);
      }, [loadData]);

      // ── Clientes ──────────────────────────────────────────────────────────────
      const saveClient = async (data) => {
        const isEditing = !!editingClient;
        const id = isEditing ? editingClient.id : "c"+Date.now();
        const row = clientToDb(data, id);
        if (isEditing) {
          const {error} = await db.from("clients").update(row).eq("id",id);
          if (error) throw new Error(error.message);
          setClients(prev => prev.map(c => c.id===id ? {...c,...data} : c));
        } else {
          const {error} = await db.from("clients").insert(row);
          if (error) throw new Error(error.message);
          setClients(prev => [...prev,{...data,id}]);
          if (data.frequency !== "avulsa") {
            await db.from("subscriber_stock").upsert({client_id:id,balance:0});
            setSubscriberStock(prev => ({...prev,[id]:0}));
          }
        }
        setShowForm(false); setEditingClient(null);
        showToast(isEditing ? `${data.dog} atualizado!` : `${data.dog} adicionado com sucesso!`);
      };

      const deleteClient = async (id) => {
        const {error} = await db.from("clients").delete().eq("id",id);
        if (error) { showToast("Erro ao excluir cliente.","error"); return; }
        await db.from("subscriber_stock").delete().eq("client_id",id);
        await db.from("subscriber_stock_log").delete().eq("client_id",id);
        setClients(prev => prev.filter(c=>c.id!==id));
        setSubscriberStock(prev => { const n={...prev}; delete n[id]; return n; });
        setSubscriberStockLog(prev => { const n={...prev}; delete n[id]; return n; });
      };

      // ── Status ────────────────────────────────────────────────────────────────
      const getStatus = (clientId, date) => statusLog[`${clientId}|${date}`] || "preparando";

      const setStatus = (clientId, date, newStatus, deduction) => {
        const key = `${clientId}|${date}`;
        const wasEntregue  = (statusLog[key]||"preparando") === "entregue";
        const willEntregue = newStatus === "entregue";
        const client = clients.find(c=>c.id===clientId);

        setStatusLog(prev => ({...prev,[key]:newStatus}));
        db.from("status_log").upsert({key, status:newStatus});

        if (!client) return;
        if (client.frequency === "avulsa") {
          if (!wasEntregue && willEntregue && deduction?.productId) {
            applyShelfDelta(deduction.productId, -deduction.amount, date, "Entrega avulsa");
            setDeliveryDeduction(prev => ({...prev,[key]:deduction}));
            db.from("delivery_deduction").upsert({key, product_id:deduction.productId, amount:deduction.amount});
          }
          if (wasEntregue && !willEntregue) {
            setDeliveryDeduction(prev => {
              const ded = prev[key];
              if (ded?.productId) applyShelfDelta(ded.productId, ded.amount, date, "Estorno");
              const n={...prev}; delete n[key]; return n;
            });
            db.from("delivery_deduction").delete().eq("key",key);
          }
        } else {
          const amt = client.units||0;
          if (!wasEntregue && willEntregue)  applySubscriberDelta(clientId,-amt,date,"Entrega realizada");
          if (wasEntregue  && !willEntregue) applySubscriberDelta(clientId, amt,date,"Estorno");
        }
      };

      // ── Estoque assinantes (setState funcional evita closure desatualizada) ──
      const applySubscriberDelta = (clientId, delta, date, reason) => {
        const ts = Date.now();
        setSubscriberStock(prev => {
          const newBal = (prev[clientId]||0)+delta;
          db.from("subscriber_stock").upsert({client_id:clientId,balance:newBal});
          return {...prev,[clientId]:newBal};
        });
        setSubscriberStockLog(prev => ({...prev,[clientId]:[{date,amount:delta,reason,ts},...(prev[clientId]||[])].slice(0,100)}));
        db.from("subscriber_stock_log").insert({client_id:clientId,date,amount:delta,reason,ts});
      };

      const addSubscriberProduction = (clientId, amount) => {
        if (!amount||amount<=0) return;
        applySubscriberDelta(clientId,amount,todayISO(),"Produção adicionada");
      };

      // ── Estoque prateleira ────────────────────────────────────────────────────
      const applyShelfDelta = (productId, delta, date, reason) => {
        const ts = Date.now();
        setShelfProducts(prev => {
          const p = prev.find(x=>x.id===productId);
          const newBal = (p?.balance||0)+delta;
          db.from("shelf_products").update({balance:newBal}).eq("id",productId);
          return prev.map(x => x.id===productId ? {...x,balance:newBal} : x);
        });
        setShelfStockLog(prev => ({...prev,[productId]:[{date,amount:delta,reason,ts},...(prev[productId]||[])].slice(0,100)}));
        db.from("shelf_stock_log").insert({product_id:productId,date,amount:delta,reason,ts});
      };

      const addShelfProduct = async (name) => {
        const id = "p"+Date.now();
        const {error} = await db.from("shelf_products").insert({id,name,balance:0});
        if (error) { showToast("Erro ao criar produto.","error"); return; }
        setShelfProducts(prev => [...prev,{id,name,balance:0}]);
      };
      const addShelfStockEntry = (productId, amount) => { if(amount>0) applyShelfDelta(productId,amount,todayISO(),"Entrada de estoque"); };
      const deleteShelfProduct = async (productId) => {
        const {error} = await db.from("shelf_products").delete().eq("id",productId);
        if (error) { showToast("Erro ao excluir.","error"); return; }
        setShelfProducts(prev => prev.filter(p=>p.id!==productId));
      };

      // ── Estoque petiscos ──────────────────────────────────────────────────────
      const applyPetiscoDelta = (productId, delta, date, reason) => {
        const ts = Date.now();
        setPetiscoProducts(prev => {
          const p = prev.find(x=>x.id===productId);
          const newBal = (p?.balance||0)+delta;
          db.from("snack_products").update({balance:newBal}).eq("id",productId);
          return prev.map(x => x.id===productId ? {...x,balance:newBal} : x);
        });
        setPetiscoStockLog(prev => ({...prev,[productId]:[{date,amount:delta,reason,ts},...(prev[productId]||[])].slice(0,100)}));
        db.from("snack_stock_log").insert({product_id:productId,date,amount:delta,reason,ts});
      };

      const addPetiscoProduct = async (name) => {
        const id = "pet"+Date.now();
        const {error} = await db.from("snack_products").insert({id,name,balance:0});
        if (error) { showToast("Erro ao criar petisco.","error"); return; }
        setPetiscoProducts(prev => [...prev,{id,name,balance:0}]);
      };
      const addPetiscoStockEntry = (productId, amount) => { if(amount>0) applyPetiscoDelta(productId,amount,todayISO(),"Produção adicionada"); };
      const deletePetiscoProduct = async (productId) => {
        const {error} = await db.from("snack_products").delete().eq("id",productId);
        if (error) { showToast("Erro ao excluir.","error"); return; }
        setPetiscoProducts(prev => prev.filter(p=>p.id!==productId));
      };

      // ── Calendário ───────────────────────────────────────────────────────────
      const weekStart = useMemo(() => {
        const d = new Date(); d.setDate(d.getDate()+weekOffset*7-d.getDay()); return dateToISO(d);
      }, [weekOffset]);
      const weekDays = useMemo(() => Array.from({length:7},(_,i)=>addDays(weekStart,i)), [weekStart]);

      const todayDeliveries = useMemo(() => {
        const t = todayISO();
        return clients.flatMap(c=>getOccurrencesInRange(c,t,t).map(()=>({client:c,date:t})))
          .sort((a,b)=>a.client.tutor.localeCompare(b.client.tutor));
      }, [clients]);

      const weekDeliveries = useMemo(() => {
        const map = Object.fromEntries(weekDays.map(d=>[d,[]]));
        clients.forEach(c=>getOccurrencesInRange(c,weekDays[0],weekDays[6]).forEach(d=>{ if(map[d]) map[d].push(c); }));
        Object.keys(map).forEach(d=>map[d].sort((a,b)=>a.tutor.localeCompare(b.tutor)));
        return map;
      }, [clients, weekDays]);

      const filteredClients = useMemo(() => {
        const q = search.trim().toLowerCase();
        return q ? clients.filter(c=>c.tutor.toLowerCase().includes(q)||c.dog.toLowerCase().includes(q)||c.address.toLowerCase().includes(q)) : clients;
      }, [clients, search]);

      if (!loaded) return (
        <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#FDF8F2",gap:12}}>
          <PawPrint size={36} color="#B8825A"/>
          <p style={{color:"#B8825A",fontFamily:"'Segoe UI',sans-serif",margin:0,fontSize:15,fontWeight:600}}>Carregando...</p>
        </div>
      );

      return (
        <div style={S.app}>
          {toast && <Toast msg={toast.msg} type={toast.type} onDismiss={()=>setToast(null)}/>}

          <header style={S.header}>
            <div style={S.headerInner}>
              <div style={S.brandRow}>
                <div style={S.brandMark}><PawPrint size={20} color="#FBF1E8" sw={2.5}/></div>
                <div>
                  <h1 style={S.brandTitle}>ObentōPet</h1>
                  <p style={S.brandSub}>Controle de Entregas</p>
                </div>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <button title="Atualizar" style={{...S.refreshBtn,opacity:refreshing?0.5:1}} onClick={()=>loadData(true)} disabled={refreshing}>
                  <RefreshCw size={16} color="#FBF1E8" sw={2.5} style={{animation:refreshing?"spin 1s linear infinite":"none"}}/>
                </button>
                <button style={S.newBtn} onClick={()=>{setEditingClient(null);setShowForm(true);}}>
                  <Plus size={18} color="#FFF7EF" sw={2.5}/><span>Novo cliente</span>
                </button>
              </div>
            </div>
            <nav style={S.tabRow}>
              {[["hoje","Hoje"],["semana","Semana"],["clientes","Clientes"],["estoque","Estoque"]].map(([k,l])=>(
                <button key={k} onClick={()=>setView(k)} style={{...S.tab,...(view===k?S.tabActive:{})}}>{l}</button>
              ))}
            </nav>
          </header>

          <main style={S.main}>
            {view==="hoje"     && <TodayView  items={todayDeliveries} getStatus={getStatus} setStatus={setStatus} shelfProducts={shelfProducts}/>}
            {view==="semana"   && <WeekView   weekDays={weekDays} weekDeliveries={weekDeliveries} weekOffset={weekOffset} setWeekOffset={setWeekOffset} getStatus={getStatus} setStatus={setStatus} shelfProducts={shelfProducts}/>}
            {view==="clientes" && <ClientsView clients={filteredClients} search={search} setSearch={setSearch} onEdit={c=>{setEditingClient(c);setShowForm(true);}} onDelete={deleteClient}/>}
            {view==="estoque"  && <StockView
              clients={clients}
              subscriberStock={subscriberStock} subscriberStockLog={subscriberStockLog}
              shelfProducts={shelfProducts}     shelfStockLog={shelfStockLog}
              petiscoProducts={petiscoProducts} petiscoStockLog={petiscoStockLog}
              onAddSubscriberProduction={addSubscriberProduction}
              onAddShelfProduct={addShelfProduct}     onAddShelfStockEntry={addShelfStockEntry}     onDeleteShelfProduct={deleteShelfProduct}
              onAddPetiscoProduct={addPetiscoProduct} onAddPetiscoStockEntry={addPetiscoStockEntry} onDeletePetiscoProduct={deletePetiscoProduct}
            />}
          </main>

          {showForm && <ClientFormModal initial={editingClient} onClose={()=>{setShowForm(false);setEditingClient(null);}} onSave={saveClient}/>}
        </div>
      );
    }

    // ─── TODAY VIEW ───────────────────────────────────────────────────────────────
    function TodayView({items,getStatus,setStatus,shelfProducts}) {
      const t = todayISO();
      const d = new Date(t+"T00:00:00");
      const label = `${weekdayNames[d.getDay()]}, ${d.getDate()} de ${d.toLocaleDateString("pt-BR",{month:"long"})}`;
      return (
        <div style={S.section}>
          <div style={S.headRow}>
            <h2 style={S.sectionTitle}>{label}</h2>
            <span style={S.countPill}>{items.length} entrega{items.length!==1?"s":""}</span>
          </div>
          {items.length===0 ? <Empty text="Nenhuma entrega marcada para hoje."/> : (
            <div style={S.list}>{items.map(({client,date})=>(
              <DeliveryCard key={client.id+date} client={client} status={getStatus(client.id,date)}
                onStatusChange={(s,ded)=>setStatus(client.id,date,s,ded)} shelfProducts={shelfProducts}/>
            ))}</div>
          )}
        </div>
      );
    }

    // ─── WEEK VIEW ────────────────────────────────────────────────────────────────
    function WeekView({weekDays,weekDeliveries,weekOffset,setWeekOffset,getStatus,setStatus,shelfProducts}) {
      const [activeDay,setActiveDay] = useState(null);
      const t = todayISO();
      const active = activeDay||(weekDays.includes(t)?t:weekDays[0]);
      return (
        <div style={S.section}>
          <div style={S.weekNav}>
            <button style={S.navArrow} onClick={()=>{setWeekOffset(w=>w-1);setActiveDay(null);}}><ChevronLeft size={18}/></button>
            <span style={S.weekLabel}>{formatDateBR(weekDays[0])} – {formatDateBR(weekDays[6])}</span>
            <button style={S.navArrow} onClick={()=>{setWeekOffset(w=>w+1);setActiveDay(null);}}><ChevronRight size={18}/></button>
          </div>
          <div style={S.weekStrip}>
            {weekDays.map((d,i)=>{
              const count=weekDeliveries[d]?.length||0, isToday=d===t, isActive=d===active;
              return (
                <button key={d} onClick={()=>setActiveDay(d)} style={{...S.dayChip,...(isActive?S.dayChipActive:{}),...(isToday&&!isActive?S.dayChipToday:{})}}>
                  <span style={{...S.dayDow,...(isActive?{color:"#C9BBA8"}:{})}}>{weekdayShort[i]}</span>
                  <span style={{...S.dayNum,...(isActive?{color:"#FBF1E8"}:{})}}>{d.split("-")[2]}</span>
                  {count>0 && <span style={{...S.dayDot,...(isActive?{background:"#FBF1E8"}:{})}}/>}
                </button>
              );
            })}
          </div>
          <div style={{marginTop:20}}>
            {(weekDeliveries[active]||[]).length===0 ? <Empty text="Nenhuma entrega neste dia."/> : (
              <div style={S.list}>{weekDeliveries[active].map(c=>(
                <DeliveryCard key={c.id+active} client={c} status={getStatus(c.id,active)}
                  onStatusChange={(s,ded)=>setStatus(c.id,active,s,ded)} shelfProducts={shelfProducts}/>
              ))}</div>
            )}
          </div>
        </div>
      );
    }

    // ─── DELIVERY CARD ────────────────────────────────────────────────────────────
    function DeliveryCard({client,status,onStatusChange,shelfProducts}) {
      const [pickerOpen,setPickerOpen]   = useState(false);
      const [selProduct,setSelProduct]   = useState("");
      const [selAmount, setSelAmount]    = useState(String(client.units||1));
      const isAvulsa = client.frequency==="avulsa";

      const handleClick = (key) => {
        if (key==="entregue"&&isAvulsa&&status!=="entregue") { setPickerOpen(true); return; }
        onStatusChange(key);
      };
      const confirm = () => {
        const amt = parseInt(selAmount,10);
        if (!selProduct||!amt||amt<1) return;
        onStatusChange("entregue",{productId:selProduct,amount:amt});
        setPickerOpen(false);
      };
      return (
        <div style={S.card}>
          <div style={S.cardTop}>
            <div style={S.cardId}>
              <div style={S.dogBadge}><PawPrint size={14} color="#B8825A"/></div>
              <div><div style={S.cardDog}>{client.dog}</div><div style={S.cardTutor}>{client.tutor}</div></div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5}}>
              <span style={S.freqTag}>{freqLabel[client.frequency]}</span>
              {client.units ? <span style={S.unitsTag}>{client.units} {client.units===1?"unidade":"unidades"}</span> : null}
            </div>
          </div>
          <div style={S.cardAddr}><MapPin size={13} color="#A89A8C" style={{flexShrink:0,marginTop:2}}/><span>{client.address}</span></div>
          {pickerOpen ? (
            <div style={S.picker}>
              <p style={S.pickerLabel}>Qual produto sai do estoque?</p>
              {shelfProducts.length===0
                ? <p style={{fontSize:12.5,color:"#C0594B",margin:0}}>Nenhum produto em Estoque → Avulsos ainda.</p>
                : <select style={S.input} value={selProduct} onChange={e=>setSelProduct(e.target.value)}>
                    <option value="">Selecione…</option>
                    {shelfProducts.map(p=><option key={p.id} value={p.id}>{p.name} (saldo: {p.balance})</option>)}
                  </select>
              }
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <input type="number" min="1" style={{...S.input,flex:1}} value={selAmount} onChange={e=>setSelAmount(e.target.value)} placeholder="Qtd"/>
                <button style={S.confirmBtn} onClick={confirm} disabled={!selProduct}>Confirmar</button>
                <button style={S.cancelBtn} onClick={()=>setPickerOpen(false)}>Cancelar</button>
              </div>
            </div>
          ) : (
            <div style={S.statusRow}>
              {Object.entries(statusCfg).map(([key,conf])=>{
                const active=status===key;
                return (
                  <button key={key} onClick={()=>handleClick(key)} style={{...S.statusBtn,...(active?{background:conf.color,color:"#FFF7EF",borderColor:conf.color}:{background:"#FFF7EF",color:"#8A7A6C",borderColor:"#E8DDD0"})}}>
                    <conf.Icon size={13} sw={2.5} color={active?"#FFF7EF":"#8A7A6C"}/>{conf.label}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ─── CLIENTS VIEW ─────────────────────────────────────────────────────────────
    function ClientsView({clients,search,setSearch,onEdit,onDelete}) {
      const [confirmDel,setConfirmDel] = useState(null);
      const [deleting,  setDeleting]   = useState(null);
      const handleDel = async (id) => {
        setDeleting(id);
        await onDelete(id);
        setDeleting(null); setConfirmDel(null);
      };
      return (
        <div style={S.section}>
          <div style={S.searchBar}>
            <Search size={16} color="#A89A8C"/>
            <input style={S.searchInput} placeholder="Buscar por tutor, cão ou endereço…" value={search} onChange={e=>setSearch(e.target.value)}/>
            {search && <button style={{background:"transparent",border:"none",padding:2,display:"flex"}} onClick={()=>setSearch("")}><X size={14} color="#A89A8C"/></button>}
          </div>
          {clients.length===0 ? <Empty text={search?"Nenhum resultado.":"Nenhum cliente cadastrado ainda."}/> : (
            <div style={S.list}>
              {clients.map(c=>(
                <div key={c.id} style={S.clientRow}>
                  <div style={S.dogBadge}><PawPrint size={14} color="#B8825A"/></div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={S.cardDog}>{c.dog}</div>
                    <div style={S.cardTutor}>{c.tutor}</div>
                    <div style={{fontSize:11.5,color:"#A89A8C",marginTop:2}}>
                      {freqLabel[c.frequency]} · próxima: {formatDateBR(c.nextDate)}
                      {c.units ? ` · ${c.units} ${c.units===1?"unidade":"unidades"}` : ""}
                    </div>
                    {c.address && <div style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:"#C9BBA8",marginTop:3}}><MapPin size={11} color="#C9BBA8"/>{c.address}</div>}
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <button style={S.iconBtn} onClick={()=>onEdit(c)}><Edit3 size={15} color="#8A7A6C"/></button>
                    {confirmDel===c.id
                      ? <button style={{...S.iconBtn,background:"#C0594B",borderColor:"#C0594B",opacity:deleting===c.id?0.6:1}} disabled={deleting===c.id} onClick={()=>handleDel(c.id)}><Check size={15} color="#fff"/></button>
                      : <button style={S.iconBtn} onClick={()=>setConfirmDel(c.id)}><Trash2 size={15} color="#8A7A6C"/></button>
                    }
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─── STOCK VIEW ───────────────────────────────────────────────────────────────
    function StockView({clients,subscriberStock,subscriberStockLog,shelfProducts,shelfStockLog,petiscoProducts,petiscoStockLog,onAddSubscriberProduction,onAddShelfProduct,onAddShelfStockEntry,onDeleteShelfProduct,onAddPetiscoProduct,onAddPetiscoStockEntry,onDeletePetiscoProduct}) {
      const [tab,setTab]   = useState("assinantes");
      const [expClient,setExpClient] = useState(null);
      const [prodInputs,setProdInputs] = useState({});
      const [expProduct,setExpProduct] = useState(null);
      const [showNewProd,setShowNewProd] = useState(false);
      const [newProdName,setNewProdName] = useState("");
      const [savingProd,setSavingProd] = useState(false);
      const [stockInputs,setStockInputs] = useState({});
      const [expPetisco,setExpPetisco] = useState(null);
      const [showNewPet,setShowNewPet] = useState(false);
      const [newPetName,setNewPetName] = useState("");
      const [savingPet,setSavingPet] = useState(false);
      const [petInputs,setPetInputs] = useState({});

      const subscribers = clients.filter(c=>c.frequency!=="avulsa");

      const saveProd = async () => {
        if (!newProdName.trim()) return;
        setSavingProd(true);
        await onAddShelfProduct(newProdName.trim());
        setNewProdName(""); setShowNewProd(false); setSavingProd(false);
      };
      const savePet = async () => {
        if (!newPetName.trim()) return;
        setSavingPet(true);
        await onAddPetiscoProduct(newPetName.trim());
        setNewPetName(""); setShowNewPet(false); setSavingPet(false);
      };

      return (
        <div style={S.section}>
          <div style={S.headRow}><h2 style={S.sectionTitle}>Estoque</h2></div>
          <div style={S.stockTabRow}>
            {[["assinantes","Assinantes"],["avulsos","Avulsos"],["petiscos","Petiscos"]].map(([k,l])=>(
              <button key={k} style={{...S.stockTab,...(tab===k?S.stockTabActive:{})}} onClick={()=>setTab(k)}>{l}</button>
            ))}
          </div>

          {tab==="assinantes" && (
            subscribers.length===0 ? <Empty text="Nenhum cliente assinante cadastrado."/> :
            <div style={S.list}>
              {subscribers.map(c=>{
                const bal=subscriberStock[c.id]??0, isLow=bal<=(c.units||0), log=subscriberStockLog[c.id]||[], exp=expClient===c.id;
                return (
                  <div key={c.id} style={S.stockCard}>
                    <div style={S.stockTop}>
                      <div style={S.cardId}><div style={S.dogBadge}><PawPrint size={14} color="#B8825A"/></div><div><div style={S.cardDog}>{c.dog}</div><div style={S.cardTutor}>{c.tutor}</div></div></div>
                      <div style={{textAlign:"right"}}><div style={{...S.balNum,color:isLow?"#C0594B":"#3E332A"}}>{bal}</div><div style={S.balLabel}>em estoque</div></div>
                    </div>
                    {isLow && <div style={S.lowWarn}><AlertTriangle size={13} color="#C0594B"/><span>Saldo baixo — próxima entrega: {c.units||0} un.</span></div>}
                    <div style={S.stockRow}>
                      <input type="number" min="1" style={{...S.input,flex:1}} placeholder="Unidades produzidas"
                        value={prodInputs[c.id]||""} onChange={e=>setProdInputs(p=>({...p,[c.id]:e.target.value}))}
                        onKeyDown={e=>{if(e.key==="Enter"){const a=parseInt(prodInputs[c.id],10);if(a>0){onAddSubscriberProduction(c.id,a);setProdInputs(p=>({...p,[c.id]:""}))};}}}/>
                      <button style={S.addBtn} onClick={()=>{const a=parseInt(prodInputs[c.id],10);if(a>0){onAddSubscriberProduction(c.id,a);setProdInputs(p=>({...p,[c.id]:""}))};}}>
                        <Plus size={14} color="#FBF1E8" sw={2.5}/>Adicionar
                      </button>
                    </div>
                    <button style={S.histBtn} onClick={()=>setExpClient(exp?null:c.id)}>{exp?"Ocultar histórico":`Ver histórico (${log.length})`}</button>
                    {exp && <div style={S.histList}>{log.length===0?<p style={S.histEmpty}>Sem movimentações ainda.</p>:log.map((e,i)=><HistRow key={i} entry={e}/>)}</div>}
                  </div>
                );
              })}
            </div>
          )}

          {tab==="avulsos" && (
            <>
              <div style={{marginBottom:14}}>
                {showNewProd ? (
                  <div style={S.newProdBox}>
                    <input style={S.input} placeholder="Nome do produto (ex: Biscoito Natural 200g)" value={newProdName} onChange={e=>setNewProdName(e.target.value)} autoFocus/>
                    <div style={{display:"flex",gap:8,marginTop:8}}>
                      <button style={{...S.confirmBtn,opacity:savingProd?0.6:1}} disabled={savingProd} onClick={saveProd}>{savingProd?"Salvando…":"Salvar"}</button>
                      <button style={S.cancelBtn} onClick={()=>{setShowNewProd(false);setNewProdName("");}}>Cancelar</button>
                    </div>
                  </div>
                ) : (
                  <button style={S.newProdTrigger} onClick={()=>setShowNewProd(true)}><Plus size={16} color="#B8825A" sw={2.5}/>Cadastrar produto de prateleira</button>
                )}
              </div>
              {shelfProducts.length===0 ? <Empty text="Nenhum produto cadastrado ainda."/> :
                <div style={S.list}>
                  {shelfProducts.map(p=>{
                    const log=shelfStockLog[p.id]||[], exp=expProduct===p.id, isLow=p.balance<=0;
                    return (
                      <div key={p.id} style={S.stockCard}>
                        <div style={S.stockTop}>
                          <div style={S.cardId}><div style={S.dogBadge}><Package size={14} color="#B8825A"/></div><div style={S.cardDog}>{p.name}</div></div>
                          <div style={{textAlign:"right"}}><div style={{...S.balNum,color:isLow?"#C0594B":"#3E332A"}}>{p.balance}</div><div style={S.balLabel}>em estoque</div></div>
                        </div>
                        {isLow && <div style={S.lowWarn}><AlertTriangle size={13} color="#C0594B"/><span>Sem saldo disponível</span></div>}
                        <div style={S.stockRow}>
                          <input type="number" min="1" style={{...S.input,flex:1}} placeholder="Unidades a adicionar" value={stockInputs[p.id]||""} onChange={e=>setStockInputs(s=>({...s,[p.id]:e.target.value}))}/>
                          <button style={S.addBtn} onClick={()=>{const a=parseInt(stockInputs[p.id],10);if(a>0){onAddShelfStockEntry(p.id,a);setStockInputs(s=>({...s,[p.id]:""}))}}}>
                            <Plus size={14} color="#FBF1E8" sw={2.5}/>Adicionar
                          </button>
                        </div>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8}}>
                          <button style={S.histBtn} onClick={()=>setExpProduct(exp?null:p.id)}>{exp?"Ocultar histórico":`Ver histórico (${log.length})`}</button>
                          <button style={S.delProdBtn} onClick={()=>onDeleteShelfProduct(p.id)}><Trash2 size={13} color="#A89A8C"/></button>
                        </div>
                        {exp && <div style={S.histList}>{log.length===0?<p style={S.histEmpty}>Sem movimentações ainda.</p>:log.map((e,i)=><HistRow key={i} entry={e}/>)}</div>}
                      </div>
                    );
                  })}
                </div>
              }
            </>
          )}

          {tab==="petiscos" && (
            <>
              <div style={{marginBottom:14}}>
                {showNewPet ? (
                  <div style={S.newProdBox}>
                    <input style={S.input} placeholder="Nome do petisco (ex: Palito de Frango 100g)" value={newPetName} onChange={e=>setNewPetName(e.target.value)} autoFocus/>
                    <div style={{display:"flex",gap:8,marginTop:8}}>
                      <button style={{...S.confirmBtn,opacity:savingPet?0.6:1}} disabled={savingPet} onClick={savePet}>{savingPet?"Salvando…":"Salvar"}</button>
                      <button style={S.cancelBtn} onClick={()=>{setShowNewPet(false);setNewPetName("");}}>Cancelar</button>
                    </div>
                  </div>
                ) : (
                  <button style={S.newProdTrigger} onClick={()=>setShowNewPet(true)}><Plus size={16} color="#B8825A" sw={2.5}/>Cadastrar petisco</button>
                )}
              </div>
              {petiscoProducts.length===0 ? <Empty text="Nenhum petisco cadastrado ainda."/> :
                <div style={S.list}>
                  {petiscoProducts.map(p=>{
                    const log=petiscoStockLog[p.id]||[], exp=expPetisco===p.id, isLow=p.balance<=0;
                    return (
                      <div key={p.id} style={S.stockCard}>
                        <div style={S.stockTop}>
                          <div style={S.cardId}><div style={S.dogBadge}><Cookie size={14} color="#B8825A"/></div><div style={S.cardDog}>{p.name}</div></div>
                          <div style={{textAlign:"right"}}><div style={{...S.balNum,color:isLow?"#C0594B":"#3E332A"}}>{p.balance}</div><div style={S.balLabel}>em estoque</div></div>
                        </div>
                        {isLow && <div style={S.lowWarn}><AlertTriangle size={13} color="#C0594B"/><span>Sem saldo disponível</span></div>}
                        <div style={S.stockRow}>
                          <input type="number" min="1" style={{...S.input,flex:1}} placeholder="Unidades produzidas" value={petInputs[p.id]||""} onChange={e=>setPetInputs(s=>({...s,[p.id]:e.target.value}))}/>
                          <button style={S.addBtn} onClick={()=>{const a=parseInt(petInputs[p.id],10);if(a>0){onAddPetiscoStockEntry(p.id,a);setPetInputs(s=>({...s,[p.id]:""}))}}}>
                            <Plus size={14} color="#FBF1E8" sw={2.5}/>Adicionar
                          </button>
                        </div>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8}}>
                          <button style={S.histBtn} onClick={()=>setExpPetisco(exp?null:p.id)}>{exp?"Ocultar histórico":`Ver histórico (${log.length})`}</button>
                          <button style={S.delProdBtn} onClick={()=>onDeletePetiscoProduct(p.id)}><Trash2 size={13} color="#A89A8C"/></button>
                        </div>
                        {exp && <div style={S.histList}>{log.length===0?<p style={S.histEmpty}>Sem movimentações ainda.</p>:log.map((e,i)=><HistRow key={i} entry={e}/>)}</div>}
                      </div>
                    );
                  })}
                </div>
              }
            </>
          )}
        </div>
      );
    }

    function HistRow({entry}) {
      const pos = entry.amount>0;
      return (
        <div style={S.histRow}>
          {pos ? <ArrowUpCircle size={15} color="#5C8A5C" style={{flexShrink:0}}/> : <ArrowDownCircle size={15} color="#C0594B" style={{flexShrink:0}}/>}
          <div style={{flex:1}}><div style={S.histReason}>{entry.reason}</div><div style={S.histDate}>{formatDateBR(entry.date)}</div></div>
          <div style={{fontSize:13,fontWeight:700,color:pos?"#5C8A5C":"#C0594B"}}>{pos?"+":""}{entry.amount}</div>
        </div>
      );
    }

    // ─── CLIENT FORM MODAL ────────────────────────────────────────────────────────
    function ClientFormModal({initial,onClose,onSave}) {
      const [tutor,    setTutor]    = useState(initial?.tutor    ||"");
      const [dog,      setDog]      = useState(initial?.dog      ||"");
      const [address,  setAddress]  = useState(initial?.address  ||"");
      const [freq,     setFreq]     = useState(initial?.frequency||"semanal");
      const [nextDate, setNextDate] = useState(initial?.nextDate ||todayISO());
      const [units,    setUnits]    = useState(initial?.units?String(initial.units):"1");
      const [notes,    setNotes]    = useState(initial?.notes    ||"");
      const [error,    setError]    = useState("");
      const [saving,   setSaving]   = useState(false);

      const submit = async () => {
        if (!tutor.trim()||!dog.trim()||!address.trim()) { setError("Preencha tutor, cão e endereço."); return; }
        const u = parseInt(units,10);
        if (!u||u<1) { setError("Informe uma quantidade de unidades válida."); return; }
        setError(""); setSaving(true);
        try {
          await onSave({tutor:tutor.trim(),dog:dog.trim(),address:address.trim(),frequency:freq,nextDate,units:u,notes});
        } catch(e) {
          setError("Erro ao salvar. Verifique a conexão e tente novamente.");
          setSaving(false);
        }
      };

      return (
        <div style={S.overlay} onClick={onClose}>
          <div style={S.modal} onClick={e=>e.stopPropagation()}>
            <div style={S.modalHead}>
              <h3 style={S.modalTitle}>{initial?"Editar cliente":"Novo cliente"}</h3>
              <button style={S.modalClose} onClick={onClose} disabled={saving}><X size={18} color="#8A7A6C"/></button>
            </div>
            <div style={S.formBody}>
              <Fld label="Nome do tutor"><input style={S.input} value={tutor} onChange={e=>setTutor(e.target.value)} placeholder="Ex: Marina Costa"/></Fld>
              <Fld label="Nome do cão"><input style={S.input} value={dog} onChange={e=>setDog(e.target.value)} placeholder="Ex: Mia"/></Fld>
              <Fld label="Endereço de entrega"><input style={S.input} value={address} onChange={e=>setAddress(e.target.value)} placeholder="Rua, número, bairro"/></Fld>
              <Fld label="Frequência">
                <div style={S.freqGrid}>
                  {Object.entries(freqLabel).map(([k,l])=>(
                    <button key={k} type="button" onClick={()=>setFreq(k)} style={{...S.freqOpt,...(freq===k?S.freqOptActive:{})}}>{l}</button>
                  ))}
                </div>
              </Fld>
              <Fld label={freq==="avulsa"?"Data da entrega":"Próxima entrega (data âncora)"}>
                <input type="date" style={S.input} value={nextDate} onChange={e=>setNextDate(e.target.value)}/>
              </Fld>
              <Fld label="Quantidade de unidades por entrega">
                <input type="number" min="1" style={S.input} value={units} onChange={e=>setUnits(e.target.value)} placeholder="Ex: 4"/>
              </Fld>
              <Fld label="Observações (opcional)">
                <textarea style={{...S.input,minHeight:60,resize:"vertical",fontFamily:"inherit"}} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Ex: portaria pede documento"/>
              </Fld>
              {error && <p style={{color:"#C0594B",fontSize:13,margin:0,fontWeight:600}}>{error}</p>}
              <button style={{...S.saveBtn,opacity:saving?0.7:1}} onClick={submit} disabled={saving}>
                {saving?"Salvando…":initial?"Salvar alterações":"Adicionar cliente"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function Fld({label,children}) { return <div style={{display:"flex",flexDirection:"column",gap:6}}><label style={{fontSize:12.5,fontWeight:600,color:"#8A7A6C"}}>{label}</label>{children}</div>; }
    function Empty({text}) { return <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10,padding:"48px 20px",textAlign:"center"}}><PawPrint size={26} color="#D9CBBC"/><p style={{color:"#A89A8C",fontSize:14,margin:0}}>{text}</p></div>; }
